server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nook.crt;
    ssl_certificate_key /etc/nginx/ssl/nook.key;

    client_max_body_size 200M;

    location / {
        proxy_pass http://nook:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# Serveur HTTP (port 80) pour télécharger le CA sans SSL
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Page d'aide + téléchargement du CA
    location /ca {
        alias /usr/share/nginx/html/ca;
        autoindex on;
        autoindex_exact_size off;
        charset utf-8;
    }

    # Healthcheck endpoint (pas de SSL requis)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Rediriger tout le reste vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
