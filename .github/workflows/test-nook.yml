name: 🚀 CI - Test Nook (Backend + Frontend + Intégration)

on:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 7

  backend:
    name: Backend Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --manifest-path backend/Cargo.toml
      - run: cargo test --manifest-path backend/Cargo.toml
      - run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  integration:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - name: Verify frontend build
        run: ls -la frontend/build/

      - name: Build & start stack
        run: |
          docker compose up -d --build
          timeout 90s bash -c 'until curl -sf http://localhost:6300/health; do sleep 3; done'

      - name: ✅ Test APIs
        run: |
          curl -f http://localhost:6300/health
          curl -f -X POST http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_test","email":"ci@test.local","password":"Test123!"}' || true
          curl -w "%{http_code}" -s -o /dev/null http://localhost:6300/api/auth/me | grep 401
          curl -f -I http://localhost:6300/ | head -3

      - name: 🧪 E2E Playwright
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs si échec
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v --rmi local
