# Note: this file is the MAIN CI pipeline.
# It uses pre-built backend artifacts from Backend.yml, runs E2E tests, and security tests.

name: 4 ==> Test Nook

on:
  workflow_run:
    workflows: ["1==>🏗️ Backend Build & Artifact"]
    types:
      - completed
    branches:
      - develop
      - main
  workflow_dispatch:
concurrency:
  group: ci-test-nook-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # - Build Frontend (Artefact pour les jobs suivants)
  frontend-build:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build
        working-directory: ./
        run: |
          test -f frontend/build/index.html || (echo "❌ index.html manquant" && exit 1)
          FILE_COUNT=$(ls frontend/build | wc -l)
          echo "✅ Frontend OK - $FILE_COUNT fichiers"

      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 1

  # - Download backend artifacts + Integration + E2E
  integration-tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: frontend-build
    permissions:
      actions: read  # Required to download artifacts from other workflow runs
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - name: Verify frontend build
        run: |
          test -f frontend/build/index.html || (echo "❌ index.html manquant" && exit 1)
          echo "✅ frontend/build prêt ($(ls frontend/build | wc -l) fichiers)"

      # Find latest successful Backend.yml run for artifact download
      # For workflow_run trigger, use the triggering run; for workflow_dispatch, query API
      - name: Find latest successful Backend.yml run
        id: backend_run
        run: |
          GH_TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          
          # Try to get run ID from workflow_run context first
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Using triggering workflow_run ID: $RUN_ID"
          else
            # Fallback: query API for workflow_dispatch trigger
            RUN_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=20&branch=${{ github.ref_name }}&status=completed" | \
              jq -r '.workflow_runs[] | select(.name=="1==>🏗️ Backend Build & Artifact" and .conclusion=="success") | .id' | head -1)
          fi
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "❌ No successful Backend.yml run found"
            exit 1
          fi
          echo "backend_run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Found Backend.yml run: $RUN_ID"

      # Download pre-built backend artifacts from Backend.yml
      - name: Download backend artifact (amd64)
        id: download_amd64
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-x86_64-unknown-linux-musl
          path: backend/artifacts/amd64
          repository: ${{ github.repository }}
          run-id: ${{ steps.backend_run.outputs.backend_run_id }}
        continue-on-error: true

      - name: Download backend artifact (arm64)
        id: download_arm64
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-aarch64-unknown-linux-musl
          path: backend/artifacts/arm64
          repository: ${{ github.repository }}
          run-id: ${{ steps.backend_run.outputs.backend_run_id }}
        continue-on-error: true

      # Verify downloads succeeded
      - name: Verify artifact downloads succeeded
        run: |
          if [ "${{ steps.download_amd64.outcome }}" != "success" ]; then
            echo "❌ amd64 artifact download failed"
            exit 1
          fi
          if [ "${{ steps.download_arm64.outcome }}" != "success" ]; then
            echo "❌ arm64 artifact download failed"
            exit 1
          fi
          echo "✅ Both artifact downloads succeeded"

      # Validate downloaded backend artifacts exist with correct names
      - name: Validate backend artifacts downloaded
        run: |
          echo "=== Verifying amd64 artifact ==="
          ls -la backend/artifacts/amd64/
          test -f backend/artifacts/amd64/nook-backend-x86_64-unknown-linux-musl || (echo "❌ amd64 binary not found" && exit 1)
          echo "✅ amd64 binary found: $(ls -lh backend/artifacts/amd64/nook-backend-x86_64-unknown-linux-musl | awk '{print $5}')"

          echo ""
          echo "=== Verifying arm64 artifact ==="
          ls -la backend/artifacts/arm64/
          test -f backend/artifacts/arm64/nook-backend-aarch64-unknown-linux-musl || (echo "❌ arm64 binary not found" && exit 1)
          echo "✅ arm64 binary found: $(ls -lh backend/artifacts/arm64/nook-backend-aarch64-unknown-linux-musl | awk '{print $5}')"

      # Prepare backend binaries - rename to match Dockerfile.release expectations
      - name: Prepare backend binaries
        run: |
          # Copy to location expected by Dockerfile.release (backend/nook-backend-${TARGETARCH})
          mkdir -p backend/amd64 backend/arm64
          cp backend/artifacts/amd64/nook-backend-x86_64-unknown-linux-musl backend/amd64/nook-backend-amd64
          cp backend/artifacts/arm64/nook-backend-aarch64-unknown-linux-musl backend/arm64/nook-backend-arm64
          chmod +x backend/amd64/nook-backend-amd64
          chmod +x backend/arm64/nook-backend-arm64
          echo "✅ Backend binaries prepared:"
          ls -la backend/amd64/nook-backend-amd64
          ls -la backend/arm64/nook-backend-arm64

      - name: Create .env file for Docker Compose
        run: |
          cat > .env << 'EOF'
          # Nook CI Environment (test values)
          TZ=Europe/Paris
          PORT=6300
          PUBLIC_SITE_URL=http://localhost:6300
          E2EE_SETUP=0
          RATE_LIMIT_PER_MIN=60
          DATA_DIR=./nook-data
          LOGS_DIR=./nook-logs
          NGINX_SSL_DIR=./nginx-ssl
          TURN_CONFIG_DIR=./turn-config
          CPUS_LIMIT=1.5
          MEMORY_LIMIT=1024M
          CPUS_RESERVATION=0.5
          MEMORY_RESERVATION=256M
          NGINX_HTTPS_PORT=6443
          TURN_PORT=3478
          # Test secrets (not real - for CI only)
          TURN_SECRET=turn_test_secret_2026_nook_ci
          ADMIN_INITIAL_PASSWORD=AdminCI2026!
          EOF
          echo "✅ .env file created"
          cat .env

      - name: Clean previous runs
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          rm -rf nook-data nook-logs turn-config nginx-ssl
          mkdir -p nook-data nook-logs turn-config nginx-ssl
          chmod 0777 nook-data nook-logs turn-config

      - name: Build Docker image (using pre-built backend binary)
        run: |
          # Use Dockerfile.release pattern - copy pre-built binary
          docker build \
            --tag nook-ci:local \
            --file Dockerfile.release \
            --build-arg TARGETARCH=amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
          echo "✅ Image nook-ci:local construite avec binaire pré-compilé"

      - name: Start stack
        run: |
          echo "=== Starting Docker Compose Stack ==="
          echo "=== Docker Compose Version ==="
          docker compose version
          echo "=== Docker Compose Config ==="
          docker compose config
          echo "=== Starting containers ==="
          docker compose up -d --force-recreate nook

          echo "=== Waiting for container to start ==="
          sleep 5
          echo "=== Container status ==="
          docker compose ps
          echo "=== Container logs (first 50 lines) ==="
          docker compose logs --tail=50 nook

          echo "⏳ Waiting for healthcheck (max 120s)..."
          TIMEOUT=0
          while ! curl -sf http://localhost:6300/api/health | grep -q "OK"; do
            sleep 2
            TIMEOUT=$((TIMEOUT + 2))
            if [ $TIMEOUT -gt 120 ]; then
              echo "❌ Healthcheck timeout after 120s"
              echo "=== Full container logs ==="
              docker compose logs nook
              echo "=== Docker inspect ==="
              docker inspect nook-nook-1 2>/dev/null | head -100 || docker inspect $(docker compose ps -q nook) 2>/dev/null | head -100 || true
              exit 1
            fi
          done
          echo "✅ Stack started successfully - healthcheck OK"
          echo "=== Final container status ==="
          docker compose ps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies + Playwright
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Diagnostic Playwright
        working-directory: ./frontend
        run: |
          echo "=== Vérification de l'environnement ==="
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "Playwright: $(npx playwright --version 2>/dev/null || echo 'non installé')"
          echo ""
          echo "=== Fichiers de tests ==="
          ls -la tests/
          echo ""
          echo "=== Vérification du serveur ==="
          curl -s http://localhost:6300/api/health || echo "❌ Serveur non accessible"

      # - Shell Integration Tests
      - name: Test Health & Auth
        run: |
          # Verifier health
          HEALTH=$(curl -s http://localhost:6300/api/health)
          echo "✅ Health: $HEALTH"
          [ "$HEALTH" = "OK" ] || (echo "❌ Health check échoue" && exit 1)

          # Verifier auth/me sans cookie -> 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6300/api/auth/me)
          echo "✅ GET /auth/me sans cookie -> HTTP $STATUS (attendu 401)"
          [ "$STATUS" = "401" ] || (echo "❌ Attendu 401, reçu $STATUS" && exit 1)

      - name: Test Auth flows
        continue-on-error: true
        run: |
          echo "=== Test registration ==="
          REG=$(curl -s -X POST http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"test_e2e_new","password":"E2eTest2026!","email":"test@nook.local","name":"Test User"}')
          echo "✅ Register: $REG"

          echo "=== Admin login (premier accès) ==="
          curl -s -c /tmp/admin-cookies.txt -o /tmp/admin-body.txt -X POST \
            http://localhost:6300/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"'"${ADMIN_INITIAL_PASSWORD:-AdminCI2026!}"'"}'

          ADMIN_ID=$(jq -r '.user.id // empty' /tmp/admin-body.txt 2>/dev/null || echo "")
          if [ -n "$ADMIN_ID" ]; then
            echo "✅ Login admin: OK"

            echo "=== Change password ==="
            curl -s -X POST http://localhost:6300/api/auth/change-password \
              -H "Content-Type: application/json" \
              -b /tmp/admin-cookies.txt \
              -d '{"new_password":"AdminCI2026!","user_id":"'"$ADMIN_ID"'"}'

            # Re-login with new password
            curl -s -c /tmp/admin-cookies2.txt -X POST \
              http://localhost:6300/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"AdminCI2026!"}' > /dev/null
            echo "✅ Re-login avec nouveau mot de passe"
          else
            echo "⚠️ Login admin échoue, test avec AdminCI2026!"
            curl -s -c /tmp/admin-cookies.txt -X POST \
              http://localhost:6300/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"AdminCI2026!"}'
          fi

          ADMIN_COOKIE=$(grep -o 'auth_token=[^;]*' /tmp/admin-cookies.txt 2>/dev/null | head -1 || echo "")

          echo "=== /auth/me ==="
          ME=$(curl -s -b /tmp/admin-cookies.txt http://localhost:6300/api/auth/me)
          echo "✅ /auth/me: $ME"

          echo "=== Register + approve ==="
          REG2=$(curl -s -X POST http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"e2e_ci","password":"E2eTest2026!","email":"e2e@ci.nook","name":"E2E CI"}')
          echo "✅ Register e2e_ci: $REG2"

          sleep 2

          PENDING=$(curl -s -b /tmp/admin-cookies.txt http://localhost:6300/api/users/pending)
          E2E_ID=$(echo "$PENDING" | jq -r '.users[] | select(.username=="e2e_ci") | .id // empty' 2>/dev/null || echo "")

          if [ -n "$E2E_ID" ]; then
            curl -s -X POST http://localhost:6300/api/users/approve \
              -H "Content-Type: application/json" \
              -b /tmp/admin-cookies.txt \
              -d '{"user_id":"'"$E2E_ID"'"}'
            echo "✅ User e2e_ci approved"
          fi

      - name: Test Security endpoints
        continue-on-error: true
        run: |
          ADMIN_COOKIE=$(grep -o 'auth_token=[^;]*' /tmp/admin-cookies.txt 2>/dev/null | head -1 || echo "")

          echo "=== XSS prevention ==="
          XSS=$(curl -s -X POST http://localhost:6300/api/conversations/default_global/messages \
            -H "Content-Type: application/json" \
            -b /tmp/admin-cookies.txt \
            -d '{"content":"<script>alert(1)</script>","encrypted":false}')
          echo "✅ XSS stored: $XSS"

          echo "=== Upload fichier vide ==="
          MY_USER_ID=$(curl -s -b /tmp/admin-cookies.txt http://localhost:6300/api/auth/me | jq -r '.user.id // empty' 2>/dev/null || echo "")
          if [ -n "$MY_USER_ID" ]; then
            UPLOAD_EMPTY=$(curl -s -X POST http://localhost:6300/api/upload/chat \
              -b /tmp/admin-cookies.txt \
              -F "file=@/dev/null" \
              -F "conversation_id=default_global" \
              -F "from_user_id=$MY_USER_ID")
            echo "✅ Upload vide: $UPLOAD_EMPTY"
          fi

      # - E2E Playwright
      - name: E2E Playwright
        id: playwright
        run: |
          cd frontend
          npx playwright test 2>&1 | tee /tmp/playwright-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "playwright_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Tous les tests E2E ont passé"
            grep -E "passed|failed|skipped" /tmp/playwright-output.txt || true
          else
            echo "❌ Tests E2E échoués"
            grep -E "passed|failed|skipped" /tmp/playwright-output.txt || true
          fi

      - name: Capture logs Docker
        if: always()
        run: |
          docker compose logs --tail=200 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            > /tmp/docker.log || true
          echo "✅ $(wc -l < /tmp/docker.log) lignes de logs Docker capturées"

      - name: Generate TEST_REPORT.md
        if: always()
        run: |
          export RUN_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export COMMIT_SHA="${{ github.sha }}"
          export BRANCH="${{ github.ref_name }}"
          export REPO="${{ github.repository }}"
          export PLAYWRIGHT_EXIT="${{ steps.playwright.outputs.playwright_exit || '1' }}"

          # Generate report
          python3 .github/scripts/generate-test-report.py \
            --json /tmp/playwright-results.json \
            --docker /tmp/docker.log \
            --output .hermes/TEST_REPORT.md \
            2>/dev/null || \
          python3 .github/scripts/generate-test-report.py \
            --json /tmp/playwright-results.json \
            --docker /tmp/docker.log \
            --output .hermes/TEST_REPORT.md

          echo "✅ Rapport généré"
          cat .hermes/TEST_REPORT.md

      - name: Commit TEST_REPORT.md
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save report BEFORE any git operations that might reset it
          cp .hermes/TEST_REPORT.md /tmp/TEST_REPORT.md 2>/dev/null || true

          # Reset tracked files (node_modules changes, etc.) but NOT .hermes/
          git checkout -- frontend/ backend/ 2>/dev/null || true
          git clean -fd --exclude=.hermes/ 2>/dev/null || true

          # Restore report after cleanup
          cp /tmp/TEST_REPORT.md .hermes/TEST_REPORT.md 2>/dev/null || true

          git add .hermes/TEST_REPORT.md

          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || git reset --hard origin/${{ github.ref_name }}
            # Restore again after rebase
            cp /tmp/TEST_REPORT.md .hermes/TEST_REPORT.md 2>/dev/null || true
            git add .hermes/TEST_REPORT.md
            git commit -m "ci: TEST_REPORT.md [run ${{ github.run_id }}]"
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          export TURN_SECRET=turn_test_secret_2026_nook_ci
          docker compose down -v --remove-orphans