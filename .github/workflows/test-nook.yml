name: "3==> CI - Test Nook (Backend + Frontend + Integration)"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: test-nook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: FRONTEND BUILD
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: "🎨 Frontend Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      
      - name: Type check (TypeScript)
        working-directory: ./frontend
        run: npx tsc --noEmit || true  # Non bloquant
      
      - name: Build
        working-directory: ./frontend
        run: npm run build
      
      - name: Verify build
        working-directory: ./frontend
        run: |
          test -f build/index.html || (echo "index.html manquant" && exit 1)
          FILE_COUNT=$(ls build | wc -l)
          echo "✅ Frontend OK — $FILE_COUNT fichiers"
      
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 1

  # ═══════════════════════════════════════════════════════════
  # JOB 2: BACKEND BUILD + CHECK + TESTS
  # ═══════════════════════════════════════════════════════════
  backend:
    name: "🦀 Backend Rust"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      
      - name: Install libsodium dev
        run: sudo apt-get install -y libsodium-dev pkg-config
      
      - name: cargo fmt (check)
        working-directory: ./backend
        run: cargo fmt -- --check || true  # Non bloquant
      
      - name: cargo check
        working-directory: ./backend
        env:
          SQLX_OFFLINE: true
        run: cargo check
      
      - name: cargo test
        working-directory: ./backend
        env:
          SQLX_OFFLINE: true
        run: cargo test
      
      - name: cargo clippy
        id: clippy
        working-directory: ./backend
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo clippy -- -D warnings 2>&1 | tee /tmp/cargo-clippy.txt || true  # Non bloquant
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

  # ═══════════════════════════════════════════════════════════
  # JOB 3: INTEGRATION TESTS (Docker Stack + E2E)
  # ═══════════════════════════════════════════════════════════
  integration:
    name: "🔗 Integration Tests"
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Download frontend build ───────────────────────────
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - name: Verify frontend build
        run: |
          test -f frontend/build/index.html || (echo "index.html manquant" && exit 1)
          echo "frontend/build pret ($(ls frontend/build | wc -l) fichiers)"

      # ── Build Docker image ────────────────────────────────
      - name: Build Docker image
        run: |
          docker build --tag nook-ci:local --file Dockerfile .
          echo "Image nook-ci:local construite"

      # ── Start stack ───────────────────────────────────────
      - name: Start stack
        env:
          NOOK_IMAGE: nook-ci:local
          RATE_LIMIT_PER_MIN: 120
        run: |
          docker compose up -d
          
          echo "Attente healthcheck..."
          TIMEOUT=0
          while ! curl -sf http://localhost:6300/api/health | grep -q "OK"; do
            sleep 2
            TIMEOUT=$((TIMEOUT + 2))
            if [ $TIMEOUT -gt 60 ]; then
              echo "Healthcheck timeout après 60s"
              docker compose logs --tail=50
              exit 1
            fi
          done
          echo "✅ Stack démarrée"

      # ── Install Playwright ────────────────────────────────
      - name: Install Playwright
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx playwright install --with-deps chromium

      # ── Test: API Health ─────────────────────────────────
      - name: Test API Health
        run: |
          # Vérifier health
          HEALTH=$(curl -s http://localhost:6300/api/health)
          echo "Health: $HEALTH"
          [ "$HEALTH" = "OK" ] || (echo "Health check échoué" && exit 1)
          
          # Vérifier auth/me sans cookie → 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6300/api/auth/me)
          echo "GET /auth/me sans cookie → HTTP $STATUS (attendu 401)"
          [ "$STATUS" = "401" ] || (echo "Attendu 401, reçu $STATUS" && exit 1)

      # ── Test: Auth flows ─────────────────────────────────
      - name: Test Auth flows
        continue-on-error: true
        run: |
          echo "=== Test registration ==="
          # Créer un user de test (devrait échouer si déjà existe ou créer un nouveau)
          REG=$(curl -s -X POST http://localhost:6300/api/auth/register             -H "Content-Type: application/json"             -d '{"username":"test_e2e_new","password":"TestPass123!","email":"test@nook.local","name":"Test User"}')
          echo "Register: $REG"
          
          echo "=== Test mot de passe faible ==="
          WEAK=$(curl -s -X POST http://localhost:6300/api/auth/register             -H "Content-Type: application/json"             -d '{"username":"weak_pwd_test","password":"123","email":"weak@nook.local","name":"Weak"}')
          echo "Weak password: $WEAK"
          # Devrait rejeter - 8 chars min
          
          echo "=== Test login admin ==="
          HEADERS=$(curl -s -D - -o /dev/null -X POST             http://localhost:6300/api/auth/login             -H "Content-Type: application/json"             -d '{"username":"admin","password":"changeme2026"}')
          
          ADMIN_COOKIE=$(echo "$HEADERS" | grep -i "set-cookie" | grep -o "auth_token=[^;]*" | head -1)
          if [ -n "$ADMIN_COOKIE" ]; then
            echo "✅ Login admin réussi"
            echo "ADMIN_COOKIE=$ADMIN_COOKIE" >> $GITHUB_ENV
          else
            echo "❌ Login admin échoué"
            echo "Headers: $HEADERS"
            exit 1
          fi
          
          echo "=== Test auth/me avec cookie ==="
          ME=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/auth/me)
          echo "/auth/me: $ME"
          
          echo "=== Test change password (admin sur lui-même) ==="
          # Admin change son propre mot de passe
          CHG=$(curl -s -X POST http://localhost:6300/api/auth/change-password             -H "Content-Type: application/json"             -H "Cookie: $ADMIN_COOKIE"             -d '{"new_password":"NewSecurePass1!","user_id":"admin-initial-id-0000-0000-000000000001"}')
          echo "Change password admin: $CHG"
          
          echo "=== Test register puis approve (flux complet) ==="
          REG2=$(curl -s -X POST http://localhost:6300/api/auth/register             -H "Content-Type: application/json"             -d '{"username":"e2e_ci","password":"E2eTest123!","email":"e2e@ci.nook","name":"E2E CI"}')
          echo "Register e2e_ci: $REG2 (200/201/409 OK)"
          
          sleep 2
          
          PENDING=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/users/pending)
          echo "Pending users: $PENDING"
          
          E2E_ID=$(echo "$PENDING" | python3 -c '
          import sys,json
          data=json.load(sys.stdin)
          users=data if isinstance(data,list) else data.get("users",[])
          match=[u for u in users if u.get("username")=="e2e_ci"]
          print(match[0]["id"] if match else "")
          ')
          
          if [ -n "$E2E_ID" ]; then
            APPROVE=$(curl -s -X POST http://localhost:6300/api/users/approve               -H "Content-Type: application/json"               -H "Cookie: $ADMIN_COOKIE"               -d "{"user_id":"$E2E_ID"}")
            echo "Approve: $APPROVE"
          else
            echo "e2e_ci déjà approuvé ou non trouvé"
          fi

      # ── Test: Security ───────────────────────────────────
      - name: Test Security endpoints
        continue-on-error: true
        run: |
          echo "=== Test XSS prevention ==="
          # Essayer d'injecter du HTML dans un message
          XSS=$(curl -s -X POST http://localhost:6300/api/conversations/default_global/messages             -H "Content-Type: application/json"             -H "Cookie: $ADMIN_COOKIE"             -d '{"content":"<script>alert(1)</script>","encrypted":false}')
          echo "Message XSS: $XSS"
          
          echo "=== Test upload fichier invalide ==="
          # Essayer d'uploader un fichier vide
          UPLOAD_EMPTY=$(curl -s -X POST http://localhost:6300/api/upload/chat             -H "Cookie: $ADMIN_COOKIE"             -F "file=@/dev/null"             -F "conversation_id=default_global"             -F "from_user_id=admin-initial-id-0000-0000-000000000001")
          echo "Upload vide: $UPLOAD_EMPTY"
          
          echo "=== Test upload taille >50MB (simulation header) ==="
          # Vérifier que le header Content-Length est respecté
          echo "Note: Test simulé via header, upload réel trop long pour CI"

      # ── Test: Chat & Conversations ───────────────────────
      - name: Test Chat & Conversations
        continue-on-error: true
        run: |
          echo "=== Test conversation par défaut ==="
          CONVS=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/conversations)
          echo "Conversations: $CONVS"
          
          echo "=== Test envoi message ==="
          MSG=$(curl -s -X POST http://localhost:6300/api/conversations/default_global/messages             -H "Content-Type: application/json"             -H "Cookie: $ADMIN_COOKIE"             -d '{"content":"Message test CI","encrypted":false}')
          echo "Message envoyé: $MSG"
          
          echo "=== Test récupération messages ==="
          MESSAGES=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/conversations/default_global/messages)
          echo "Messages: $(echo "$MESSAGES" | python3 -c 'import sys,json; data=json.load(sys.stdin); print(len(data) if isinstance(data,list) else "erreur")')"
          
          echo "=== Test rename conversation ==="
          RENAME=$(curl -s -X PATCH http://localhost:6300/api/conversations/default_global/rename             -H "Content-Type: application/json"             -H "Cookie: $ADMIN_COOKIE"             -d '{"name":"Test Rename"}')
          echo "Rename: $RENAME"

      # ── Test: WebSocket Live ──────────────────────────────
      - name: Test WebSocket Live
        continue-on-error: true
        run: |
          echo "=== Test connexion WebSocket ==="
          # Récupérer le cookie
          HEADERS=$(curl -s -D - -o /dev/null -X POST             http://localhost:6300/api/auth/login             -H "Content-Type: application/json"             -d '{"username":"admin","password":"NewSecurePass1!"}')
          WS_COOKIE=$(echo "$HEADERS" | grep -i "set-cookie" | grep -o "auth_token=[^;]*" | head -1)
          
          if [ -n "$WS_COOKIE" ]; then
            echo "✅ Login pour WS réussi"
            
            # Test connexion WS simple (timeout 5s)
            python3 -c "
            import asyncio
            import websockets
            
            async def test_ws():
                uri = 'ws://localhost:6300/ws'
                try:
                    async with websockets.connect(
                        uri,
                        additional_headers={'Cookie': '$WS_COOKIE'},
                        open_timeout=5
                    ) as ws:
                        await ws.send('{"type":"test"}')
                        response = await asyncio.wait_for(ws.recv(), timeout=3)
                        print(f'✅ WS message reçu: {response[:100]}...')
                except Exception as e:
                    print(f'⚠️  WS test: {e}')
            
            asyncio.run(test_ws())
            " || echo "⚠️ Test WebSocket non conclant"
          else
            echo "⚠️ Pas de cookie pour WS test"
          fi

      # ── Test: Polls ──────────────────────────────────────
      - name: Test Polls complet
        continue-on-error: true
        run: |
          echo "=== Test création poll ==="
          POLL=$(curl -s -X POST http://localhost:6300/api/polls             -H "Content-Type: application/json"             -H "Cookie: $ADMIN_COOKIE"             -d '{"question":"Test CI poll?","options":["Oui","Non","Peut-être"],"expires_in_hours":1}')
          echo "Poll créé: $POLL"
          
          POLL_ID=$(echo "$POLL" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || echo "")
          
          if [ -n "$POLL_ID" ]; then
            echo "=== Test vote poll ==="
            VOTE=$(curl -s -X POST http://localhost:6300/api/polls/$POLL_ID/votes               -H "Content-Type: application/json"               -H "Cookie: $ADMIN_COOKIE"               -d '{"option_index":0}')
            echo "Vote: $VOTE"
            
            echo "=== Test GET polls ==="
            POLLS=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/polls)
            echo "Liste polls: $(echo "$POLLS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)) if isinstance(json.load(sys.stdin),list) else "?")' 2>/dev/null || echo "?")
            
            echo "=== Test fermeture poll ==="
            CLOSE=$(curl -s -X DELETE http://localhost:6300/api/polls/$POLL_ID               -H "Cookie: $ADMIN_COOKIE")
            echo "Fermeture: $CLOSE"
          fi

      # ── Test: Calendar/Events ───────────────────────────
      - name: Test Calendar/Events complet
        continue-on-error: true
        run: |
          echo "=== Test création événement ==="
          EVT=$(curl -s -X POST http://localhost:6300/api/events             -H "Content-Type: application/json"             -H "Cookie: $ADMIN_COOKIE"             -d '{"title":"Test CI Event","date":"2026-04-02","description":"Event créé par CI","time":"10:00"}')
          echo "Event créé: $EVT"
          
          EVT_ID=$(echo "$EVT" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || echo "")
          
          if [ -n "$EVT_ID" ]; then
            echo "=== Test GET events ==="
            EVENTS=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/events)
            echo "Liste events: $(echo "$EVENTS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)) if isinstance(json.load(sys.stdin),list) else "?")' 2>/dev/null || echo "?")
            
            echo "=== Test suppression event ==="
            DELETE=$(curl -s -X DELETE http://localhost:6300/api/events/$EVT_ID -H "Cookie: $ADMIN_COOKIE")
            echo "Suppression: HTTP $DELETE"
          fi

      # ── E2E Playwright ──────────────────────────────────
      - name: E2E Playwright
        id: playwright
        continue-on-error: true
        run: |
          cd frontend
          npx playwright test 2>&1 | tee /tmp/playwright-output.txt || true
          EXIT_CODE=${PIPESTATUS[0]}
          echo "playwright_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Afficher résultat
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Tous les tests E2E ont passé"
            grep -E "passed|failed|skipped" /tmp/playwright-output.txt || true
          else
            echo "❌ Tests E2E échoués"
            grep -E "✗|passed|failed|skipped" /tmp/playwright-output.txt || true
          fi

      # ── Capture logs ────────────────────────────────────
      - name: Capture logs Docker
        if: always()
        run: |
          docker compose logs --tail=200 2>/dev/null             | sed 's/\x1b\[[0-9;]*m//g'             > /tmp/docker.log || true
          echo "$(wc -l < /tmp/docker.log) lignes de logs Docker capturées"

      # ── Generate report ─────────────────────────────────
      - name: Generate TEST_REPORT.md
        if: always()
        env:
          PLAYWRIGHT_EXIT: ${{ steps.playwright.outputs.playwright_exit }}
          RUN_DATE: "$(date -u '+%Y-%m-%d %H:%M UTC')"
        run: |
          export RUN_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          python3 scripts/generate-test-report.py             --json   /tmp/playwright-results.json             --docker /tmp/docker.log             --output .claude/TEST_REPORT.md
          echo "Rapport généré"
          head -20 .claude/TEST_REPORT.md

      # ── Commit report ──────────────────────────────────
      - name: Commit TEST_REPORT.md
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/TEST_REPORT.md
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git commit -m "ci: TEST_REPORT.md [run ${{ github.run_id }}]"
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "Rapport commité"
          fi

      # ── Logs on failure ────────────────────────────────
      - name: Logs si échec
        if: failure()
        run: |
          echo "=== Docker logs ==="
          docker compose logs --tail=100
          echo "=== Playwright output ==="
          cat /tmp/playwright-output.txt || echo "(vide)"

      # ── Artifacts ──────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # ── Cleanup ────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: docker compose down -v --rmi local
