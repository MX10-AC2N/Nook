name: "3==> CI - Test Nook (Backend + Frontend + Integration)"

on:
  workflow_dispatch:

jobs:
  frontend:
    name: "Frontend Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 1

  backend:
    name: "Backend Rust"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo check
        run: cargo check --manifest-path backend/Cargo.toml
      - name: cargo test
        run: cargo test --manifest-path backend/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  integration:
    name: "Integration Docker"
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - name: "Verification frontend build"
        run: |
          test -f frontend/build/index.html || (echo "index.html manquant" && exit 1)
          echo "frontend/build pret ($(ls frontend/build | wc -l) fichiers)"

      - name: "Build image Docker"
        run: |
          docker build --tag nook-ci:local --file Dockerfile .
          echo "Image nook-ci:local construite"

      - name: "Demarrage stack"
        run: |
          NOOK_IMAGE=nook-ci:local \
          RATE_LIMIT_PER_MIN=120 \
          docker compose -f docker-compose.yml up -d

          echo "Attente healthcheck..."
          timeout 120s bash -c 'until curl -sf http://localhost:6300/api/health | grep -q "OK"; do sleep 3; done'
          echo "Stack demarree"

      - name: "Test APIs"
        run: |
          STATUS=$(curl -sw "%{http_code}" -o /dev/null http://localhost:6300/api/auth/me)
          [ "$STATUS" = "401" ] || (echo "Attendu 401, recu $STATUS" && exit 1)
          echo "APIs OK (auth/me → 401)"

      - name: "Setup user E2E"
        run: |
          set -e

          REG_HTTP=$(curl -s -o /tmp/reg.json -w "%{http_code}" -X POST \
            http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"e2e_ci","password":"E2eTest123!","email":"e2e@ci.nook","name":"E2E CI"}')
          echo "Register e2e_ci : $REG_HTTP"
          [[ "$REG_HTTP" == "200" || "$REG_HTTP" == "201" || "$REG_HTTP" == "409" ]] || exit 1

          LOGIN_HEADERS=$(curl -s -D - -o /dev/null -X POST \
            http://localhost:6300/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"changeme2026"}')

          ADMIN_COOKIE=$(echo "$LOGIN_HEADERS" | grep -i "set-cookie" | grep -o "auth_token=[^;]*" | head -1)
          [ -n "$ADMIN_COOKIE" ] || (echo "Login admin echoue" && exit 1)

          sleep 2
          PENDING=$(curl -s -H "Cookie: $ADMIN_COOKIE" http://localhost:6300/api/users/pending)
          E2E_ID=$(echo "$PENDING" | python3 -c '
          import sys,json
          data=json.load(sys.stdin)
          users=data if isinstance(data,list) else data.get("users",[])
          match=[u for u in users if u.get("username")=="e2e_ci"]
          print(match[0]["id"] if match else "")
          ')

          if [ -n "$E2E_ID" ]; then
            curl -s -X POST http://localhost:6300/api/users/approve \
              -H "Content-Type: application/json" \
              -H "Cookie: $ADMIN_COOKIE" \
              -d "{\"user_id\":\"$E2E_ID\"}" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('success'), f'Approbation echouee: {d}'"
            echo "e2e_ci approuve"
          else
            echo "e2e_ci deja approuve"
          fi

      # ── Tests E2E Playwright ──────────────────────────────────────────────
      - name: "E2E Playwright"
        id: playwright
        env:
          CI: true
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          # Le reporter JSON est configuré dans playwright.config.ts
          # Il écrit dans /tmp/playwright-results.json (outputFile dans playwright.config.ts)
          npx playwright test 2>&1 | tee /tmp/playwright-output.txt || true
          EXIT_CODE=${PIPESTATUS[0]}
          echo "playwright_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # ── Sauvegarde des logs Docker pour le rapport ────────────────────────
      - name: "Capture logs Docker"
        if: always()
        run: |
          docker compose logs --tail=200 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            > /tmp/docker.log || true
          echo "$(wc -l < /tmp/docker.log) lignes de logs Docker capturées"

      # ── Génération du rapport via le script Python ────────────────────────
      - name: "Generer TEST_REPORT.md"
        if: always()
        env:
          PLAYWRIGHT_EXIT: ${{ steps.playwright.outputs.playwright_exit }}
          RUN_DATE:        ${{ github.event.repository.updated_at }}
          RUN_URL:         "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA:      ${{ github.sha }}
          REPO:            ${{ github.repository }}
          BRANCH:          ${{ github.ref_name }}
        run: |
          # RUN_DATE en format lisible
          export RUN_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          python3 scripts/generate-test-report.py \
            --json   /tmp/playwright-results.json \
            --docker /tmp/docker.log \
            --output .claude/TEST_REPORT.md

          echo "--- Aperçu du rapport ---"
          head -25 .claude/TEST_REPORT.md

      # ── Commit du rapport ─────────────────────────────────────────────────
      - name: "Commit TEST_REPORT.md"
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/TEST_REPORT.md
          if git diff --staged --quiet; then
            echo "Aucun changement dans le rapport"
          else
            git commit -m "ci: TEST_REPORT.md [run ${{ github.run_id }}]"
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "Rapport commite"
          fi

      # ── Logs si échec ─────────────────────────────────────────────────────
      - name: "Logs Docker si echec"
        if: failure()
        run: docker compose logs --tail=200

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: "Upload rapport Playwright HTML"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: "Cleanup"
        if: always()
        run: docker compose down -v --rmi local
