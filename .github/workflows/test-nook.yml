name: "3==> CI - Test Nook (Backend + Frontend + Integration)"

on:
  workflow_dispatch:

jobs:
  frontend:
    name: "Frontend Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 1

  backend:
    name: "Backend Rust"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo check
        run: cargo check --manifest-path backend/Cargo.toml
      - name: cargo test
        run: cargo test --manifest-path backend/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  integration:
    name: "Integration Docker"
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire pour pouvoir commiter le rapport MD en fin de job
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - name: "Verification frontend build"
        run: |
          test -f frontend/build/index.html || (echo "index.html manquant" && exit 1)
          echo "frontend/build pret ($(ls frontend/build | wc -l) fichiers)"

      # ── Build l'image depuis les sources ──────────────────────────────────
      - name: "Build image Docker depuis les sources"
        run: |
          docker build \
            --tag nook-ci:local \
            --file Dockerfile \
            .
          echo "Image nook-ci:local construite"
          docker images nook-ci:local

      # ── Démarrer avec l'image locale ──────────────────────────────────────
      - name: "Demarrage stack avec image locale"
        run: |
          NOOK_IMAGE=nook-ci:local \
          RATE_LIMIT_PER_MIN=120 \
          docker compose \
            -f docker-compose.yml \
            up -d

          echo "Attente du healthcheck..."
          # ⚠️ La route healthcheck est /api/health (nestée sous /api dans main.rs)
          # /health sans préfixe retourne index.html (fallback ServeDir) → curl réussirait
          # mais le backend ne serait pas réellement prêt à accepter les requêtes API.
          timeout 120s bash -c 'until curl -sf http://localhost:6300/api/health | grep -q "OK"; do sleep 3; done'
          echo "Stack demarree"

      - name: "Test APIs"
        run: |
          STATUS=$(curl -sw "%{http_code}" -o /dev/null http://localhost:6300/api/auth/me)
          echo "GET /api/auth/me (sans auth) : $STATUS"
          [ "$STATUS" = "401" ] || (echo "Attendu 401, recu $STATUS" && exit 1)
          curl -sf -I http://localhost:6300/ | head -5
          echo "APIs OK"

      - name: "Setup user E2E"
        run: |
          set -e

          # 1. Register e2e_ci
          REG_HTTP=$(curl -s -o /tmp/reg.json -w "%{http_code}" -X POST \
            http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"e2e_ci","password":"E2eTest123!","email":"e2e@ci.nook","name":"E2E CI"}')
          echo "POST /api/auth/register : $REG_HTTP : $(cat /tmp/reg.json)"
          [[ "$REG_HTTP" == "200" || "$REG_HTTP" == "201" || "$REG_HTTP" == "409" ]] || \
            (echo "Register inattendu : $REG_HTTP" && exit 1)

          # 2. Login admin
          LOGIN_HEADERS=$(curl -s -D - -o /dev/null -X POST \
            http://localhost:6300/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"changeme2026"}')

          ADMIN_COOKIE=$(echo "$LOGIN_HEADERS" | grep -i "set-cookie" \
            | grep -o "auth_token=[^;]*" | head -1)

          if [ -z "$ADMIN_COOKIE" ]; then
            echo "Login admin echoue - cookie absent"
            echo "$LOGIN_HEADERS"
            exit 1
          fi
          echo "Admin connecte (cookie: ${#ADMIN_COOKIE} chars)"

          # 3. Verifier que /api/users/pending retourne bien du JSON
          sleep 2
          PENDING_RESP=$(curl -s -w "\n%{http_code}" \
            -H "Cookie: $ADMIN_COOKIE" \
            http://localhost:6300/api/users/pending)

          PENDING_HTTP=$(echo "$PENDING_RESP" | tail -1)
          PENDING_JSON=$(echo "$PENDING_RESP" | head -1)

          echo "GET /api/users/pending : HTTP $PENDING_HTTP"
          echo "Body: $PENDING_JSON"

          [ "$PENDING_HTTP" = "200" ] || (echo "Attendu 200, recu $PENDING_HTTP" && exit 1)

          # 4. Trouver et approuver e2e_ci
          E2E_USER_ID=$(echo "$PENDING_JSON" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          users = data if isinstance(data, list) else data.get("users", [])
          match = [u for u in users if u.get("username") == "e2e_ci"]
          print(match[0]["id"] if match else "")
          ')

          if [ -z "$E2E_USER_ID" ]; then
            echo "e2e_ci deja approuve ou introuvable - on continue"
          else
            APPROVE_HTTP=$(curl -s -o /tmp/approve.json -w "%{http_code}" \
              -X POST http://localhost:6300/api/users/approve \
              -H "Content-Type: application/json" \
              -H "Cookie: $ADMIN_COOKIE" \
              -d "{\"user_id\":\"$E2E_USER_ID\"}")
            echo "POST /api/users/approve : $APPROVE_HTTP : $(cat /tmp/approve.json)"
            [ "$APPROVE_HTTP" = "200" ] || (echo "Approbation echouee" && exit 1)
            echo "User e2e_ci approuve (id: $E2E_USER_ID)"
          fi

      # ── Tests E2E Playwright ──────────────────────────────────────────────
      - name: "E2E Playwright"
        id: playwright
        env:
          CI: true
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          # Reporter JSON pour extraire les résultats dans le step suivant
          npx playwright test --reporter=json,html 2>&1 | tee /tmp/playwright-output.txt || true
          # Extraire le code de sortie réel
          EXIT_CODE=${PIPESTATUS[0]}
          echo "playwright_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          # Toujours continuer pour générer le rapport
          exit $EXIT_CODE

      # ── Génération et commit du rapport MD ────────────────────────────────
      - name: "Generer rapport MD dans .claude/"
        if: always()
        env:
          PLAYWRIGHT_EXIT: ${{ steps.playwright.outputs.playwright_exit }}
        run: |
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"

          # ── Compter passed/failed depuis la sortie texte Playwright ───
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/playwright-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' /tmp/playwright-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          SKIPPED=$(grep -oE '[0-9]+ skipped' /tmp/playwright-output.txt 2>/dev/null | grep -oE '[0-9]+' | tail -1 || echo "0")
          TOTAL=$((${PASSED:-0} + ${FAILED:-0} + ${SKIPPED:-0}))

          if [ "${FAILED}" = "0" ] && [ "${PLAYWRIGHT_EXIT}" = "0" ]; then
            STATUS_ICON="✅"; STATUS_TEXT="SUCCÈS"
          else
            STATUS_ICON="❌"; STATUS_TEXT="ÉCHEC"
          fi

          # ── Résultats détaillés depuis la sortie Playwright ────────────
          TEST_LINES=$(grep -E '^\s+(✓|✗|×|·|F)\s+' /tmp/playwright-output.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | awk '{$1=$1; print "  " $0}' \
            | head -150 || echo "  (résultats non disponibles)")

          # ── Erreurs détaillées ─────────────────────────────────────────
          ERROR_LINES=$(grep -E 'Error:|FAILED|TimeoutError' /tmp/playwright-output.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -v '^\s*$' \
            | head -40 || echo "Aucune erreur")

          # Snippets de code des tests en échec
          SNIPPETS=$(grep -A6 '>\s*[0-9]\+\s|' /tmp/playwright-output.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | head -80 || echo "")

          # ── Logs Docker backend ────────────────────────────────────────
          DOCKER_LOGS=$(docker compose logs --tail=40 2>/dev/null \
            | grep -iE 'ERROR|WARN|panic|thread.*panicked|500' \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | sed 's/.*nook  | //' \
            | head -25 || echo "(pas de logs)")

          # ── Durée depuis la sortie texte ───────────────────────────────
          DURATION=$(grep -oE '[0-9]+(\.[0-9]+)?s' /tmp/playwright-output.txt 2>/dev/null | tail -1 || echo "N/A")

          # ── Écrire le rapport ──────────────────────────────────────────
          REPORT_FILE=".claude/TEST_REPORT.md"

          cat > "$REPORT_FILE" << 'ENDOFMD_MARKER'
# 🧪 Rapport E2E — Nook
ENDOFMD_MARKER

          cat >> "$REPORT_FILE" << ENDOFMD
> Généré par \`test-nook.yml\` · **${RUN_DATE}**

---

## 📊 Résumé

| Indicateur | Valeur |
|-----------|--------|
| **Statut** | ${STATUS_ICON} **${STATUS_TEXT}** |
| **Tests passés** | ${PASSED} |
| **Tests échoués** | ${FAILED} |
| **Tests ignorés** | ${SKIPPED} |
| **Total** | ${TOTAL} |
| **Durée** | ${DURATION} |
| **Branche** | \`${BRANCH}\` |
| **Commit** | [\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}) |
| **Run CI** | [Voir le run complet](${RUN_URL}) |

---

## 🗂️ Architecture des tests

| Suite | Fichier | Tests | Périmètre |
|-------|---------|-------|-----------|
| **Sanité API** | \`api-sanity.spec.ts\` | ~47 | 401/403 sur toutes les routes protégées |
| **Admin** | \`admin.spec.ts\` | ~18 | Login, change-pwd, membres, inscription→approbation, invitations, analytics, isolation |
| **User** | \`user.spec.ts\` | ~43 | Auth, chat, réactions, upload, polls, chess, calendar, settings, E2EE, push, navigation |

---

## 📋 Résultats détaillés

\`\`\`
${TEST_LINES}
\`\`\`

---

## ❌ Erreurs et échecs

\`\`\`
${ERROR_LINES}
\`\`\`

ENDOFMD

          # Ajouter les snippets seulement si non vides
          if [ -n "$SNIPPETS" ]; then
            cat >> "$REPORT_FILE" << ENDOFMD2

### Extraits de code (contexte des échecs)

\`\`\`
${SNIPPETS}
\`\`\`

ENDOFMD2
          fi

          cat >> "$REPORT_FILE" << ENDOFMD3

---

## 🐳 Logs backend (warnings/erreurs)

\`\`\`
${DOCKER_LOGS}
\`\`\`

---

## 🔍 Couverture fonctionnelle

| Domaine | Endpoints testés | Statut |
|---------|-----------------|--------|
| **Auth** | login, logout, me, change-pwd, register→approve | Complet |
| **Conversations** | GET/POST conv, messages, participants, rename | Complet |
| **Réactions** | POST/DELETE/GET réactions, UPSERT, UI picker→pill | Complet |
| **Upload/Download** | upload chat, download, 404 | Complet |
| **Polls** | CRUD, vote, UPSERT, double vote, fermeture | Complet |
| **Chess** | créer, coups, IA, resign, invitations, UI plateau | Complet |
| **Calendrier** | GET/POST/DELETE événements, UI | Complet |
| **Settings** | profil, sécurité, apparence, update nom | Complet |
| **Admin** | users, pending, approve, invites, analytics, delete | Complet |
| **E2EE** | register/get public keys | Complet |
| **Push** | subscribe, preferences, vapid-key | Complet |
| **Sécurité** | 401 sur ~47 routes, 403 admin, rate limit | Complet |

---

*Rapport généré par \`.github/workflows/test-nook.yml\` — session 38*
ENDOFMD3

          echo "✅ Rapport généré : $REPORT_FILE ($(wc -l < $REPORT_FILE) lignes)"

      - name: "Commit rapport MD dans .claude/"
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .claude/TEST_REPORT.md

          # Ne commiter que si le fichier a changé
          if git diff --staged --quiet; then
            echo "Aucune modification du rapport — pas de commit"
          else
            git commit -m "ci: mise à jour TEST_REPORT.md [run ${{ github.run_id }}]"
            # Rebase sur l'état distant avant de pousser pour éviter le rejet
            # si la branche a avancé pendant l'exécution du workflow (fast-forward required)
            git pull --rebase origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité et poussé"
          fi

      - name: "Logs si echec"
        if: failure()
        run: docker compose logs --tail=200

      - name: "Upload rapport Playwright HTML"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: "Cleanup"
        if: always()
        run: docker compose down -v --rmi local
