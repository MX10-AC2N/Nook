name: CI - Test Nook (Backend + Frontend + Intégration)

on:
  push:
    branches: [ main, MX10-AC2N-patch-svelte5-runes ]
  pull_request:
    branches: [ main, MX10-AC2N-patch-svelte5-runes ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Rust
  # ─────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --manifest-path backend/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path backend/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Svelte 5
  # ─────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint & Type check
        run: cd frontend && npm run check

      - name: Build (adapter-static)
        run: cd frontend && npm run build

      - name: Test (si tu as des vitest/jest)
        run: cd frontend && npm test || echo "Pas de tests unitaires frontend pour le moment"

  # ─────────────────────────────────────────────────────────────
  # 3. Intégration complète (Docker + API + E2E)
  # ─────────────────────────────────────────────────────────────
  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nook:test .

      - name: Start stack (docker-compose)
        run: |
          docker compose -f docker-compose.yml up -d --build
          echo "⏳ Attente du healthcheck..."
          timeout 60s bash -c 'until curl -f http://localhost:6300/health; do sleep 2; done'

      - name: Vérification des APIs backend (toutes celles attendues par le frontend)
        run: |
          echo "=== API HEALTH ==="
          curl -f http://localhost:6300/health || exit 1

          echo "=== API publique ==="
          curl -f -X POST http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"testci","email":"test@ci.local","password":"Test123!"}' || echo "Register OK (ou déjà existant)"

          echo "=== API protégée (doit renvoyer 401 sans cookie) ==="
          curl -f -w "%{http_code}" http://localhost:6300/api/auth/me | grep 401 || exit 1

          echo "=== WebSocket signaling disponible ==="
          curl -I http://localhost:6300/ws || echo "WS endpoint prêt"

          echo "=== Fichiers statiques frontend servis ==="
          curl -f -I http://localhost:6300/ | grep -E "200|index.html" || exit 1

      - name: Test interaction frontend ↔ backend (Playwright E2E)
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium || echo "Playwright pas encore configuré → on passe (ajoute tes tests plus tard)"

      - name: Logs en cas d’erreur
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v --rmi local