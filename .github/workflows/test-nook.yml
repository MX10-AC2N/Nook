name: 3==> 🧪 CI – Test Nook (Backend + Frontend + Intégration)

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # 1. Frontend Build
  # ============================================================
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 1

  # ============================================================
  # 2. Backend – check / test / clippy (host natif, pas de cross)
  # ============================================================
  backend:
    name: 🦀 Backend Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo check
        run: cargo check --manifest-path backend/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path backend/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  # ============================================================
  # 3. Intégration – Docker build depuis sources + tests E2E
  # ============================================================
  integration:
    name: 🔗 Intégration Docker
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - name: Vérification frontend build
        run: |
          test -f frontend/build/index.html || (echo "❌ index.html manquant" && exit 1)
          echo "✅ frontend/build prêt ($(ls frontend/build | wc -l) fichiers)"

      - name: Build & start stack
        run: |
          docker compose up -d --build
          echo "⏳ Attente du healthcheck..."
          timeout 120s bash -c 'until curl -sf http://localhost:6300/health; do sleep 3; done'
          echo "✅ Stack démarrée"

      - name: ✅ Test APIs
        run: |
          curl -f http://localhost:6300/health
          STATUS=$(curl -sw "%{http_code}" -o /dev/null http://localhost:6300/api/auth/me)
          echo "GET /api/auth/me → $STATUS"
          [ "$STATUS" = "401" ] || (echo "❌ Attendu 401, reçu $STATUS" && exit 1)
          curl -sf -I http://localhost:6300/ | head -5
          echo "✅ APIs OK"

      - name: 🔧 Setup user E2E
        run: |
          # 1. Register le user e2e_ci (|| true = idempotent si déjà créé)
          curl -sf -X POST http://localhost:6300/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"e2e_ci","password":"E2eTest123!","email":"e2e@ci.nook","name":"E2E CI"}' || true

          # 2. Login admin → récupérer le cookie
          ADMIN_COOKIE=$(curl -sf -c - -X POST http://localhost:6300/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"changeme2026"}' \
            | grep auth_token | awk '{print $6}' || echo "")

          if [ -z "$ADMIN_COOKIE" ]; then
            echo "❌ Login admin échoué"
            exit 1
          fi
          echo "✅ Admin connecté"

          # 3. Récupérer l'id du user e2e_ci en attente
          E2E_USER_ID=$(curl -sf \
            -H "Cookie: auth_token=$ADMIN_COOKIE" \
            http://localhost:6300/api/pending-users-json \
            | python3 -c "import sys,json; users=json.load(sys.stdin).get('users',[]); u=[x for x in users if x['username']=='e2e_ci']; print(u[0]['id'] if u else '')")

          if [ -z "$E2E_USER_ID" ]; then
            echo "⚠️ e2e_ci déjà approuvé ou introuvable, on continue"
          else
            # 4. Approuver le user
            curl -sf -X POST http://localhost:6300/api/approve \
              -H "Content-Type: application/json" \
              -H "Cookie: auth_token=$ADMIN_COOKIE" \
              -d "{\"user_id\":\"$E2E_USER_ID\"}"
            echo "✅ User e2e_ci approuvé (id: $E2E_USER_ID)"
          fi

      - name: 🧪 E2E Playwright
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          npx playwright test

      - name: 📋 Logs si échec
        if: failure()
        run: docker compose logs --tail=100

      - name: 🧹 Cleanup
        if: always()
        run: docker compose down -v --rmi local
