name: 🧹 Check Svelte 5 (Syntaxe, Types, Build)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'frontend/src/**'

env:
  NODE_VERSION: 20
  WORKING_DIR: frontend

jobs:
  svelte5-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📦 Installation des dépendances + auto-fix lockfile
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🔄 Tentative de npm ci..."
          if npm ci; then
            echo "✅ npm ci réussi"
          else
            echo "⚠️ npm ci échoué → fallback sur npm install"
            npm install

            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            if git diff --quiet package-lock.json; then
              echo "⏭️ Pas de changement dans package-lock.json"
            else
              echo "🔧 package-lock.json modifié → commit & push"
              git add package-lock.json
              git commit -m "chore: regenerate package-lock.json (auto-fix CI)"
              git push origin HEAD:${{ github.ref_name }}
              echo "✅ package-lock.json mis à jour"
            fi
          fi

      # ────────────────────────────────
      # 🔍 DIAGNOSTIC (pour comprendre pourquoi svelte-check plante)
      # ────────────────────────────────
      - name: 🔍 Diagnostic outils Svelte
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Node $(node -v) / npm $(npm -v)"
          echo ""
          echo "Tentative svelte-check --version :"
          npx svelte-check --version || echo "❌ svelte-check non disponible ou erreur"
          echo ""
          echo "Scripts package.json contenant 'check' :"
          npm run | grep -i check || echo "Aucun script 'check'"
          echo ""
          echo "Dépendances avec 'svelte' dans package.json :"
          grep -i svelte package.json || echo "Aucun 'svelte' trouvé"
          echo ""
          echo "Présence tsconfig.json :"
          ls tsconfig.json && echo "✅ tsconfig.json présent" || echo "❌ tsconfig.json absent"

      # ────────────────────────────────
      # 🧩 Sync types SvelteKit (génère les types $lib etc.)
      # ────────────────────────────────
      - name: 🧩 SvelteKit sync
        working-directory: ${{ env.WORKING_DIR }}
        run: npx svelte-kit sync

      # ────────────────────────────────
      # 🧪 TYPE CHECK – capture robuste même si crash
      # ────────────────────────────────
      - name: 🧪 Type check (svelte-check)
        id: svelte-check
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧪 Exécution de svelte-check (capture forcée)..."
          output=$(npx svelte-check --tsconfig ./tsconfig.json 2>&1 || true)
          echo "$output"

          if echo "$output" | grep -iq "no errors\\|0 errors"; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$output" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────
      # 🏗️ BUILD – capture robuste
      # ────────────────────────────────
      - name: 🏗️ Test build
        id: build
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🏗️ Exécution du build (capture forcée)..."
          output=$(npm run build 2>&1 || true)
          echo "$output"

          # Vérifie si le build a réussi (recherche mot-clé typique de succès Vite/SvelteKit)
          if echo "$output" | grep -iq "built in\\|vite build finished"; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$output" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────
      # 📝 Rapport clair + suggestions précises
      # ────────────────────────────────
      - name: ⚠️ Rapport erreurs & suggestions
        if: steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure'
        run: |
          echo "⚠️ Erreurs détectées dans le code frontend (Svelte 5)."
          echo "Voici les détails bruts + suggestions concrètes :"
          echo ""

          if [ "${{ steps.svelte-check.outputs.status }}" == "failure" ]; then
            echo "### Erreurs svelte-check :"
            echo "${{ steps.svelte-check.outputs.details }}"
            echo ""
            echo "**Suggestions courantes pour Svelte 5 :**"
            echo "- Propriétés optionnelles en TS : 'prop?: string' (pas 'prop?')"
            echo "- Migrez 'export let x' → 'const { x } = \$props()'"
            echo "- Migrez les labels '\$:' → '\$effect(() => { ... })'"
            echo "- Activez runes mode dans svelte.config.js :"
            echo "   preprocessor: { compilerOptions: { runes: true } }"
            echo "- Pour les props complexes (default, bindable, types) : utilisez l'extension VS Code Svelte → quick fixes excellents"
            echo ""
          fi

          if [ "${{ steps.build.outputs.status }}" == "failure" ]; then
            echo "### Erreurs build :"
            echo "${{ steps.build.outputs.details }}"
            echo ""
            echo "**Suggestions :**"
            echo "- Souvent liées aux erreurs de types ci-dessus"
            echo "- Vérifiez imports, chemins $lib, ou dépendances obsolètes"
            echo ""
          fi

          echo "🔧 Meilleure solution : ouvrez le projet dans VS Code avec l'extension officielle 'Svelte for VS Code'."
          echo "   → Elle détecte automatiquement les problèmes Svelte 5 et propose des corrections en 1 clic par composant."

      # ────────────────────────────────
      # 📊 Résumé GitHub
      # ────────────────────────────────
      - name: 📊 Résumé
        if: always()
        run: |
          echo "## 🧹 Résumé Check Svelte 5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🧩 svelte-kit sync effectué" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 svelte-check : ${{ steps.svelte-check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Build : ${{ steps.build.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ${{ steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure' }}; then
            echo "⚠️ Erreurs présentes → voir logs pour rapport détaillé et suggestions." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Code propre !" >> $GITHUB_STEP_SUMMARY
          fi

      # ────────────────────────────────
      # ❌ Blocage push si erreurs
      # ────────────────────────────────
      - name: ❌ Échec si erreurs
        if: steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure'
        run: exit 1