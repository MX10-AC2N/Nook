name: 🧹 Check Svelte 5 (Syntaxe, Types, Build)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/tsconfig.json'
      - 'frontend/svelte.config.js'

env:
  NODE_VERSION: 20
  WORKING_DIR: frontend

jobs:
  svelte5-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📦 Installation des dépendances
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🔄 Installation avec npm ci..."
          if npm ci; then
            echo "✅ npm ci réussi"
          else
            echo "⚠️ npm ci échoué → fallback sur npm install"
            npm install

            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            if git diff --quiet package-lock.json; then
              echo "⏭️ Pas de changement dans package-lock.json"
            else
              echo "🔧 package-lock.json modifié → commit & push"
              git add package-lock.json
              git commit -m "chore: regenerate package-lock.json (auto-fix CI)"
              git push origin HEAD:${{ github.ref_name }}
              echo "✅ package-lock.json mis à jour"
            fi
          fi

      # ────────────────────────────────
      # 🔍 DIAGNOSTIC
      # ────────────────────────────────
      - name: 🔍 Diagnostic outils
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔧 Versions installées"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo ""
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Dépendances Svelte"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          npm list svelte @sveltejs/kit svelte-check typescript || true
          echo ""
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📝 Fichiers de configuration"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -la tsconfig.json && echo "✅ tsconfig.json présent" || echo "❌ tsconfig.json absent"
          ls -la svelte.config.js && echo "✅ svelte.config.js présent" || echo "❌ svelte.config.js absent"
          ls -la src/app.d.ts && echo "✅ src/app.d.ts présent" || echo "❌ src/app.d.ts absent"
          echo ""
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎯 Scripts disponibles"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          npm run 2>&1 | grep -E "(check|build|dev)" || echo "Aucun script trouvé"

      # ────────────────────────────────
      # 🧩 CRITICAL: Sync SvelteKit AVANT tout check
      # ────────────────────────────────
      - name: 🧩 SvelteKit sync (génère .svelte-kit/tsconfig.json)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🔄 Synchronisation des types SvelteKit..."
          npx svelte-kit sync
          echo ""
          echo "✅ Vérification du fichier généré :"
          ls -la .svelte-kit/tsconfig.json && echo "✅ .svelte-kit/tsconfig.json créé" || echo "❌ ERREUR: fichier non créé"
          echo ""
          if [ -f .svelte-kit/tsconfig.json ]; then
            echo "📄 Contenu de .svelte-kit/tsconfig.json :"
            cat .svelte-kit/tsconfig.json
          fi

      # ────────────────────────────────
      # 🧪 TYPE CHECK avec svelte-check
      # ────────────────────────────────
      - name: 🧪 Type check (svelte-check)
        id: svelte-check
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧪 Exécution de svelte-check..."
          
          # Capture la sortie complète
          output=$(npx svelte-check --tsconfig ./tsconfig.json --threshold warning 2>&1 || true)
          echo "$output"
          
          # Analyse du résultat
          if echo "$output" | grep -iq "no errors\\|0 errors"; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Type-check réussi"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Erreurs de type détectées"
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$output" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────
      # 🏗️ BUILD
      # ────────────────────────────────
      - name: 🏗️ Test build
        id: build
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🏗️ Exécution du build..."
          
          output=$(npm run build 2>&1 || true)
          echo "$output"
          
          # Détection du succès (adapté à Vite/SvelteKit)
          if echo "$output" | grep -iq "built in\\|vite.*built\\|build completed"; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Build réussi"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Build échoué"
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$output" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────
      # 📝 Rapport détaillé
      # ────────────────────────────────
      - name: 📝 Rapport d'erreurs
        if: steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure'
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  ERREURS DÉTECTÉES"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ "${{ steps.svelte-check.outputs.status }}" == "failure" ]; then
            echo "### 🧪 Erreurs Type-Check (svelte-check)"
            echo ""
            echo "${{ steps.svelte-check.outputs.details }}"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "💡 SOLUTIONS POUR SVELTE 5"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "1. Vérifiez que src/app.d.ts existe"
            echo "2. Migrez 'export let x' → 'let { x } = \$props()'"
            echo "3. Migrez '\$:' → '\$effect(() => {...})' ou '\$derived()'"
            echo "4. Props optionnelles : { x = \$bindable() } ou { x }: { x?: string }"
            echo "5. Activez runes dans svelte.config.js si ce n'est pas fait"
            echo ""
          fi

          if [ "${{ steps.build.outputs.status }}" == "failure" ]; then
            echo "### 🏗️ Erreurs Build"
            echo ""
            echo "${{ steps.build.outputs.details }}"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "💡 SOLUTIONS COURANTES"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "1. Vérifiez les imports et alias (\$lib, \$components)"
            echo "2. Corrigez d'abord les erreurs de type-check ci-dessus"
            echo "3. Vérifiez que toutes les dépendances sont à jour"
            echo ""
          fi

      # ────────────────────────────────
      # 📊 Résumé
      # ────────────────────────────────
      - name: 📊 Résumé GitHub
        if: always()
        run: |
          echo "# 🧹 Résumé Check Svelte 5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧩 SvelteKit Sync | ✅ Effectué |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.svelte-check.outputs.status }}" == "success" ]; then
            echo "| 🧪 Type-Check | ✅ Réussi |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Type-Check | ❌ Échec |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.build.outputs.status }}" == "success" ]; then
            echo "| 🏗️ Build | ✅ Réussi |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Build | ❌ Échec |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.svelte-check.outputs.status }}" == "failure" ] || [ "${{ steps.build.outputs.status }}" == "failure" ]; then
            echo "⚠️ **Des erreurs ont été détectées.** Consultez les logs ci-dessus pour les détails et suggestions." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Tout est OK !** Le code est propre." >> $GITHUB_STEP_SUMMARY
          fi

      # ────────────────────────────────
      # ❌ Échec final si erreurs
      # ────────────────────────────────
      - name: ❌ Échec si erreurs
        if: steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure'
        run: |
          echo "❌ Le workflow échoue car des erreurs ont été détectées."
          exit 1