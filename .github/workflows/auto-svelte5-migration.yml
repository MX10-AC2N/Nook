name: 🧹 Check Svelte 5 (Syntaxe, Types, Build)

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'frontend/src/**'

env:
  NODE_VERSION: 20
  WORKING_DIR: frontend

jobs:
  svelte5-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Pour commits/push

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📦 Installation des dépendances + auto-fix lockfile
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🔄 Tentative de npm ci..."
          if npm ci; then
            echo "✅ npm ci réussi – lockfile cohérent"
          else
            echo "⚠️ npm ci échoué → fallback sur npm install"
            npm install

            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            if git diff --quiet package-lock.json; then
              echo "⏭️ Pas de changement dans package-lock.json"
            else
              echo "🔧 package-lock.json modifié → commit & push"
              git add package-lock.json
              git commit -m "chore: regenerate package-lock.json (auto-fix CI)"
              git push origin HEAD:${{ github.ref_name }}
              echo "✅ package-lock.json mis à jour et poussé"
            fi
          fi

      # ────────────────────────────────
      # 🔧 CORRECTION SAFE (service-worker seulement)
      # ────────────────────────────────
      - name: 🤖 Correction safe service-worker.ts
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🔧 Correction idempotente de service-worker.ts (si présent)"
          if [ -f src/service-worker.ts ]; then
            if ! grep -q '/// <reference lib="webworker" />' src/service-worker.ts; then
              sed -i '1i/// <reference lib="webworker" />' src/service-worker.ts
              echo "   → Ajouté référence webworker"
            fi
            if ! grep -q 'declare const self: ServiceWorkerGlobalScope;' src/service-worker.ts; then
              sed -i '2i declare const self: ServiceWorkerGlobalScope;' src/service-worker.ts
              echo "   → Ajouté déclaration self"
            fi
            echo "✅ service-worker.ts corrigé"
          else
            echo "⏭️ Pas de service-worker.ts → rien à faire"
          fi

      # ────────────────────────────────
      # 🧩 Sync types SvelteKit
      # ────────────────────────────────
      - name: 🧩 SvelteKit sync
        working-directory: ${{ env.WORKING_DIR }}
        run: npx svelte-kit sync

      # ────────────────────────────────
      # 🧪 VÉRIFICATIONS PRINCIPALES
      # ────────────────────────────────
      - name: 🧪 Type check (svelte-check)
        id: svelte-check
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧪 Exécution de svelte-check..."
          output=$(npx svelte-check --tsconfig ./tsconfig.json 2>&1)
          echo "$output"
          if echo "$output" | grep -q "No errors"; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$output" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Test build
        id: build
        continue-on-error: true
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🏗️ Exécution du build..."
          output=$(npm run build 2>&1)
          echo "$output"
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$output" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────
      # 📝 Rapport clair des erreurs + suggestions
      # ────────────────────────────────
      - name: ⚠️ Rapport d'erreurs & suggestions
        if: steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure'
        run: |
          echo "⚠️ Des erreurs ont été détectées. Voici les détails :"
          echo ""

          if [ "${{ steps.svelte-check.outputs.status }}" == "failure" ]; then
            echo "### Erreurs svelte-check (types + syntaxe Svelte/TS) :"
            echo "${{ steps.svelte-check.outputs.details }}"
            echo ""
            echo "**Suggestions fréquentes pour Svelte 5 :**"
            echo "- Activez runes mode dans svelte.config.js : compilerOptions: { runes: true }"
            echo "- Migrez les props : 'export let x' → 'const { x } = \$props()' (ou utilisez l'extension VS Code Svelte)"
            echo "- Remplacez les labels réactifs '\$:' par '\$effect(() => { ... })'"
            echo "- Erreurs TS courantes : propriétés optionnelles → 'prop?: string;' (pas juste 'prop?')"
            echo ""
          fi

          if [ "${{ steps.build.outputs.status }}" == "failure" ]; then
            echo "### Erreurs de build :"
            echo "${{ steps.build.outputs.details }}"
            echo ""
            echo "**Suggestions :**"
            echo "- Vérifiez les imports manquants ou cycles"
            echo "- Assurez-vous que toutes les dépendances Svelte 5 sont à jour"
            echo "- Consultez la migration guide : https://svelte.dev/docs/svelte/v5-migration-guide"
            echo ""
          fi

          echo "🔍 Pour corriger rapidement : utilisez l'extension VS Code 'Svelte for VS Code' → elle propose des quick-fixes automatiques pour la migration Svelte 5."

      # ────────────────────────────────
      # 💾 Commit des changements (sync ou service-worker)
      # ────────────────────────────────
      - name: 💾 Commit changements si présents
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if ! git diff --quiet; then
            git add .
            git commit -m "🤖 chore: svelte-kit sync + fix service-worker types"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Changements mineurs commités et poussés"
          else
            echo "⏭️ Aucune modification"
          fi

      # ────────────────────────────────
      # 📊 Résumé GitHub
      # ────────────────────────────────
      - name: 📊 Résumé
        if: always()
        run: |
          echo "## 🧹 Résumé Check Svelte 5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🧩 svelte-kit sync appliqué" >> $GITHUB_STEP_SUMMARY
          echo "- 🔧 Fix service-worker (si présent)" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 svelte-check : ${{ steps.svelte-check.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Build : ${{ steps.build.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ${{ steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure' }}; then
            echo "⚠️ Erreurs détectées → voir logs pour détails et suggestions." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Tout est propre !" >> $GITHUB_STEP_SUMMARY
          fi

      # Fail si erreurs
      - name: ❌ Échec si erreurs restantes
        if: steps.svelte-check.outputs.status == 'failure' || steps.build.outputs.status == 'failure'
        run: exit 1