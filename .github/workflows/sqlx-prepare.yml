name: 🗄️ SQLx — Régénérer queries.json

# Déclenché après toute migration SQL ou changement de macro sqlx!
# Commit automatique du nouveau .sqlx/queries.json dans le repo
# Agent concerné : 🦀 RUST

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/migrations/**.sql'
      - 'backend/src/**.rs'

permissions:
  contents: write

jobs:
  sqlx-prepare:
    name: 🗄️ cargo sqlx prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@nightly  # edition 2024 requires Rust >= 1.85

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # ── 1. Installer sqlx-cli ─────────────────────────────────────
      - name: Installer sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,rustls

      # ── 2. DB temporaire + migrations ────────────────────────────
      - name: Créer DB temporaire + appliquer migrations
        run: |
          mkdir -p /tmp/nook-sqlx
          sqlx database create --database-url sqlite:///tmp/nook-sqlx/nook.db
          sqlx migrate run --database-url sqlite:///tmp/nook-sqlx/nook.db
          echo "✅ DB temporaire prête"

      # ── 3. Régénérer queries.json ─────────────────────────────────
      - name: cargo sqlx prepare
        env:
          DATABASE_URL: sqlite:///tmp/nook-sqlx/nook.db
          SQLX_OFFLINE: "false"
        run: |
          set -e
          echo "=== cargo metadata ==="
          cargo metadata --format-version 1 || {
            echo "ERROR: cargo metadata failed"
            echo "=== cargo check output ==="
            cargo check 2>&1 | head -80 || true
            exit 1
          }
          echo "=== cargo sqlx prepare ==="
          cargo sqlx prepare -- --target x86_64-unknown-linux-gnu
          echo "✅ queries.json régénéré"
          QUERY_COUNT=$(python3 -c "import json; data=json.load(open('.sqlx/queries.json')); print(len(data))" 2>/dev/null || echo "?")
          echo "Queries indexées : $QUERY_COUNT"
          echo "query_count=$QUERY_COUNT" >> $GITHUB_ENV

      # ── 4. Commit si changement ───────────────────────────────────
      - name: Commit queries.json si modifié
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/.sqlx/queries.json
          if git diff --staged --quiet; then
            echo "ℹ️ Aucun changement dans queries.json"
            echo "changed=false" >> $GITHUB_ENV
          else
            git commit -m "chore(sqlx): régénérer queries.json [${{ env.query_count }} queries] [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ queries.json commité"
            echo "changed=true" >> $GITHUB_ENV
          fi

      # ── 5. Résumé ─────────────────────────────────────────────────
      - name: Résumé
        run: |
          echo "## 🗄️ SQLx Prepare" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Queries indexées** | ${{ env.query_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modifié** | ${{ env.changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lance maintenant **Backend.yml** pour valider la compilation offline." >> $GITHUB_STEP_SUMMARY