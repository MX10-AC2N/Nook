name: 2 ==> Docker Build and Push

on:
  workflow_dispatch:

jobs:
  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend amd64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Backend.yml
          branch: ${{ github.ref_name }}
          name: nook-backend-x86_64-unknown-linux-musl
          path: docker-context/backend

      - name: Download backend arm64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Backend.yml
          branch: ${{ github.ref_name }}
          name: nook-backend-aarch64-unknown-linux-musl
          path: docker-context/backend

      - name: Download frontend
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Frontend.yml
          branch: ${{ github.ref_name }}
          name: nook-frontend
          path: docker-context/frontend

      - name: Set lowercase repo name and version
        id: info
        run: |
          echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          VERSION=$(grep "^version = " backend/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Image: ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):v$VERSION"

      - name: Verify context
        id: ctx
        run: |
          echo "=== Backend ==="
          ls -la docker-context/backend/
          echo "=== Frontend ==="
          ls -la docker-context/frontend/
          test -f docker-context/backend/nook-backend-amd64 || (echo "amd64 missing" && exit 1)
          test -f docker-context/backend/nook-backend-arm64 || (echo "arm64 missing" && exit 1)
          test -f docker-context/frontend/index.html || (echo "frontend missing" && exit 1)
          chmod +x docker-context/backend/nook-backend-amd64
          chmod +x docker-context/backend/nook-backend-arm64

          AMD64_SIZE=$(ls -lh docker-context/backend/nook-backend-amd64 | awk '{print $5}')
          ARM64_SIZE=$(ls -lh docker-context/backend/nook-backend-arm64 | awk '{print $5}')
          FRONT_FILES=$(ls docker-context/frontend | wc -l)
          echo "amd64_size=$AMD64_SIZE" >> $GITHUB_OUTPUT
          echo "arm64_size=$ARM64_SIZE" >> $GITHUB_OUTPUT
          echo "front_files=$FRONT_FILES" >> $GITHUB_OUTPUT
          echo "Docker context ready"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multiarch
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.info.outputs.repo }}:${{ steps.info.outputs.tag }}
            ghcr.io/${{ steps.info.outputs.repo }}:latest
          build-args: |
            TARGETARCH
