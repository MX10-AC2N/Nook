name: 4==> 🐳 Docker Build & Push

on:
  workflow_dispatch:  # Manuel uniquement — lancé après Backend.yml + Frontend.yml + test-nook.yml ✅

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: 🐳 Docker Multi-Arch (Distroless)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Les artifacts sont uploadés par Backend.yml avec ces noms exacts
      - name: Download backend amd64
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-x86_64-unknown-linux-gnu
          path: docker-context/backend

      - name: Download backend arm64
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-aarch64-unknown-linux-gnu
          path: docker-context/backend

      # L'artifact est uploadé par Frontend.yml avec ce nom exact
      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: docker-context/frontend

      - name: Vérification du contexte
        run: |
          echo "=== Backend ==="
          ls -la docker-context/backend/
          echo "=== Frontend ==="
          ls -la docker-context/frontend/
          test -f docker-context/backend/nook-backend-amd64 || (echo "❌ nook-backend-amd64 manquant" && exit 1)
          test -f docker-context/backend/nook-backend-arm64 || (echo "❌ nook-backend-arm64 manquant" && exit 1)
          test -f docker-context/frontend/index.html        || (echo "❌ index.html manquant" && exit 1)
          chmod +x docker-context/backend/nook-backend-amd64
          chmod +x docker-context/backend/nook-backend-arm64
          echo "✅ Contexte Docker prêt"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Dockerfile.release = image distroless sans étape Rust
      # (les binaires sont déjà compilés par Backend.yml)
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          echo "✅ Image publiée !"
          echo "🔗 https://ghcr.io/${{ github.repository }}"
          echo "🏷️  Tags : ${{ steps.meta.outputs.tags }}"
          echo "📦 Architectures : linux/amd64, linux/arm64"
