name: 🐳 Docker Build & Push

on:
  workflow_dispatch:  # Manuel uniquement (ou tu peux ajouter push si tu veux)
  workflow_run:
    workflows: ["Backend Build & Artifact", "Frontend Build & Artifact"]
    types: [completed]
    branches: [develop, main]

jobs:
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Seulement si les deux précédents ont réussi
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-${{ github.event.workflow_run.head_sha }}
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend-${{ github.event.workflow_run.head_sha }}
          path: frontend-artifact

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mx10-ac2n/nook:${{ github.sha }}
            ghcr.io/mx10-ac2n/nook:latest
          build-args: |
            BACKEND_PATH=backend-artifact/nook-backend
            FRONTEND_PATH=frontend-artifact
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Cleanup artifacts
        if: always()
        run: |
          rm -rf backend-artifact || true
          rm -rf frontend-artifact || true