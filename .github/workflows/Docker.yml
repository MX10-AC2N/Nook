name: 4 ==> Docker Build and Push

on:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Download backend
      - name: Download backend amd64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Backend.yml
          branch: ${{ github.ref_name }}
          name: nook-backend-x86_64-unknown-linux-musl
          path: docker-context/backend

      - name: Download backend arm64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Backend.yml
          branch: ${{ github.ref_name }}
          name: nook-backend-aarch64-unknown-linux-musl
          path: docker-context/backend

      # Download turn-server
      - name: Download turn amd64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: turn.yml
          branch: ${{ github.ref_name }}
          name: nook-turn-server-amd64
          path: docker-context/turn

      - name: Download turn arm64
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: turn.yml
          branch: ${{ github.ref_name }}
          name: nook-turn-server-arm64
          path: docker-context/turn

      # Download frontend
      - name: Download frontend
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: Frontend.yml
          branch: ${{ github.ref_name }}
          name: nook-frontend
          path: docker-context/frontend

      - name: Set lowercase repo name and version
        id: info
        run: |
          echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          VERSION=$(grep "^version = " backend/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Copy turn-rs config files to docker context
        run: |
          cp services/turn-rs/turnserver.conf.template docker-context/turn/
          cp services/turn-rs/docker-entrypoint.sh docker-context/turn/
          chmod +x docker-context/turn/docker-entrypoint.sh

      - name: Verify context
        id: ctx
        run: |
          echo "=== Backend ==="
          ls -la docker-context/backend/
          echo "=== Turn ==="
          ls -la docker-context/turn/
          echo "=== Frontend ==="
          ls -la docker-context/frontend/
          test -f docker-context/backend/nook-backend-amd64 || (echo "backend amd64 missing" && exit 1)
          test -f docker-context/backend/nook-backend-arm64 || (echo "backend arm64 missing" && exit 1)
          test -f docker-context/turn/turn-server-amd64 || (echo "turn amd64 missing" && exit 1)
          test -f docker-context/turn/turn-server-arm64 || (echo "turn arm64 missing" && exit 1)
          test -f docker-context/frontend/index.html || (echo "frontend missing" && exit 1)
          test -f docker-context/turn/turnserver.conf.template || (echo "turn template missing" && exit 1)
          test -f docker-context/turn/docker-entrypoint.sh || (echo "entrypoint missing" && exit 1)
          chmod +x docker-context/backend/nook-backend-amd64
          chmod +x docker-context/backend/nook-backend-arm64
          chmod +x docker-context/turn/turn-server-amd64
          chmod +x docker-context/turn/turn-server-arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push nook (version tag + latest only on main)
      - name: Build and push nook (backend + frontend)
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.info.outputs.repo }}:${{ steps.info.outputs.tag }}
          build-args: |
            TARGETARCH

      - name: Push nook latest (main only)
        if: github.ref_name == 'main'
        run: |
          docker buildx imagetools create -t ghcr.io/${{ steps.info.outputs.repo }}:latest ghcr.io/${{ steps.info.outputs.repo }}:${{ steps.info.outputs.tag }}

      # Build and push turn-server (version tag + latest only on main)
      - name: Build and push turn-server
        uses: docker/build-push-action@v6
        with:
          context: docker-context/turn
          file: services/turn-rs/Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mx10-ac2n/turn-server:${{ steps.info.outputs.tag }}
          build-args: |
            TARGETARCH

      - name: Push turn-server latest (main only)
        if: github.ref_name == 'main'
        run: |
          docker buildx imagetools create -t ghcr.io/mx10-ac2n/turn-server:latest ghcr.io/mx10-ac2n/turn-server:${{ steps.info.outputs.tag }}
