name: 4==> 🐳 Docker Build & Push

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: 🐳 Docker Multi-Arch (Distroless)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # ── Lecture de la version depuis la source de vérité ──────────
      - name: Lire la version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version : $VERSION"

      - name: Download backend amd64
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-x86_64-unknown-linux-gnu
          path: docker-context/backend

      - name: Download backend arm64
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-aarch64-unknown-linux-gnu
          path: docker-context/backend

      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: docker-context/frontend

      - name: Vérification du contexte
        run: |
          echo "=== Backend ==="
          ls -la docker-context/backend/
          echo "=== Frontend ==="
          ls -la docker-context/frontend/
          test -f docker-context/backend/nook-backend-amd64 || (echo "❌ amd64 manquant" && exit 1)
          test -f docker-context/backend/nook-backend-arm64 || (echo "❌ arm64 manquant" && exit 1)
          test -f docker-context/frontend/index.html        || (echo "❌ index.html manquant" && exit 1)
          chmod +x docker-context/backend/nook-backend-amd64
          chmod +x docker-context/backend/nook-backend-arm64
          echo "✅ Contexte Docker prêt — version ${{ steps.version.outputs.version }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag version sémantique lisible : v0.5.1
            type=raw,value=${{ steps.version.outputs.tag }}
            # Tag majeur.mineur : v0.5
            type=raw,value=v{{ steps.version.outputs.version | split('.') | first }}.{{ steps.version.outputs.version | split('.')[1] }}
            # latest uniquement sur main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # SHA court pour traçabilité (non affiché dans le badge)
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          echo "## 🐳 Docker ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`ghcr.io/${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | \`linux/amd64\` · \`linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lien** | https://ghcr.io/${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
