name: 2 ==> Frontend Build

on:
  workflow_dispatch:

jobs:
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Clean runner cache (force fresh checkout)
        run: |
          git clean -fdx || true
          rm -rf frontend/node_modules frontend/build frontend/.svelte-kit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix npm config (remove omit dev)
        working-directory: ./frontend
        run: npm config delete omit

      - name: Clean install (force regenerate lockfile)
        working-directory: ./frontend
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund --legacy-peer-deps
          # Verify lockfile is valid
          npm ci --no-audit --no-fund --legacy-peer-deps 2>&1 | head -20

      - name: Generate SvelteKit config (ensure .svelte-kit/tsconfig.json exists)
        working-directory: ./frontend
        run: npx svelte-kit sync

      - name: Clean install
        working-directory: ./frontend
        run: rm -rf node_modules/.vite .svelte-kit


      - name: Verify Svelte files integrity
        working-directory: ./frontend
        run: |
          echo "Checking for corrupted line numbers in Svelte files..."
          if grep -r "^[[:space:]]*[0-9][0-9]*|" src/routes/; then
            echo "❌ Corrupted files detected (line numbers found)"
            exit 1
          else
            echo "✅ Svelte files are clean"
          fi

      - name: Build (clean CI)
        id: build
        working-directory: ./frontend
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/frontend-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          # Vérification explicite
          if [ $BUILD_EXIT -ne 0 ] || [ ! -f build/index.html ]; then
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
            echo "❌ Build échoué"
          else
            echo "build_status=OK" >> $GITHUB_OUTPUT
            FILE_COUNT=$(ls build | wc -l)
            echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Frontend OK — $FILE_COUNT fichiers"
            ls -la build/
          fi

          exit $BUILD_EXIT

      # Report removed : caused systematic merge conflicts

      # Nom fixe → Docker.yml et test-nook.yml peuvent le télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          if-no-files-found: error
          retention-days: 7
