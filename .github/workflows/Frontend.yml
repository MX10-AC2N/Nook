name: 2==> 🎨 Frontend Build & Artifact

on:
  workflow_dispatch:

jobs:
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        working-directory: ./frontend
        run: |
          npm run build
          test -f build/index.html || (echo "❌ build/index.html manquant" && exit 1)
          echo "✅ Frontend OK — $(ls build | wc -l) fichiers"
          ls -la build/

      # Nom fixe → Docker.yml et test-nook.yml peuvent le télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          if-no-files-found: error
          retention-days: 7
