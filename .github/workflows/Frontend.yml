name: 🎨 Frontend Build & Artifact

on:
  workflow_dispatch:  # Manuel
  
jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ... Toutes les étapes frontend que tu avais déjà ...
      # (Vérifier dossier, générer package-lock, cache npm, install, vérifier deps,
      #  build, vérifier build/, upload artifact)

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend/build
          retention-days: 1