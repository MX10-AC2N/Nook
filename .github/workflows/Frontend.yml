name: 2==> 🎨 Frontend Build & Artifact

on:
  workflow_dispatch:

jobs:
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        id: build
        working-directory: ./frontend
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/frontend-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          # Vérification explicite
          if [ $BUILD_EXIT -ne 0 ] || [ ! -f build/index.html ]; then
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
            echo "❌ Build échoué"
          else
            echo "build_status=OK" >> $GITHUB_OUTPUT
            FILE_COUNT=$(ls build | wc -l)
            echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Frontend OK — $FILE_COUNT fichiers"
            ls -la build/
          fi

          exit $BUILD_EXIT

      # ── Génération FRONTEND-BUILD-REPORT.md ──────────────────────────
      - name: Générer FRONTEND-BUILD-REPORT.md
        if: always()
        run: |
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          NODE_VER=$(node --version 2>/dev/null || echo "?")

          # Icône statut
          if [ "$BUILD_STATUS" = "OK" ]; then
            STATUS_ICON="✅"
          else
            STATUS_ICON="❌"
          fi

          # ── Warnings svelte-plugin-vite ───────────────────────────────
          WARNINGS=$(grep -E "WARNING|warning\b|\[WARNING\]" /tmp/frontend-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -v "^$" | head -30 || echo "(aucun)")

          # ── Erreurs TypeScript / Vite ─────────────────────────────────
          ERRORS=$(grep -E "^Error|error TS[0-9]+|✘ \[ERROR\]|SyntaxError|Cannot find|Module not found" \
            /tmp/frontend-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -30 || echo "(aucune)")

          # ── Chunks produits (taille finale du bundle) ─────────────────
          CHUNKS=$(grep -E "kB|gzip" /tmp/frontend-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | tail -20 || echo "(non disponible)")

          # ── Résumé vite (modules transformés, timing) ─────────────────
          VITE_SUMMARY=$(grep -E "modules transformed|✓|vite v|rendering chunks|built in" \
            /tmp/frontend-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -10 || echo "(non disponible)")

          # ── npm audit (vulnérabilités) ────────────────────────────────
          NPM_AUDIT=$(grep -E "vulnerabilit|high|critical|moderate|npm audit" \
            /tmp/frontend-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -10 || echo "(non vérifié)")

          REPORT=".claude/FRONTEND-BUILD-REPORT.md"
          cat > "$REPORT" << ENDOFMD
          # 🎨 Frontend Build Report — Nook

          > Généré automatiquement par \`Frontend.yml\`
          > **${RUN_DATE}**

          ---

          ## Statut

          | Champ | Valeur |
          |-------|--------|
          | **Build** | ${STATUS_ICON} ${BUILD_STATUS:-INCONNU} |
          | **Branche** | \`${BRANCH}\` |
          | **Commit** | [\`${COMMIT_SHORT}\`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}) |
          | **Node.js** | \`${NODE_VER}\` |
          | **Run** | [Voir le run](${RUN_URL}) |

           ---

          ## Erreurs TypeScript / Vite

          \`\`\`
          ${ERRORS}
          \`\`\`

          ---

          ## Warnings svelte-vite-plugin (a11y, imports)

          \`\`\`
          ${WARNINGS}
          \`\`\`

          ---

          ## Bundle — modules et tailles (gzip)

          \`\`\`
          ${VITE_SUMMARY}

          ${CHUNKS}
          \`\`\`

          ---

          ## npm audit

          \`\`\`
          ${NPM_AUDIT}
          \`\`\`

          ---

          *Rapport généré par \`.github/workflows/Frontend.yml\`*
          ENDOFMD

          echo "✅ FRONTEND-BUILD-REPORT.md généré"
          cat "$REPORT"

      - name: Commit FRONTEND-BUILD-REPORT.md
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/FRONTEND-BUILD-REPORT.md
          if git diff --staged --quiet; then
            echo "Aucune modification — pas de commit"
          else
            git commit -m "ci: FRONTEND-BUILD-REPORT.md [run ${{ github.run_id }}]"
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité"
          fi

      # Nom fixe → Docker.yml et test-nook.yml peuvent le télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          if-no-files-found: error
          retention-days: 7
