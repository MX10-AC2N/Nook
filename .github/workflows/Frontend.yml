name: 2 ==> Frontend Build

on:
  workflow_dispatch:

jobs:
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        id: build
        working-directory: ./frontend
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/frontend-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          # Vérification explicite
          if [ $BUILD_EXIT -ne 0 ] || [ ! -f build/index.html ]; then
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
            echo "❌ Build échoué"
          else
            echo "build_status=OK" >> $GITHUB_OUTPUT
            FILE_COUNT=$(ls build | wc -l)
            echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Frontend OK — $FILE_COUNT fichiers"
            ls -la build/
          fi

          exit $BUILD_EXIT

      # ── Génération FRONTEND-BUILD-REPORT.md ──────────────────────────
      - name: Générer FRONTEND-BUILD-REPORT.md
        if: always()
        env:
          RUN_DATE: "${{ env.run_date }}"
          COMMIT_SHA: "${{ github.sha }}"
          BRANCH: "${{ github.ref_name }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_STATUS: "${{ steps.build.outputs.build_status }}"
          NODE_VER: "${{ steps.build.outputs.node_ver }}"
          BUILD_DURATION: "${{ steps.build.outputs.build_duration }}"
          OUTPUT_SIZE: "${{ steps.build.outputs.total_size }}"
          FILE_COUNT: "${{ steps.build.outputs.file_count }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: bash .github/scripts/generate-frontend-report.sh

      - name: Commit FRONTEND-BUILD-REPORT.md
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hermes/FRONTEND-BUILD-REPORT.md
          if git diff --staged --quiet; then
            echo "Aucune modification — pas de commit"
          else
            git commit -m "ci: FRONTEND-BUILD-REPORT.md [run ${{ github.run_id }}]"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || git reset origin/${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité"
          fi

      # Nom fixe → Docker.yml et test-nook.yml peuvent le télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          if-no-files-found: error
          retention-days: 7
