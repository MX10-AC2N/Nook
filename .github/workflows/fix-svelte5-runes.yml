name: 🧹 Purify Frontend for Svelte 5

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'

env:
  NODE_VERSION: 20
  WORKING_DIR: frontend

jobs:
  svelte5-purify:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nécessaire pour push automatique

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          npm ci || {
            echo "⚠️ npm ci failed, falling back to npm install"
            rm -rf node_modules package-lock.json
            npm install
          }

      - name: 🔍 Detect and rename Svelte 5 runes files
        id: rename
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "🔍 Scanning for JS/TS files using Svelte 5 runes..."

          RUNES=('$state' '$derived' '$effect' '$props' '$bindable' '$inspect')
          TMP_RENAMES="/tmp/svelte5_renames.txt"
          > "$TMP_RENAMES"

          while IFS= read -r -d '' file; do
            for rune in "${RUNES[@]}"; do
              # Recherche : rune en début de ligne (optionnel whitespace) + mot entier
              if grep -q "^[[:space:]]*${rune}\>" "$file" 2>/dev/null; then
                if [[ "$file" == *.ts ]]; then
                  newfile="${file%.ts}.svelte.ts"
                else
                  newfile="${file%.js}.svelte.js"
                fi

                echo "✅ Found rune in $file → renaming to $newfile"
                mv "$file" "$newfile"
                echo "$file|$newfile" >> "$TMP_RENAMES"
                break
              fi
            done
          done < <(find src -type f \( -name "*.js" -o -name "*.ts" \) ! -name "*.svelte.*" ! -name "*.config.*" -print0)

          COUNT=$(wc -l < "$TMP_RENAMES" 2>/dev/null || echo 0)
          echo "renamed_count=$COUNT" >> $GITHUB_OUTPUT
          if [ -s "$TMP_RENAMES" ]; then
            echo "renamed_files<<EOF" >> $GITHUB_OUTPUT
            cat "$TMP_RENAMES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
          echo "✨ Renamed $COUNT file(s)"

      - name: 🔧 Fix imports across project
        if: steps.rename.outputs.renamed_count != '0'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euo pipefail
          TMP_RENAMES="/tmp/svelte5_renames.txt"
          [ ! -f "$TMP_RENAMES" ] && exit 0

          echo "🔧 Updating imports..."
          while IFS='|' read -r oldfile newfile; do
            [ -z "$oldfile" ] && continue

            # Extraire le chemin relatif depuis src/
            old_rel="${oldfile#src/}"
            new_rel="${newfile#src/}"

            # Obtenir le nom de base sans extension
            old_base=$(echo "$old_rel" | sed 's/\.[^.]*$//')
            new_base=$(echo "$new_rel" | sed 's/\.svelte\.[^.]*$//')

            # Échapper pour regex
            esc_old=$(printf '%s' "$old_base" | sed 's/[[\.*^$()+?{|]/\\&/g')
            esc_new=$(printf '%s' "$new_base" | sed 's/[[\.*^$()+?{|]/\\&/g')

            echo "  📝 Fixing imports from '$old_base' → '$new_base.svelte'"

            # Mettre à jour tous les fichiers source
            find src -type f \( -name "*.svelte" -o -name "*.js" -o -name "*.ts" \) -exec \
              sed -i "s|from ['\"]\(\./\|\.\./\|\$lib/\)${esc_old}['\"]|from '\1${esc_new}.svelte'|g" {} +
          done < "$TMP_RENAMES"

      - name: 🧪 Run type checking (svelte-check)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🧪 Running svelte-check..."
          npx svelte-check --tsconfig ./tsconfig.json --fail-on-warning

      - name: 🧪 Run unit tests (optional but recommended)
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          if [ -f package.json ] && grep -q '"test":' package.json; then
            echo "🧪 Running tests..."
            npm test
          else
            echo "⏭️ No test script found — skipping"
          fi

      - name: 🏗️ Build production bundle
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "🏗️ Building Svelte 5 app for production..."
          npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: svelte5-build
          path: ${{ env.WORKING_DIR }}/dist
          retention-days: 7

      - name: 💾 Commit and push changes (if any)
        if: steps.rename.outputs.renamed_count != '0'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if ! git diff --quiet HEAD; then
            git add .
            git commit -m "🧹 chore: Enforce Svelte 5 purity (auto-fix runes files)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Changes pushed."
          else
            echo "⏭️ No changes to commit."
          fi

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🧹 Svelte 5 Purity Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.rename.outputs.renamed_count }}" != "0" ]; then
            echo "✅ **${{ steps.rename.outputs.renamed_count }} file(s) migrated** to Svelte 5 runes format." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.rename.outputs.renamed_files }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No migration needed — codebase is already Svelte 5 compliant." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Build artifact available for download." >> $GITHUB_STEP_SUMMARY
