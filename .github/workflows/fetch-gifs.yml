name: 🎬 Fetch GIFs — Collection de base (image Docker)

# Workflow MANUEL — à lancer UNE FOIS pour peupler frontend/static/gifs/
# Ces GIFs sont intégrés dans l'image Docker comme collection de secours.
#
# Quand lancer :
#   - À la première mise en place des GIFs dans le projet
#   - Pour rafraîchir la collection de base (ex: après un an)
#   - Si un utilisateur déploie SANS GIPHY_API_KEY, ces GIFs seront affichés
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  Utilisateurs avec GIPHY_API_KEY dans leur .env :              │
# │  → gifs_updater.rs met à jour /app/data/gifs/ automatiquement  │
# │    toutes les semaines, sans rebuild de l'image.               │
# │                                                                 │
# │  Utilisateurs SANS clé Giphy :                                  │
# │  → Axum sert le fallback frontend/static/gifs/ (ce workflow)   │
# └─────────────────────────────────────────────────────────────────┘
#
# Nécessite le secret GIFS_API_KEY dans GitHub → Settings → Secrets → Actions.
# Clé SDK gratuite : https://developers.giphy.com → Create App → SDK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (afficher sans télécharger)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  fetch-gifs:
    name: 🎬 Collection de base — frontend/static/gifs/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Préparer le dossier
        run: mkdir -p frontend/static/gifs

      - name: Télécharger les GIFs
        env:
          GIFS_API_KEY: ${{ secrets.GIFS_API_KEY }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "ℹ️  Mode dry-run — aucun fichier téléchargé"
          fi
          python3 scripts/fetch-gifs.py $DRY_FLAG
          echo "=== Contenu frontend/static/gifs/ ==="
          ls -lh frontend/static/gifs/ | head -20
          find frontend/static/gifs -name "*.gif" | wc -l

      - name: Vérifier index.json
        run: |
          if [ -f frontend/static/gifs/index.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('frontend/static/gifs/index.json')); print(d['total'])")
            echo "✅ index.json : $TOTAL GIFs indexés"
          else
            echo "⚠️  index.json absent (dry-run ?)"
          fi

      - name: Commit dans le repo
        if: inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/static/gifs/
          if git diff --staged --quiet; then
            echo "ℹ️  Aucun changement"
          else
            ADDED=$(git diff --staged --name-only | grep '\.gif$' | wc -l)
            git commit -m "feat(gifs): collection de base — ${ADDED} GIFs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ $ADDED GIFs commités dans frontend/static/gifs/"
          fi

      - name: Résumé
        run: |
          echo "## 🎬 Collection GIFs de base" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ces GIFs sont dans l'image Docker — fallback pour les déploiements sans \`GIPHY_API_KEY\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/static/gifs/index.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('frontend/static/gifs/index.json')); print(d['total'])")
            echo "| GIFs dans l'image | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Dossier | \`frontend/static/gifs/\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Mise à jour auto (avec clé) | \`gifs_updater.rs\` — toutes les 7 jours |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "> ℹ️ Dry-run — aucun fichier téléchargé." >> $GITHUB_STEP_SUMMARY
          fi
