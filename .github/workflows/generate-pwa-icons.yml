name: "1.5==> Generation icones PWA"

# Genere automatiquement les icones PNG de la PWA depuis logo-animated.svg
# et les commit directement dans la branche courante.
#
# Icones produites :
#   favicon.png         32x32   - onglet navigateur
#   logo-192.png       192x192  - manifest PWA standard
#   logo-512.png       512x512  - manifest PWA maskable
#   icon-72.png         72x72   - badge service worker
#   icon-192.png       192x192  - icone service worker
#   icon-72-dark.png    72x72   - badge mode sombre
#   icon-192-dark.png  192x192  - icone mode sombre

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la regeneration meme si le SVG n'a pas change"
        required: false
        default: "false"
        type: boolean

  push:
    branches:
      - MX10-AC2N-patch-svelte5-runes
      - main
    paths:
      - "frontend/static/logo-animated.svg"

permissions:
  contents: write

jobs:
  generate-icons:
    name: "Generation icones PWA"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Verification SVG source"
        run: |
          if [ ! -f frontend/static/logo-animated.svg ]; then
            echo "SVG source introuvable"
            exit 1
          fi
          echo "SVG source OK ($(wc -c < frontend/static/logo-animated.svg) octets)"

      - name: "Installation Inkscape"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape
          inkscape --version

      - name: "Preparation SVG statique"
        run: |
          cat > /tmp/prep_svg.py << 'PYEOF'
          import re, sys

          with open("frontend/static/logo-animated.svg", "r") as f:
              svg = f.read()

          style_static = (
              "\n  .letter {\n"
              "    fill: currentColor;\n"
              "    stroke: currentColor;\n"
              "    stroke-width: 8;\n"
              "    stroke-linecap: round;\n"
              "    stroke-linejoin: round;\n"
              "    font-family: 'Courier New', Courier, monospace;\n"
              "    font-weight: 900;\n"
              "    font-size: 100px;\n"
              "  }\n"
              "  .splatter { fill: currentColor; opacity: 0.3; }\n"
          )

          svg2 = re.sub(r"<style>.*?</style>", "<style>" + style_static + "</style>", svg, flags=re.DOTALL)
          svg2 = re.sub(r' class="letter [^"]*"', ' class="letter"', svg2)
          svg2 = re.sub(r' class="splatter [^"]*"', ' class="splatter"', svg2)
          svg2 = re.sub(r"<animate[^/]*/?>", "", svg2)
          svg2 = svg2.replace('opacity="0">', 'opacity="0.2">')

          with open("/tmp/logo-static.svg", "w") as f:
              f.write(svg2)
          print("OK")
          PYEOF
          python3 /tmp/prep_svg.py

      - name: "Variantes light et dark"
        run: |
          cat > /tmp/variants.py << 'PYEOF'
          with open("/tmp/logo-static.svg") as f:
              svg = f.read()

          light = svg.replace("<svg ", '<svg style="background:#f0fdf4;color:#2d5a27" ', 1)
          with open("/tmp/logo-light.svg", "w") as f:
              f.write(light)

          dark = svg.replace("<svg ", '<svg style="background:#1a1a2e;color:#4ade80" ', 1)
          with open("/tmp/logo-dark.svg", "w") as f:
              f.write(dark)
          print("OK")
          PYEOF
          python3 /tmp/variants.py

      - name: "Conversion SVG vers PNG"
        run: |
          STATIC="frontend/static"
          LIGHT="/tmp/logo-light.svg"
          DARK="/tmp/logo-dark.svg"

          do_convert() {
            local src="$1" dst="$2" w="$3"
            inkscape \
              --export-type=png \
              --export-filename="$dst" \
              --export-width="$w" \
              --export-height="$w" \
              --export-background-opacity=1 \
              "$src" 2>/dev/null
            [ -f "$dst" ] \
              && echo "OK $dst ($(wc -c < "$dst") octets)" \
              || { echo "ECHEC $dst"; return 1; }
          }

          echo "--- Light ---"
          do_convert "$LIGHT" "$STATIC/favicon.png"   32
          do_convert "$LIGHT" "$STATIC/logo-192.png" 192
          do_convert "$LIGHT" "$STATIC/logo-512.png" 512
          do_convert "$LIGHT" "$STATIC/icon-72.png"   72
          do_convert "$LIGHT" "$STATIC/icon-192.png" 192

          echo "--- Dark ---"
          do_convert "$DARK" "$STATIC/icon-72-dark.png"  72
          do_convert "$DARK" "$STATIC/icon-192-dark.png" 192

          ls -lh "$STATIC"/*.png

      - name: "Optimisation PNG oxipng"
        run: |
          if ! command -v oxipng &>/dev/null; then
            npm install -g oxipng-bin --silent 2>/dev/null || true
          fi
          if command -v oxipng &>/dev/null; then
            oxipng --opt 4 --strip all frontend/static/*.png
            ls -lh frontend/static/*.png
          else
            echo "oxipng indisponible - etape ignoree"
          fi

      - name: "Verification des icones"
        run: |
          STATIC="frontend/static"
          REQUIRED="favicon.png logo-192.png logo-512.png icon-72.png icon-192.png icon-72-dark.png icon-192-dark.png"
          ALL_OK=true
          for f in $REQUIRED; do
            if [ -f "$STATIC/$f" ] && [ -s "$STATIC/$f" ]; then
              echo "OK $f ($(wc -c < "$STATIC/$f") octets)"
            else
              echo "MANQUANT $f"
              ALL_OK=false
            fi
          done
          $ALL_OK || exit 1
          echo "Toutes les icones PWA sont presentes"

      - name: "Commit des icones"
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            frontend/static/favicon.png \
            frontend/static/logo-192.png \
            frontend/static/logo-512.png \
            frontend/static/icon-72.png \
            frontend/static/icon-192.png \
            frontend/static/icon-72-dark.png \
            frontend/static/icon-192-dark.png

          if git diff --cached --quiet; then
            echo "Aucun changement - commit ignore"
          else
            CHANGED=$(git diff --cached --name-only | wc -l)
            git commit -m "chore(pwa): regeneration icones PWA [skip ci]" \
              -m "Icones mises a jour: ${CHANGED} fichier(s)" \
              -m "Workflow: ${{ github.workflow }} run ${{ github.run_number }}"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "Icones commitees sur ${{ github.ref_name }}"
          fi

      - name: "Resume"
        if: always()
        run: |
          {
            echo "## Icones PWA generees"
            echo ""
            echo "| Fichier | Taille | Usage |"
            echo "|---------|--------|-------|"
            for entry in \
              "favicon.png:Onglet navigateur" \
              "logo-192.png:Manifest PWA standard" \
              "logo-512.png:Manifest PWA maskable" \
              "icon-72.png:Badge notifications light" \
              "icon-192.png:Icone notifications light" \
              "icon-72-dark.png:Badge notifications dark" \
              "icon-192-dark.png:Icone notifications dark"
            do
              f="${entry%%:*}"
              usage="${entry##*:}"
              if [ -f "frontend/static/$f" ]; then
                size=$(du -sh "frontend/static/$f" | cut -f1)
                echo "| \`${f}\` | ${size} | ${usage} |"
              else
                echo "| \`${f}\` | manquant | ${usage} |"
              fi
            done
            echo ""
            echo "> Source: frontend/static/logo-animated.svg"
            echo "> Branche: ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
