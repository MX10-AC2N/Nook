name: 🔄 Update Cargo.lock

on:
  push:
    paths:
      - 'backend/Cargo.toml'
  workflow_dispatch:

jobs:
  update-lock:
    name: Generate & Commit Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        working-directory: backend
        run: cargo update

      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock
          if git diff --staged --quiet; then
            echo "Aucun changement"
          else
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || git reset --hard origin/${{ github.ref_name }}
            git add backend/Cargo.lock
            git commit -m "chore: Update Cargo.lock"
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
          fi
