name: 🔄 Update Cargo.lock

on:
  push:
    paths:
      - 'backend/Cargo.toml'

jobs:
  update-lock:
    name: Generate & Commit Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        working-directory: backend
        run: |
          # Generate lock file without updating all deps
          cargo generate-lockfile
          # Verify it works
          cargo check

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "chore: Update Cargo.lock [$(date +'%Y-%m-%d')]"
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }} || true
          git push --force-with-lease origin HEAD:${{ github.ref_name }}
