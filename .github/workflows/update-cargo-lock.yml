name: 🔄 Update Cargo.lock

on:
  push:
    paths:
      - 'backend/Cargo.toml'

jobs:
  update-lock:
    name: Verify & Commit Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.lock
        working-directory: backend
        run: |
          # If a Cargo.lock was committed use it as-is (it is the source of truth,
          # e.g. redis 0.27.6 pinned). Regenerating from scratch with
          # `cargo generate-lockfile` ignores it and may resolve newer transitive
          # deps that do not compile on the current stable toolchain.
          if [ ! -f Cargo.lock ]; then
            echo "Cargo.lock missing — generating one."
            cargo generate-lockfile
          fi

          # Defensively pin redis to the known-good version so the lock stays
          # reproducible even if run on a fresher registry index.
          cargo update -p redis --precise 0.27.6 || true

          # Validate the lock actually compiles (uses the committed Cargo.lock).
          cargo check --locked

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/Cargo.lock
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "chore: Update Cargo.lock [$(date +'%Y-%m-%d')]"
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }} || true
          git push --force-with-lease origin HEAD:${{ github.ref_name }}
