name: 🔄 Update Cargo.lock

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/Cargo.toml'   # Se déclenche seulement si Cargo.toml change
  workflow_dispatch:  # Pour le lancer manuellement si besoin

jobs:
  update-lockfile:
    name: Generate & Commit Cargo.lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}  # Important pour pouvoir pousser

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Generate Cargo.lock
        run: |
          if [ ! -f "Cargo.lock" ]; then
            echo "Cargo.lock absent → génération"
          else
            echo "Cargo.lock présent → mise à jour"
          fi
          cargo generate-lockfile

      - name: Commit & Push Cargo.lock if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          
          git add Cargo.lock
          if git diff --staged --quiet; then
            echo "✅ Cargo.lock inchangé, rien à committer"
            exit 0
          fi
          
          git commit -m "chore: update Cargo.lock" || echo "Commit échoué (normal si rien à faire)"
          git push origin HEAD:${{ github.ref }}
          echo "✅ Cargo.lock mis à jour et poussé"