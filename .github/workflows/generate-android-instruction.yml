name: 📱 Générer l'instruction Android Claude.ai

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'VERSION'
      - '.claude/**'
      - 'README.md'
      - '.claude/tools/scripts/generate-android-instruction.py'

permissions:
  contents: write

concurrency:
  group: $${{ github.workflow }}-$${{ github.ref }}  # ✅ Syntaxe corrigée
  cancel-in-progress: true

jobs:
  generate:
    name: 📱 Générer ANDROID-INSTRUCTION.md (analyse complète)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 1. Extraire infos projet (version corrigée + robuste) ─────
      - name: 📋 Extraire infos projet
        id: info
        run: |
          set +e  # Désactiver l'arrêt sur erreur pour les grep
          
          VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
          if [ $$? -ne 0 ] || [ -z "$$VERSION" ]; then
            VERSION="unknown"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          ACTIVE_BUGS=$(grep -c "^### Bug #" .claude/BUGS.md 2>/dev/null)
          if [ $? -ne 0 ]; then
            ACTIVE_BUGS=0
          fi
          echo "active_bugs=$ACTIVE_BUGS" >> $GITHUB_OUTPUT

          SESSION=$(grep -oP 'Session courante\s*:\s*\*\*(\d+)\*\*' .claude/CLAUDE.md 2>/dev/null | head -1 | grep -oP '\d+')
          if [ $$? -ne 0 ] || [ -z "$$SESSION" ]; then
            SESSION=0
          fi
          echo "session=$SESSION" >> $GITHUB_OUTPUT

          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
        shell: bash

      # ── 2. Générer l'instruction (avec critical-pitfalls.md) ─────
      - name: 🔍 Analyser repo + Générer instruction Android
        run: |
          python3 .claude/tools/scripts/generate-android-instruction.py \
            "${{ steps.info.outputs.version }}" \
            "${{ steps.info.outputs.session }}" \
            "${{ steps.info.outputs.date }}" \
            "${{ steps.info.outputs.active_bugs }}"
        shell: bash

      # ── 3. Commit si changement ───────────────────────────────────
      - name: 📤 Commit ANDROID-INSTRUCTION.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/ANDROID-INSTRUCTION.md

          if git diff --staged --quiet; then
            echo "ℹ️ Instruction Android inchangée"
          else
            git commit -m "docs(android): mise à jour instruction personnalisée v${{ steps.info.outputs.version }} [skip ci]"
            git push
            echo "✅ ANDROID-INSTRUCTION.md mis à jour"
          fi
        shell: bash

      # ── 4. Résumé ────────────────────────────────────────────────
      - name: 📊 Résumé
        run: |
          set +e
          CHAR_COUNT=$(grep -oP '\d+(?=\s+/\s+1500)' .claude/ANDROID-INSTRUCTION.md 2>/dev/null | head -1)
          if [ -z "$CHAR_COUNT" ]; then
            CHAR_COUNT=0
          fi
          
          AGENT_COUNT=$(ls .claude/roles/*.md 2>/dev/null | wc -l)
          if [ $? -ne 0 ]; then
            AGENT_COUNT=0
          fi

          echo "## 📱 Instruction Android générée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrique                  | Valeur                          |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------------------|---------------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version**               | ${{ steps.info.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Session**               | ${{ steps.info.outputs.session }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bugs actifs**           | ${{ steps.info.outputs.active_bugs }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Taille instruction**    | $CHAR_COUNT / 1500 chars        |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agents détectés**       | $AGENT_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Fichier : \`.claude/ANDROID-INSTRUCTION.md\`" >> $GITHUB_STEP_SUMMARY
        shell: bash