name: 📱 Générer l'instruction Android Claude.ai

# Génère automatiquement l'instruction personnalisée pour l'app Claude.ai Android
# depuis l'état actuel du projet (version, bugs actifs, agents disponibles).
# Commite le fichier .claude/ANDROID-INSTRUCTION.md dans le repo.
# Agent concerné : 📐 ARCHITECT (meta)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.claude/BUGS.md'
      - '.claude/rules/memory-sessions.md'
      - '.claude/CLAUDE.md'
      - 'VERSION'

permissions:
  contents: write

jobs:
  generate:
    name: 📱 Générer ANDROID-INSTRUCTION.md
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Extraire les infos dynamiques du repo ──────────────────
      - name: Extraire infos projet
        id: info
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          AGENT_COUNT=$(ls .claude/roles/*.md | wc -l)
          echo "agent_count=$AGENT_COUNT" >> $GITHUB_OUTPUT

          AGENTS=$(grep "^\| [🦀🎨🚀🧪🔐♟📊📐🤖]" .claude/CLAUDE.md | \
            sed 's/| \*\*\([^*]*\)\*\*.*/\1/' | \
            sed 's/^| //' | tr '\n' '/' | sed 's/\/$//')
          echo "agents=$AGENTS" >> $GITHUB_OUTPUT

          ACTIVE_BUGS=$(grep -c "^### Bug #" .claude/BUGS.md 2>/dev/null || echo 0)
          echo "active_bugs=$ACTIVE_BUGS" >> $GITHUB_OUTPUT

          SESSION=$(grep "Session courante" .claude/CLAUDE.md | grep -oE "[0-9]+" | head -1)
          echo "session=$SESSION" >> $GITHUB_OUTPUT

          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # ── 2. Générer l'instruction Android (<1500 chars) ─────────────
      - name: Générer ANDROID-INSTRUCTION.md
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          SESSION="${{ steps.info.outputs.session }}"
          DATE="${{ steps.info.outputs.date }}"
          ACTIVE_BUGS="${{ steps.info.outputs.active_bugs }}"

          python3 - "$VERSION" "$SESSION" "$DATE" "$ACTIVE_BUGS" << 'PYEOF'
          import sys

          version, session, date, active_bugs = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          instruction = f"""Tu es l'assistant principal du projet Nook (v{version}, session {session}).
          Messagerie familiale self-hosted — Rust/Axum 0.8 + SvelteKit 5 Runes + SQLite + Docker distroless.
          Repo: https://github.com/MX10-AC2N/Nook | Branche: main
          Raw: https://raw.githubusercontent.com/MX10-AC2N/Nook/main/

          AVANT CHAQUE INTERVENTION:
          1. Fetcher .claude/BUGS.md ({active_bugs} bugs actifs)
          2. Fetcher .claude/rules/memory-sessions.md
          3. Fetcher les fichiers sources concernés (jamais travailler de mémoire)

          AGENTS DISPONIBLES (fichiers dans .claude/roles/):
          🦀RUST | 🎨SVELTE | 🚀DEVOPS | 🧪E2E | 🔐CRYPTO | ♟CHESS | 📊DATA | 📐ARCHITECT | 🤖DELEGATE

          RÈGLES ABSOLUES:
          • Fichier complet — jamais de diff partiel
          • .svelte/.ts → livrer en .txt
          • Chemin exact en tête de chaque bloc de code
          • Signaler les effets de bord inter-agents
          • Clôture: mettre à jour BUGS.md + SESSIONS.md

          Pièges critiques: rand::rng() (pas thread_rng) | routes {{param}} axum 0.8 | $state Svelte 5 via Object.assign | CORS + credentials → origins explicites | sqlx sans macros si queries.json vide"""

          char_count = len(instruction)
          status = "✅ OK" if char_count <= 1500 else f"⚠️ TROP LONG ({char_count} chars)"

          with open(".claude/ANDROID-INSTRUCTION.md", "w") as f:
          f.write(f"""# 📱 Instruction personnalisée Android — Nook

          > Générée le : **{date}** | Version : **{version}** | Session : **{session}**
          > Taille : **{char_count} / 1500 chars** {status}

          ---

          ## 📋 Instruction à copier dans Claude.ai Android

          > Paramètres → Instructions personnalisées → coller le texte ci-dessous

          ```
          {instruction}
          ```

          ---

          ## 🔄 Mise à jour

          Ce fichier est **auto-généré** par le workflow `generate-android-instruction.yml`.
          Il se met à jour automatiquement quand `VERSION`, `BUGS.md` ou `CLAUDE.md` changent.

          Pour forcer une régénération : lancer le workflow manuellement depuis GitHub Actions.

          ---

          ## 📊 Statistiques

          | | |
          |---|---|
          | Taille instruction | {char_count} chars / 1500 max |
          | Bugs actifs | {active_bugs} |
          | Version projet | {version} |
          | Session | {session} |
          """)

          print(f"Instruction générée: {char_count} chars")
          print(status)

          if char_count > 1500:
              sys.exit(1)
          PYEOF

      # ── 3. Commit ─────────────────────────────────────────────────
      - name: Commit ANDROID-INSTRUCTION.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/ANDROID-INSTRUCTION.md
          if git diff --staged --quiet; then
            echo "ℹ️ Instruction Android inchangée"
          else
            git commit -m "docs(android): mettre à jour l'instruction personnalisée v${{ steps.info.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ ANDROID-INSTRUCTION.md mis à jour dans .claude/"
          fi

      # ── 4. Résumé ─────────────────────────────────────────────────
      - name: Résumé
        run: |
          echo "## 📱 Instruction Android générée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ steps.info.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Session** | ${{ steps.info.outputs.session }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bugs actifs** | ${{ steps.info.outputs.active_bugs }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Fichier disponible : \`.claude/ANDROID-INSTRUCTION.md\`" >> $GITHUB_STEP_SUMMARY
