name: 1 ==> Backend Build & Artifact

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend.yml'

jobs:
  backend:
    name: 1 ==> Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-arm64
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross (for amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --features cargo-cross
          cross --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}-${{ matrix.arch }}

      - name: Check
        id: check
        working-directory: ./backend
        run: |
          set +e
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            cross check --target ${{ matrix.target }} --all-targets 2>&1 | tee /tmp/cargo-check.txt
          else
            cargo check --target ${{ matrix.target }} --all-targets 2>&1 | tee /tmp/cargo-check.txt
          fi
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: Clippy
        id: clippy
        working-directory: ./backend
        run: |
          set +e
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            cross clippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          else
            cargo clippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          fi
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: Build
        id: build
        working-directory: ./backend
        run: |
          set +e
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            cross build --release --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          else
            cargo build --release --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          fi
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Prepare artifact
        working-directory: ./backend
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "✅ nook-backend-${{ matrix.arch }} ready"

      - name: Generate report
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH="${{ matrix.arch }}"
          REPORT=".hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md"
          echo "# Backend Build Report — ${ARCH}" > "$REPORT"
          echo "" >> "$REPORT"
          echo "- Status: ${{ steps.build.outputs.build_status }}" >> "$REPORT"
          echo "- Size: ${{ steps.build.outputs.bin_size }}" >> "$REPORT"
          echo "✅ Report generated"

      - name: Commit report
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hermes/reports/BACKEND-BUILD-REPORT-${{ matrix.arch }}.md || true
          git commit -m "ci: update backend report for ${{ matrix.arch }}" || echo "No changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push --force-with-lease origin HEAD:${{ github.ref_name }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
