name: 1==>🏗️ Backend Build & Artifact

on:
  workflow_dispatch:

jobs:
  backend:
    name: 🏗️ Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./backend

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: cargo check
        id: check
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo check --all-targets --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-check.txt
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo clippy --target ${{ matrix.target }} -- -D warnings 2>&1 | tee /tmp/cargo-clippy.txt
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo build --release
        id: build
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          set +e
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "📏 Taille : $BIN_SIZE"
            ls -lh $BINARY
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi

          exit $BUILD_EXIT

      - name: Préparer le binaire (suffixe amd64/arm64)
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${ARCH}
          echo "✅ artifacts/nook-backend-${ARCH} prêt"

      # ── Génération BACKEND-BUILD-REPORT-{arch}.md ─────────────────────
      # Un fichier PAR architecture → zéro race condition entre les deux jobs matrix.
      # Claude lit BACKEND-BUILD-REPORT-amd64.md ET BACKEND-BUILD-REPORT-arm64.md
      # séparément. Chaque fichier est auto-suffisant et complet pour son architecture.
      - name: Générer BACKEND-BUILD-REPORT-{arch}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUSTC_VER=$(rustc --version 2>/dev/null || echo "?")
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          BIN_SIZE="${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT="${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT="${{ steps.clippy.outputs.clippy_exit }}"

          [ "$BUILD_STATUS" = "OK" ] && BUILD_ICON="✅" || BUILD_ICON="❌"
          [ "$CHECK_EXIT"  = "0" ]   && CHECK_ICON="✅"  || CHECK_ICON="❌"
          [ "$CLIPPY_EXIT" = "0" ]   && CLIPPY_ICON="✅" || CLIPPY_ICON="❌"

          if [ "$BUILD_STATUS" = "OK" ] && [ "$CHECK_EXIT" = "0" ] && [ "$CLIPPY_EXIT" = "0" ]; then
            GLOBAL_STATUS="✅ OK"
          else
            GLOBAL_STATUS="❌ FAIL"
          fi

          # ── Build Time Extraction ─────────────────────────────────────
          COMPILE_TIME=$(grep -oP 'Finished .*(optimized|release).*profile.*in \K[0-9.]+' /tmp/cargo-build.txt 2>/dev/null | tail -1 || echo "N/A")
          [ -z "$COMPILE_TIME" ] && COMPILE_TIME="N/A"

          FINISHED_LINE=$(grep -iE "^\s*Finished " /tmp/cargo-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | tail -3)
          [ -z "$FINISHED_LINE" ] && FINISHED_LINE="(non disponible)"

          COMPILE_PROGRESSION=$(grep -E "^\s*Compiling " /tmp/cargo-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | tail -20)
          [ -z "$COMPILE_PROGRESSION" ] && COMPILE_PROGRESSION="(non disponible)"

          # ── Warning Counts (AI Trend Tracking) ────────────────────────
          CHECK_WARNING_COUNT=$(grep -cE "^warning" /tmp/cargo-check.txt 2>/dev/null || echo "0")
          CLIPPY_WARNING_COUNT=$(grep -cE "^warning" /tmp/cargo-clippy.txt 2>/dev/null || echo "0")
          BUILD_WARNING_COUNT=$(grep -cE "^warning" /tmp/cargo-build.txt 2>/dev/null || echo "0")
          DEPRECATED_COUNT=$(grep -ciE "deprecated" /tmp/cargo-build.txt 2>/dev/null || echo "0")
          DEAD_CODE_COUNT=$(grep -cE "never used|dead code" /tmp/cargo-build.txt 2>/dev/null || echo "0")

          # ── Erreurs cargo check ───────────────────────────────────────
          CHECK_ERRORS=$(grep -E "^error\[|^error:" /tmp/cargo-check.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -30 || true)
          [ -z "$CHECK_ERRORS" ] && CHECK_ERRORS="(aucune)"

          # ── Compilation Warnings file-by-file (build) ─────────────────
          BUILD_WARNINGS_FILE=$(grep -E "^warning| -->" /tmp/cargo-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -50 || true)
          [ -z "$BUILD_WARNINGS_FILE" ] && BUILD_WARNINGS_FILE="(aucun)"

          # ── Deprecated Warnings Detection ─────────────────────────────
          DEPRECATED_WARNS=$(grep -iE "warning.*deprecated|^.*is deprecated" /tmp/cargo-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -20 || true)
          [ -z "$DEPRECATED_WARNS" ] && DEPRECATED_WARNS="(aucune déprécation détectée)"

          # ── Dead Code Warnings ────────────────────────────────────────
          DEAD_CODE_WARNS=$(grep -E "^warning:.*never used|^warning:.*dead code" /tmp/cargo-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -20 || true)
          [ -z "$DEAD_CODE_WARNS" ] && DEAD_CODE_WARNS="(aucun dead code détecté)"

          # ── Warnings clippy + contexte fichier:ligne ──────────────────
          CLIPPY_WARNS=$(grep -E "^warning\[|^warning:" /tmp/cargo-clippy.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -40 || true)
          [ -z "$CLIPPY_WARNS" ] && CLIPPY_WARNS="(aucun)"

          CLIPPY_CONTEXT=$(grep -E "^warning|[^-]-->" /tmp/cargo-clippy.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -60 || true)
          [ -z "$CLIPPY_CONTEXT" ] && CLIPPY_CONTEXT="(aucun)"

          # ── Clippy Lint Breakdown by type ─────────────────────────────
          CLIPPY_LINTS=$(grep -oP "warning\[clippy::\K[^\]]+" /tmp/cargo-clippy.txt 2>/dev/null \
            | sort | uniq -c | sort -rn | head -15 || true)
          [ -z "$CLIPPY_LINTS" ] && CLIPPY_LINTS="(aucune violation clippy)"

          # ── Erreurs build release ─────────────────────────────────────
          BUILD_ERRORS=$(grep -E "^error\[|^error:" /tmp/cargo-build.txt 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | head -30 || true)
          [ -z "$BUILD_ERRORS" ] && BUILD_ERRORS="(aucune)"

          # ── Dependency Version Info ───────────────────────────────────
          DEP_INFO="(non disponible)"
          if [ -f "backend/Cargo.toml" ]; then
            DEP_INFO=$(grep -E "^\[dependencies\]|^\[dev-dependencies\]|^[a-z_-]+ = " backend/Cargo.toml 2>/dev/null \
              | head -30 || true)
          fi

          REPORT=".claude/BACKEND-BUILD-REPORT-${ARCH}.md"

          cat > "$REPORT" << ENDOFMD
# 🏗️ Backend Build Report — ${ARCH} — Nook

> Généré automatiquement par `Backend.yml` · target `${{ matrix.target }}`
> **${RUN_DATE}**

---

## Statut global : ${GLOBAL_STATUS}

| Champ | Valeur |
|-------|--------|
| **Architecture** | `${ARCH}` (`${{ matrix.target }}`) |
| **Branche** | `${BRANCH}` |
| **Commit** | [`${COMMIT_SHORT}`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}) |
| **Rust** | `${RUSTC_VER}` |
| **Run CI** | [Voir le run complet](${RUN_URL}) |

---

## Étapes

| Étape | Statut | Détail |
|-------|--------|--------|
| **cargo check** | ${CHECK_ICON} | exit ${CHECK_EXIT:-?} |
| **cargo clippy** | ${CLIPPY_ICON} | exit ${CLIPPY_EXIT:-?} (-D warnings) |
| **cargo build --release** | ${BUILD_ICON} | binaire ${BIN_SIZE:-N/A} stripped |

---

## ⏱️ Build Metrics (AI Trend Tracking)

| Métrique | Valeur |
|----------|--------|
| **Compile Time** | ${COMPILE_TIME}s |
| **Binary Size** | ${BIN_SIZE:-N/A} |
| **Check Warnings** | ${CHECK_WARNING_COUNT} |
| **Build Warnings** | ${BUILD_WARNING_COUNT} |
| **Clippy Warnings** | ${CLIPPY_WARNING_COUNT} |
| **Deprecated Warnings** | ${DEPRECATED_COUNT} |
| **Dead Code Warnings** | ${DEAD_CODE_COUNT} |

> *Compare ces valeurs entre les runs pour détecter les régressions.*

---

## Compilation Progression (derniers crates compilés)

```
${COMPILE_PROGRESSION}
```

```
${FINISHED_LINE}
```

---

## Top Clippy Lints (par fréquence)

```
${CLIPPY_LINTS}
```

---

## Erreurs cargo check

```
${CHECK_ERRORS}
```

---

## Warnings clippy (-D warnings = fail si présents)

```
${CLIPPY_WARNS}
```

### Détail avec fichiers et lignes

```
${CLIPPY_CONTEXT}
```

---

## Compilation Warnings (par fichier)

```
${BUILD_WARNINGS_FILE}
```

---

## ⚠️ Warnings de déprécation

```
${DEPRECATED_WARNS}
```

---

## Dead Code Warnings

```
${DEAD_CODE_WARNS}
```

---

## Erreurs cargo build --release

```
${BUILD_ERRORS}
```

---

## Dépendances (Cargo.toml)

```toml
${DEP_INFO}
```

---

*Rapport généré par `.github/workflows/Backend.yml` · job `${{ matrix.target }}`*
ENDOFMD

          echo "✅ ${REPORT} généré"


      - name: Commit BACKEND-BUILD-REPORT-{arch}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/BACKEND-BUILD-REPORT-${ARCH}.md
          if git diff --staged --quiet; then
            echo "Aucune modification — pas de commit"
          else
            git commit -m "ci: BACKEND-BUILD-REPORT-${ARCH}.md [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité"
          fi

      # Nom fixe par architecture → Docker.yml peut les télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
