name: 🏗️ Backend Build & Artifact

on:
  workflow_dispatch:  # Manuel
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'Cargo.lock'
      - '.github/workflows/backend.yml'

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Installer libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: \( {{ runner.os }}-cargo- \){{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ... Toutes les étapes backend que tu avais déjà ...
      # (Générer Cargo.lock, base SQLite, migrations, format, check, clippy,
      #  sqlx prepare, commit .sqlx, build release, vérifier binaire)

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend/target/release/nook-backend
          retention-days: 1