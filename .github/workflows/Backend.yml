name: 1 ==> Backend Build & Artifact

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend.yml'

jobs:
  backend:
    name: 1 ==> Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Docker (multi-stage)
        run: |
          docker run --rm             -v ${{ github.workspace }}:/workspace             -w /workspace/backend             --platform linux/${{ matrix.arch == 'amd64' && 'amd64' || 'arm64' }}             rust:latest             /bin/bash -c "
              rustup target add ${{ matrix.target }} &&
              apt-get update && apt-get install -y musl-tools &&
              cargo build --release --target ${{ matrix.target }} &&
              chmod +x target/${{ matrix.target }}/release/nook-backend
            "
          
      - name: Prepare artifact
        run: |
          mkdir -p backend/artifacts
          cp backend/target/${{ matrix.target }}/release/nook-backend backend/artifacts/nook-backend-${{ matrix.arch }}
          echo "✅ nook-backend-${{ matrix.arch }} ready"

      - name: Generate report
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH="${{ matrix.arch }}"
          REPORT=".hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md"
          echo "# Backend Build Report — ${ARCH}" > "$REPORT"
          echo "" >> "$REPORT"
          echo "- Status: OK (built with Docker)" >> "$REPORT"
          echo "✅ Report generated"

      - name: Commit report
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hermes/reports/BACKEND-BUILD-REPORT-${{ matrix.arch }}.md || true
          git commit -m "ci: update backend report for ${{ matrix.arch }}" || echo "No changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push --force-with-lease origin HEAD:${{ github.ref_name }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
