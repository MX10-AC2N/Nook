name: 1 ==> Backend Build & Artifact

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend.yml'

jobs:
  backend:
    name: 1 ==> Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-arm64

    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --features cargo-cross
          cross --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}-${{ matrix.arch }}

      - name: cross check
        id: check
        working-directory: ./backend
        run: |
          set +e
          cross check --target ${{ matrix.target }} --all-targets 2>&1 | tee /tmp/cargo-check.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "check_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: cross clippy
        id: clippy
        working-directory: ./backend
        run: |
          set +e
          cross clippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "clippy_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: cross build --release
        id: build
        working-directory: ./backend
        run: |
          set +e
          cross build --release --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "Taille : $BIN_SIZE"
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Preparer le binaire
        working-directory: ./backend
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "✅ artifacts/nook-backend-${{ matrix.arch }} pret"

      - name: Generate BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH="${{ matrix.arch }}"
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUSTC_VER=$(rustc --version 2>/dev/null || echo "?")
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          BIN_SIZE="${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT="${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT="${{ steps.clippy.outputs.clippy_exit }}"

          REPORT=".hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md"
          
          # Ecrire le rapport sans '>' YAML
          echo "# Backend Build Report — ${ARCH} — Nook" > "$REPORT"
          echo "" >> "$REPORT"
          echo "Genere automatiquement par Backend.yml" >> "$REPORT"
          echo "Date: ${RUN_DATE}" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "## Statut global" >> "$REPORT"
          [ "$BUILD_STATUS" = "OK" ] && echo "✅ OK" >> "$REPORT" || echo "❌ FAIL" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "## Etapes" >> "$REPORT"
          echo "- cargo check: exit ${CHECK_EXIT:-?}" >> "$REPORT"
          echo "- cargo clippy: exit ${CLIPPY_EXIT:-?}" >> "$REPORT"
          echo "- cargo build: ${BIN_SIZE:-N/A}" >> "$REPORT"
          echo "✅ ${REPORT} genere"

      - name: Commit BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hermes/reports/BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
          git commit -m "ci: BACKEND-BUILD-REPORT-${{ matrix.arch }}.md [run ${{ github.run_id }}]" || echo "No changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || echo "Pull failed"
          git push --force-with-lease origin HEAD:${{ github.ref_name }} || echo "Push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
