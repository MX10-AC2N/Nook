name: 1 ==> 🏗️ Backend Build & Artifact

on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (${{ matrix.arch }})
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ./backend

    env:
      RUSTFLAGS: "--cap-lints allow"
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Install Zig (for cargo-zig)
        uses: mlugg/install-zig@v1
        with:
          version: 0.11.0

      - name: Install cargo-zig
        run: cargo install cargo-zig

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}-${{ matrix.arch }}-zig

      - name: cargo check
        id: check
        run: |
          set +e
          cargo zigcheck --all-targets --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-check.txt
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        run: |
          set +e
          cargo zigclippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo test
        id: test
        run: |
          set +e
          cargo zigtest --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-test.txt
          echo "test_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo zigbuild --release
        id: build
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          set +e
          cargo zigbuild --release --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "Size: $BIN_SIZE"
            ls -lh $BINARY
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi

          exit $BUILD_EXIT

      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "artifacts/nook-backend-${{ matrix.arch }} ready"

      - name: Generate BACKEND-BUILD-REPORT
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARCH: ${{ matrix.arch }}
          COMMIT_SHA: "${{ github.sha }}"
          BRANCH: "${{ github.ref_name }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_STATUS: "${{ steps.build.outputs.build_status }}"
          BIN_SIZE: "${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT: "${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT: "${{ steps.clippy.outputs.clippy_exit }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: bash .github/scripts/generate-backend-report.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
