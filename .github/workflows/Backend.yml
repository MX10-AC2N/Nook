name: 1 ==> Backend Build & Artifact

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend.yml'

jobs:
  backend:
    name: 1 ==> Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-arm64

    env:
      RUSTFLAGS: "-C linker=zig cc -target x86_64-linux-musl -C target-feature=+crt-static --cap-lints allow"
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install zig
        run: |
          sudo apt-get update
          sudo apt-get install -y zig
          zig version

      - name: cargo check
        id: check
        run: |
          set +e
          cargo check --target ${{ matrix.target }} --all-targets 2>&1 | tee /tmp/cargo-check.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "check_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        run: |
          set +e
          cargo clippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "clippy_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e

      - name: cargo build --release
        id: build
        run: |
          set +e
          cargo build --release --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "📏 Taille : $BIN_SIZE"
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Préparer le binaire
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "✅ artifacts/nook-backend-${{ matrix.arch }} prêt"

      - name: Générer BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH="${{ matrix.arch }}"
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUSTC_VER=$(rustc --version 2>/dev/null || echo "?")
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          BIN_SIZE="${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT="${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT="${{ steps.clippy.outputs.clippy_exit }}"

          [ "$BUILD_STATUS" = "OK" ] && BUILD_ICON="✅" || BUILD_ICON="❌"
          [ "$CHECK_EXIT" = "0" ] && CHECK_ICON="✅" || CHECK_ICON="❌"
          [ "$CLIPPY_EXIT" = "0" ] && CLIPPY_ICON="✅" || CLIPPY_ICON="❌"

          if [ "$BUILD_STATUS" = "OK" ] && [ "$CHECK_EXIT" = "0" ] && [ "$CLIPPY_EXIT" = "0" ]; then
            GLOBAL_STATUS="✅ OK"
          else
            GLOBAL_STATUS="❌ FAIL"
          fi

          CHECK_ERRORS=$(grep -E "^error\[|^error:" /tmp/cargo-check.txt 2>/dev/null | head -30 || true)
          [ -z "$CHECK_ERRORS" ] && CHECK_ERRORS="(aucune)"

          CLIPPY_WARNS=$(grep -E "^warning\[|^warning:" /tmp/cargo-clippy.txt 2>/dev/null | head -40 || true)
          [ -z "$CLIPPY_WARNS" ] && CLIPPY_WARNS="(aucun)"

          BUILD_ERRORS=$(grep -E "^error\[|^error:" /tmp/cargo-build.txt 2>/dev/null | head -30 || true)
          [ -z "$BUILD_ERRORS" ] && BUILD_ERRORS="(aucune)"

          REPORT=".hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md"

          cat > "$REPORT" << 'ENDOFMD'
# 🏗️ Backend Build Report — ${ARCH} — Nook

> Généré automatiquement par `Backend.yml` · target `${{ matrix.target }}`
> **${RUN_DATE}**

---

## Statut global : ${GLOBAL_STATUS}

| Champ | Valeur |
|-------|--------|
| **Architecture** | `${ARCH}` (`${{ matrix.target }}`) |
| **Branche** | `${BRANCH}` |
| **Commit** | [`${COMMIT_SHORT}`](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}) |
| **Rust** | `${RUSTC_VER}` |
| **Run CI** | [Voir le run complet](${RUN_URL}) |

---

## Étapes

| Étape | Statut | Détail |
|-------|--------|--------|
| **cargo check** | ${CHECK_ICON} | exit ${CHECK_EXIT:-?} |
| **cargo clippy** | ${CLIPPY_ICON} | exit ${CLIPPY_EXIT:-?} |
| **cargo build --release** | ${BUILD_ICON} | binaire ${BIN_SIZE:-N/A} |

---

## Erreurs

```
${CHECK_ERRORS}
```

---

## Warnings clippy

```
${CLIPPY_WARNS}
```

---

## Build output

```
${BUILD_ERRORS}
```

---

*Rapport généré par `.github/workflows/Backend.yml` · job `${{ matrix.target }}`*
ENDOFMD

          echo "✅ ${REPORT} généré"

      - name: Commit BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hermes/reports/BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
          if git diff --staged --quiet; then
            echo "Aucune modification — pas de commit"
          else
            git commit -m "ci: BACKEND-BUILD-REPORT-${{ matrix.arch }}.md [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-*
          retention-days: 7
