name: 1 ==> Backend Build & Artifact
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend.yml'
  workflow_run:
    workflows: ["2 ==> Frontend Build & Artifact"]
    types: [completed]
    branches: [develop, main]

jobs:
  backend:
    name: Backend (${{ matrix.arch }})
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # ARM64 disabled temporarily
          # - arch: arm64
          #   target: aarch64-unknown-linux-musl
          #   runner: ubuntu-latest-arm64
    
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ./backend
    
    env:
      RUSTFLAGS: "-C linker=musl-gcc -C target-feature=+crt-static --cap-lints allow"
      SQLX_OFFLINE: true
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      
      - name: cargo zigbuild check
        id: check
        run: |
          set +e
          cargo zigbuild check --target ${{ matrix.target }} --all-targets 2>&1 | tee /tmp/cargo-check.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "check_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e
          exit $EXIT_CODE
      
      - name: cargo zigbuild clippy
        id: clippy
        run: |
          set +e
          cargo zigbuild clippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "clippy_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e
          exit $EXIT_CODE
      
      - name: cargo zigbuild test (native)
        id: test
        run: |
          set +e
          cargo zigbuild test 2>&1 | tee /tmp/cargo-test.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "test_exit=$EXIT_CODE" >> $GITHUB_OUTPUT
          set -e
          exit $EXIT_CODE
      
      - name: cargo zigbuild build --release
        id: build
        env:
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          set +e
          cargo zigbuild build --target ${{ matrix.target }} --release 2>&1 | tee /tmp/cargo-build.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "Size: $BIN_SIZE"
            ls -lh $BINARY
            file $BINARY
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi
          
          exit $EXIT_CODE
      
      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "artifacts/nook-backend-${{ matrix.arch }} ready"
          file artifacts/nook-backend-${{ matrix.arch }}
      
      - name: Generate BACKEND-BUILD-REPORT
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARCH: ${{ matrix.arch }}
          COMMIT_SHA: "${{ github.sha }}"
          BRANCH: "${{ github.ref_name }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_STATUS: "${{ steps.build.outputs.build_status }}"
          BIN_SIZE: "${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT: "${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT: "${{ steps.clippy.outputs.clippy_exit }}"
          TEST_EXIT: "${{ steps.test.outputs.test_exit }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: bash .github/scripts/generate-backend-report.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
