name: 1 ==> Backend Build & Artifact

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/Backend.yml'

jobs:
  backend:
    name: 1 ==> Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-arm64

    env:
      RUSTFLAGS: "-C linker=zig cc -C target-feature=+crt-static --cap-lints allow"
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install zig
        run: |
          sudo apt-get update
          sudo apt-get install -y zig
          zig version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}-${{ matrix.arch }}

      - name: cargo check
        id: check
        working-directory: ./backend
        run: |
          set +e
          cargo check --target ${{ matrix.target }} --all-targets 2>&1 | tee /tmp/cargo-check.txt
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        working-directory: ./backend
        run: |
          set +e
          cargo clippy --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-clippy.txt
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo build --release
        id: build
        working-directory: ./backend
        run: |
          set +e
          cargo build --release --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "📏 Taille : $BIN_SIZE"
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Preparer le binaire
        working-directory: ./backend
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "✅ artifacts/nook-backend-${{ matrix.arch }} prêt"

      - name: Generate BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH="${{ matrix.arch }}"
          echo "Report generated for $ARCH" > .hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md
          echo "Build status: ${{ steps.build.outputs.build_status }}" >> .hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md

      - name: Commit BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .hermes/reports/BACKEND-BUILD-REPORT-${{ matrix.arch }}.md
          git commit -m "ci: BACKEND-BUILD-REPORT-${{ matrix.arch }}.md [run ${{ github.run_id }}]" || echo "No changes"
          git pull --rebase --autostash origin ${{ github.ref_name }} || echo "Pull failed"
          git push --force-with-lease origin HEAD:${{ github.ref_name }} || echo "Push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
