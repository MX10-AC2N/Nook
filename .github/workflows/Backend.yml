name: 1 ==> Backend Build and Artifact

on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./backend

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config musl-tools xz-utils
          
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            echo "Installing zig for aarch64 cross-compile..."
            curl -sSfL "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz" | sudo tar -xJ -C /usr/local --strip-components=1
            echo "Zig installed at: $(which zig)"
            zig version
            
            echo "Creating zig CC wrapper for aarch64 musl..."
            cat > /usr/local/bin/aarch64-linux-musl-gcc << 'EOF'
            #!/bin/sh
            zig cc -target aarch64-linux-musl "$@"
            EOF
            chmod +x /usr/local/bin/aarch64-linux-musl-gcc
            echo "Wrapper created at /usr/local/bin/aarch64-linux-musl-gcc"
            cat /usr/local/bin/aarch64-linux-musl-gcc
          fi
          
          rustup target add ${{ matrix.target }}

      - name: Set linker env vars
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            echo "Using musl-gcc for x86_64"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> $GITHUB_ENV
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
            echo "CFLAGS_x86_64_unknown_linux_musl=" >> $GITHUB_ENV
          fi
          
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            echo "Using zig CC wrapper for aarch64"
            ls -la /usr/local/bin/aarch64-linux-musl-gcc || echo "WRAPPER NOT FOUND"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/usr/local/bin/aarch64-linux-musl-gcc" >> $GITHUB_ENV
            echo "CC_aarch64_unknown_linux_musl=/usr/local/bin/aarch64-linux-musl-gcc" >> $GITHUB_ENV
            echo "CFLAGS_aarch64_unknown_linux_musl=" >> $GITHUB_ENV
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: cargo check
        id: check
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo check --all-targets --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-check.txt
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo clippy --target ${{ matrix.target }} -- -D warnings 2>&1 | tee /tmp/cargo-clippy.txt
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo build --release
        id: build
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          set +e
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "Size: $BIN_SIZE"
            ls -lh $BINARY
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi

          exit $BUILD_EXIT

      - name: Prepare binary (suffix amd64/arm64)
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${ARCH}
          echo "artifacts/nook-backend-${ARCH} pret"

      - name: Generate BACKEND-BUILD-REPORT
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARCH: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'amd64' || 'arm64' }}
          COMMIT_SHA: "${{ github.sha }}"
          BRANCH: "${{ github.ref_name }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_STATUS: "${{ steps.build.outputs.build_status }}"
          BIN_SIZE: "${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT: "${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT: "${{ steps.clippy.outputs.clippy_exit }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: bash .github/scripts/generate-backend-report.sh

      - name: Commit BACKEND-BUILD-REPORT
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/BACKEND-BUILD-REPORT-${ARCH}.md
          if git diff --staged --quiet; then
            echo "No change - no commit"
          else
            git commit -m "ci: BACKEND-BUILD-REPORT-${ARCH}.md [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "Report committed"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
