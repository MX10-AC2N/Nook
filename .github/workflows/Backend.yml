name: "1 ==> 🏗️ Backend Build & Artifact"
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths: ['backend/**', '.cargo/**']

jobs:
  backend:
    name: "🏗️ Backend (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            linker: musl-gcc
            install: "sudo apt-get install -y musl-tools"
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            install: "sudo apt-get install -y gcc-aarch64-linux-gnu"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          ${{ matrix.install }}

      - name: Configure cargo linker
        run: |
          mkdir -p ${{ github.workspace }}/.cargo
          cat > ${{ github.workspace }}/.cargo/config.toml << 'EOFCFG'
          [target.x86_64-unknown-linux-musl]
          linker = "musl-gcc"
          
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOFCFG
          cat ${{ github.workspace }}/.cargo/config.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.rust_target }}

      - name: cargo check
        id: check
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo check --all-targets --target ${{ matrix.rust_target }} 2>&1 | tee /tmp/cargo-check.txt
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo clippy --target ${{ matrix.rust_target }} -- -D warnings 2>&1 | tee /tmp/cargo-clippy.txt
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo build --release
        id: build
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          set +e
          cargo build --release --locked --target ${{ matrix.rust_target }} 2>&1 | tee /tmp/cargo-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $BUILD_EXIT -eq 0 ]; then
            BINARY="target/${{ matrix.rust_target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "📏 Taille : $BIN_SIZE"
            ls -lh $BINARY
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $BUILD_EXIT

      - name: Prepare binary (suffix amd64/arm64)
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.rust_target }}/release/nook-backend artifacts/nook-backend-${{ matrix.arch }}
          echo "✅ artifacts/nook-backend-${{ matrix.arch }} prêt"
          ls -la artifacts/

      - name: Generate BACKEND-BUILD-REPORT-{arch}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH="${{ matrix.arch }}"
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUSTC_VER=$(rustc --version 2>/dev/null || echo "?")
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          BIN_SIZE="${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT="${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT="${{ steps.clippy.outputs.clippy_exit }}"
          
          [ "$BUILD_STATUS" = "OK" ] && BUILD_ICON="✅" || BUILD_ICON="❌"
          [ "$CHECK_EXIT"  = "0" ] && CHECK_ICON="✅"  || CHECK_ICON="❌"
          [ "$CLIPPY_EXIT" = "0" ] && CLIPPY_ICON="✅" || CLIPPY_ICON="❌"
          
          if [ "$BUILD_STATUS" = "OK" ] && [ "$CHECK_EXIT" = "0" ] && [ "$CLIPPY_EXIT" = "0" ]; then
            GLOBAL_STATUS="✅ OK"
          else
            GLOBAL_STATUS="❌ FAIL"
          fi
          
          CHECK_ERRORS=$(grep -E "^error\[|^error:" /tmp/cargo-check.txt 2>/dev/null | head -30 || true)
          [ -z "$CHECK_ERRORS" ] && CHECK_ERRORS="(aucune)"
          
          CLIPPY_WARNS=$(grep -E "^warning\[|^warning:" /tmp/cargo-clippy.txt 2>/dev/null | head -40 || true)
          [ -z "$CLIPPY_WARNS" ] && CLIPPY_WARNS="(aucun)"
          
          BUILD_ERRORS=$(grep -E "^error\[|^error:" /tmp/cargo-build.txt 2>/dev/null | head -30 || true)
          [ -z "$BUILD_ERRORS" ] && BUILD_ERRORS="(aucune)"
          
          REPORT=".hermes/reports/BACKEND-BUILD-REPORT-${ARCH}.md"
          mkdir -p .hermes/reports
          
          cat > "$REPORT" << ENDMD
# 🏗️ Backend Build Report — ${ARCH} — Nook

> Généré automatiquement par \`Backend.yml\` · target \`${{ matrix.rust_target }}\`
> **${RUN_DATE}**

---

## Statut global : ${GLOBAL_STATUS}

| Champ | Valeur |
|-------|--------|
| **Architecture** | \`${{ matrix.arch }}\` (\`${{ matrix.rust_target }}\`) |
| **Branche** | \`${BRANCH}\` |
| **Commit** | [\`${COMMIT_SHORT}\`](${RUN_URL}) |
| **Rust** | \`${RUSTC_VER}\` |
| **Run CI** | [Voir le run complet](${RUN_URL}) |

---

## Étapes

| Étape | Statut | Détail |
|-------|--------|--------|
| **cargo check** | ${CHECK_ICON} | exit ${CHECK_EXIT} |
| **cargo clippy** | ${CLIPPY_ICON} | exit ${CLIPPY_EXIT} (-D warnings) |
| **cargo build --release** | ${BUILD_ICON} | binaire ${BIN_SIZE} stripped |

---

## Erreurs cargo check

\`\`\`
${CHECK_ERRORS}
\`\`\`

---

## Warnings clippy

\`\`\`
${CLIPPY_WARNS}
\`\`\`

---

## Erreurs cargo build

\`\`\`
${BUILD_ERRORS}
\`\`\`

---

*Rapport généré par \`.github/workflows/Backend.yml\` · job \`${{ matrix.rust_target }}\`*
ENDMD
          
          git add "$REPORT"
          echo "✅ $REPORT généré"

      - name: Commit BACKEND-BUILD-REPORT-{arch}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --staged --quiet && echo "Aucune modification" || {
            git commit -m "ci: BACKEND-BUILD-REPORT-${{ matrix.arch }}.md [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.arch }}
          path: backend/artifacts/nook-backend-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
