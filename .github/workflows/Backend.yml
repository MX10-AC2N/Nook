name: 1 ==> Backend Build and Artifact

on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./backend

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config musl-tools xz-utils
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: cargo check
        id: check
        env:
          SQLX_OFFLINE: true
        run: |
          cargo check --all-targets --target ${{ matrix.target }}

      - name: cargo clippy
        id: clippy
        env:
          SQLX_OFFLINE: true
        run: |
          cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: cargo build --release
        id: build
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
          CC_x86_64_unknown_linux_musl=musl-gcc \
          cargo build --release --locked --target ${{ matrix.target }}

          BINARY="target/${{ matrix.target }}/release/nook-backend"
          BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
          echo "build_status=OK" >> $GITHUB_OUTPUT
          echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
          echo "Size: $BIN_SIZE"
          ls -lh $BINARY

      - name: Prepare binary
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-amd64
          echo "artifacts/nook-backend-amd64 pret"

      - name: Generate BACKEND-BUILD-REPORT
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARCH: amd64
          COMMIT_SHA: "${{ github.sha }}"
          BRANCH: "${{ github.ref_name }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_STATUS: "${{ steps.build.outputs.build_status }}"
          BIN_SIZE: "${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT: "${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT: "${{ steps.clippy.outputs.clippy_exit }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: bash .github/scripts/generate-backend-report.sh

      - name: Commit BACKEND-BUILD-REPORT
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/BACKEND-BUILD-REPORT-amd64.md
          if git diff --staged --quiet; then
            echo "No change - no commit"
          else
            git commit -m "ci: BACKEND-BUILD-REPORT-amd64.md [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "Report committed"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-x86_64-unknown-linux-musl
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
