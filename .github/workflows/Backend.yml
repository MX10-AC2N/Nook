name: 1==>🏗️ Backend Build & Artifact

on:
  workflow_dispatch:

jobs:
  backend:
    name: 🏗️ Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./backend

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@nightly  # edition 2024 requires Rust >= 1.85
        with:
          components: rustfmt, clippy

      - name: Install cross-compilation tools (zig for musl)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config xz-utils
          # Zig fournit un linker universel musl pour toutes les cibles
          # Remplace gcc-aarch64-linux-gnu (glibc) pour le cross-compilation musl
          curl -sSfL "https://ziglang.org/download/0.13.0/zig-linux-$(uname -m)-0.13.0.tar.xz" \
            | sudo tar -xJ -C /usr/local --strip-components=1
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Set musl linker flags
        id: linker
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            echo "flags=-C linker=/usr/local/bin/zig cc -C link-args=-target aarch64-linux-musl" >> $GITHUB_OUTPUT
          else
            echo "flags=" >> $GITHUB_OUTPUT
          fi

      - name: cargo check
        id: check
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo check --all-targets --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-check.txt
          echo "check_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo clippy
        id: clippy
        env:
          SQLX_OFFLINE: true
        run: |
          set +e
          cargo clippy --target ${{ matrix.target }} -- -D warnings 2>&1 | tee /tmp/cargo-clippy.txt
          echo "clippy_exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e

      - name: cargo build --release
        id: build
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          RUSTFLAGS: "-C target-feature=+crt-static ${{ steps.linker.outputs.flags }}"
        run: |
          set +e
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee /tmp/cargo-build.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_EXIT -eq 0 ]; then
            BINARY="target/${{ matrix.target }}/release/nook-backend"
            BIN_SIZE=$(ls -lh $BINARY | awk '{print $5}')
            echo "build_status=OK" >> $GITHUB_OUTPUT
            echo "bin_size=$BIN_SIZE" >> $GITHUB_OUTPUT
            echo "📏 Taille : $BIN_SIZE"
            ls -lh $BINARY
          else
            echo "build_status=FAIL" >> $GITHUB_OUTPUT
          fi

          exit $BUILD_EXIT

      - name: Préparer le binaire (suffixe amd64/arm64)
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${ARCH}
          echo "✅ artifacts/nook-backend-${ARCH} prêt"

      # ── Génération BACKEND-BUILD-REPORT-{arch}.md ─────────────────────
      # Un fichier PAR architecture → zéro race condition entre les deux jobs matrix.
      # Claude lit BACKEND-BUILD-REPORT-amd64.md ET BACKEND-BUILD-REPORT-arm64.md
      # séparément. Chaque fichier est auto-suffisant et complet pour son architecture.
      - name: Générer BACKEND-BUILD-REPORT-{arch}.md
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ARCH: ${{ matrix.target == 'x86_64-unknown-linux-musl' && 'amd64' || 'arm64' }}
          RUN_DATE: "${{ env.run_date }}"
          COMMIT_SHA: "${{ github.sha }}"
          BRANCH: "${{ github.ref_name }}"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUSTC_VER: "${{ env.rustc_ver }}"
          BUILD_STATUS: "${{ steps.build.outputs.build_status }}"
          BIN_SIZE: "${{ steps.build.outputs.bin_size }}"
          CHECK_EXIT: "${{ steps.check.outputs.check_exit }}"
          CLIPPY_EXIT: "${{ steps.clippy.outputs.clippy_exit }}"
          BUILD_DURATION: "${{ steps.build.outputs.build_duration }}"
          WARNINGS_COUNT: "${{ steps.build.outputs.warnings_count }}"
          ERRORS_COUNT: "${{ steps.build.outputs.errors_count }}"
          NEW_WARNINGS: "${{ steps.build.outputs.new_warnings }}"
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: bash .github/scripts/generate-backend-report.sh

      - name: Commit BACKEND-BUILD-REPORT-{arch}.md
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude/BACKEND-BUILD-REPORT-${ARCH}.md
          if git diff --staged --quiet; then
            echo "Aucune modification — pas de commit"
          else
            git commit -m "ci: BACKEND-BUILD-REPORT-${ARCH}.md [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
            echo "✅ Rapport commité"
          fi

      # Nom fixe par architecture → Docker.yml peut les télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7