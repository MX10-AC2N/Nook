name: 1==>🏗️ Backend Build & Artifact

on:
  workflow_dispatch:

jobs:
  backend:
    name: 🏗️ Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: cargo check
        env:
          SQLX_OFFLINE: true
        run: cargo check --all-targets --target ${{ matrix.target }}

      - name: cargo clippy
        env:
          SQLX_OFFLINE: true
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: cargo build --release
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          echo "📏 Taille :"
          ls -lh target/${{ matrix.target }}/release/nook-backend

      - name: Préparer le binaire (suffixe amd64/arm64)
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${ARCH}
          echo "✅ artifacts/nook-backend-${ARCH} prêt"

      # Nom fixe par architecture → Docker.yml peut les télécharger simplement
      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 7
