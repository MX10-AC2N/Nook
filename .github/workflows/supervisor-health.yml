name: 🔍 Santé du Superviseur Nook

on:
  schedule:
    - cron: '0 0 * * *'  # Tous les jours à minuit
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Installer dépendances
        run: |
          pip install pyyaml
      
      - name: Valider configuration superviseur
        run: |
          python3 .claude/supervisor/validate_config.py
      
      - name: Générer rapport d'optimisation
        id: report
        run: |
          python3 .claude/supervisor/generate_report.py > report.json
          echo "report=$(cat report.json)" >> $GITHUB_OUTPUT
      
      - name: Créer issue si budget dépassé
        if: steps.report.outputs.daily_spending > 40
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: ⚠️ Budget superviseur Nook proche de la limite
          content-filepath: report.json
          labels: budget,warning