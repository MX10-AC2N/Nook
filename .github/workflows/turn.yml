name: 3 ==> Turn-Server Build and Artifact

on:
  workflow_dispatch:

jobs:
  turn-build:
    name: Turn-Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Build turn-server
        run: |
          rustup target add ${{ matrix.target }}
          git clone --depth 1 https://github.com/mycrl/turn-rs.git /tmp/turn-rs
          cd /tmp/turn-rs
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release --target ${{ matrix.target }}
          else
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/turn-server artifacts/turn-server-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: nook-turn-server-${{ matrix.arch }}
          path: /tmp/turn-rs/artifacts/
          if-no-files-found: error
          retention-days: 7
