name: 3 ==> Turn-Server Build and Artifact

on:
  workflow_dispatch:

jobs:
  turn-build:
    name: Turn-Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/build-push-action@v6
        with:
          context: services/turn-rs
          file: services/turn-rs/Dockerfile
          target: builder
          outputs: type=local,dest=./turn-output-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload turn-server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nook-turn-server-${{ matrix.arch }}
          path: turn-output-amd64/usr/local/bin/turn-server
          if-no-files-found: error
          retention-days: 7
