name: 3 ==> Turn-Server Build and Artifact

on:
  workflow_dispatch:

jobs:
  turn-build:
    name: Turn-Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler
          # On both native runners (x86_64 and arm64), musl-gcc works natively
          # No cross-compilation needed since each runner matches its target arch
          musl-gcc --version

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Build turn-server
        run: |
          rustup target add ${{ matrix.target }}
          git clone --depth 1 https://github.com/mycrl/turn-rs.git /tmp/turn-rs
          cd /tmp/turn-rs
          CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')_LINKER=musl-gcc \
          cargo build --release --target ${{ matrix.target }}
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/turn-server artifacts/turn-server-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: nook-turn-server-${{ matrix.arch }}
          path: /tmp/turn-rs/artifacts/
          if-no-files-found: error
          retention-days: 7
