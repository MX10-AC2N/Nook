name: Turn-Server Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/turn-rs/**'
      - '.github/workflows/turn.yml'

jobs:
  turn-build:
    name: Build Turn-Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev musl-tools

      - name: Install Rust (nightly)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      - name: Build turn-server (release)
        run: cargo build --release --target ${{ matrix.target }} --manifest-path services/turn-rs/Cargo.toml

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/turn-server artifacts/turn-server-${{ matrix.arch }}
          chmod +x artifacts/turn-server-${{ matrix.arch }}
          file artifacts/turn-server-${{ matrix.arch }}
          ls -la artifacts/turn-server-${{ matrix.arch }}

      - name: Upload turn-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-turn-server-${{ matrix.arch }}
          path: artifacts/turn-server-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
