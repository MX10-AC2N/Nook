name: 3 ==> Turn-Server Build and Artifact

on:
  workflow_dispatch:

jobs:
  turn-build:
    name: Turn-Server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build turn-server on Alpine
        uses: docker/build-push-action@v6
        with:
          context: services/turn-rs
          file: services/turn-rs/Dockerfile
          target: builder
          outputs: type=local,dest=./turn-docker-output

      - name: Extract turn-server binary
        run: |
          mkdir -p artifacts
          cp turn-docker-output/usr/local/bin/turn-server artifacts/turn-server-${{ matrix.arch }}
          ls -la artifacts/turn-server-${{ matrix.arch }}

      - name: Upload turn-server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nook-turn-server-${{ matrix.arch }}
          path: artifacts/turn-server-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
