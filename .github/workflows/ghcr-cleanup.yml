name: 5 ==> GHCR Cleanup

on:
  workflow_run:
    workflows: ["4 ==> Docker Build and Push"]
    types: [completed]

  workflow_dispatch:
    inputs:
      keep:
        description: "Number of versions to keep (default: 8)"
        required: false
        default: "8"
      dry_run:
        description: "Dry run - list without deleting"
        type: boolean
        required: false
        default: false

jobs:
  ghcr-cleanup:
    name: GHCR Cleanup
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Set params
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "keep=${{ inputs.keep }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            echo "keep=8" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup GHCR (nook)
        env:
          PACKAGE: nook
          KEEPN: ${{ steps.params.outputs.keep }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          python3 -c "
          import sys, json, subprocess, os

          token = os.environ['GITHUB_TOKEN']
          package = os.environ['PACKAGE']
          keepn = int(os.environ['KEEPN'])
          dry_run = os.environ['DRY_RUN'] == 'true'

          def api(method, path):
              import urllib.request
              url = 'https://api.github.com' + path
              req = urllib.request.Request(
                  url, method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  }
              )
              if method == 'DELETE':
                  try:
                      urllib.request.urlopen(req)
                      return None
                  except Exception as e:
                      return e
              else:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())

          # Fetch all versions (paginate)
          versions = []
          page = 1
          while True:
              resp = api('GET', f'/user/packages/container/{package}/versions?per_page=100&page={page}')
              if not resp:
                  break
              versions.extend(resp)
              page += 1

          versions.sort(key=lambda v: v['created_at'], reverse=True)

          kept = 0
          for v in versions:
              tags = v.get('metadata', {}).get('container', {}).get('tags', [])
              is_latest = 'latest' in tags
              if is_latest or kept < keepn:
                  kept += 1
                  print(f'  KEEP  id={v['id']}  tags={tags}')
              else:
                  if dry_run:
                      print(f'  DRY   id={v['id']}  tags={tags}')
                  else:
                      err = api('DELETE', f'/user/packages/container/{package}/versions/{v['id']}')
                      if err:
                          print(f'  FAIL  id={v['id']}  {err}')
                      else:
                          print(f'  DEL   id={v['id']}  tags={tags}')

          print(f'Done: {len(versions)} versions, kept {kept}')
          "

      - name: Cleanup GHCR (turn-server)
        env:
          PACKAGE: turn-server
          KEEPN: ${{ steps.params.outputs.keep }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          python3 -c "
          import sys, json, subprocess, os

          token = os.environ['GITHUB_TOKEN']
          package = os.environ['PACKAGE']
          keepn = int(os.environ['KEEPN'])
          dry_run = os.environ['DRY_RUN'] == 'true'

          def api(method, path):
              import urllib.request
              url = 'https://api.github.com' + path
              req = urllib.request.Request(
                  url, method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  }
              )
              if method == 'DELETE':
                  try:
                      urllib.request.urlopen(req)
                      return None
                  except Exception as e:
                      return e
              else:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read().decode())

          versions = []
          page = 1
          while True:
              resp = api('GET', f'/user/packages/container/{package}/versions?per_page=100&page={page}')
              if not resp:
                  break
              versions.extend(resp)
              page += 1

          versions.sort(key=lambda v: v['created_at'], reverse=True)

          kept = 0
          for v in versions:
              tags = v.get('metadata', {}).get('container', {}).get('tags', [])
              is_latest = 'latest' in tags
              if is_latest or kept < keepn:
                  kept += 1
                  print(f'  KEEP  id={v['id']}  tags={tags}')
              else:
                  if dry_run:
                      print(f'  DRY   id={v['id']}  tags={tags}')
                  else:
                      err = api('DELETE', f'/user/packages/container/{package}/versions/{v['id']}')
                      if err:
                          print(f'  FAIL  id={v['id']}  {err}')
                      else:
                          print(f'  DEL   id={v['id']}  tags={tags}')

          print(f'Done: {len(versions)} versions, kept {kept}')
          "
