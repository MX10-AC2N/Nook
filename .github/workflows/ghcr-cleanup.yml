name: 5 ==> Cleanup ghcr

on:
  workflow_run:
    workflows: ["4 ==> Docker Build and Push"]
    types: [completed]

  workflow_dispatch:
    inputs:
      keep:
        description: "Number of versions to keep (default: 8)"
        required: false
        default: "8"
      dry_run:
        description: "Dry run — list without deleting"
        type: boolean
        required: false
        default: false

jobs:
  ghcr-cleanup:
    name: GHCR Cleanup
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # ── 1. Parameters ─────────────────────────────────────────────────────
      - name: Set params
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "keep=${{ inputs.keep }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            echo "keep=8" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      # ── 2. List versions ──────────────────────────────────────────────────
      - name: Cleanup GHCR
        env:
          PACKAGE: nook
          KEEPN: ${{ steps.params.outputs.keep }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex

          # Get all versions
          ALL=()
          PAGE=1
          while true; do
            RESP=$(curl -sf               -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${PACKAGE}/versions?per_page=100&page=${PAGE}")
            COUNT=$(echo "$RESP" | python3 -c "import sys,json;print(len(json.load(sys.stdin) or []))")
            [ "$COUNT" = "0" ] && break
            echo "$RESP" | python3 -c "
            import sys, json
            for v in json.load(sys.stdin):
            tags = [v['metadata']['container']['tags']][0] if 'tags' in v.get('metadata',{}).get('container',{}) else []
            print(f\"{v['id']}|{v['created_at']}|{','.join(tags)}\")
            "
            PAGE=$((PAGE + 1))
            sleep 0.5
          done

          TOTAL=$(curl -sI \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/MX10-AC2N/Nook/packages/container/nook/versions?per_page=1" \
            | grep -i 'link:' | grep -oP 'page=\K[0-9]+' | tail -1)
          echo "Total: ${TOTAL:-0}"

          echo "---"
          echo "Total pages: ${TOTAL:-0}"

          # Keep 'latest' and N newest
          ALL_VERSIONS=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PACKAGE}/versions?per_page=100" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
if not data:
    exit(0)
# Sort by created_at descending
data.sort(key=lambda v: v['created_at'], reverse=True)
# Keep the 'latest' tagged version and the N newest
KEEPN = int("${KEEPN}")
kept = 0
for v in data:
    tags = v.get('metadata',{}).get('container',{}).get('tags',[])
    is_latest = 'latest' in tags
    if is_latest or kept < KEEPN:
        kept += 1
        print(f\"KEEP|{v['id']}|{v['created_at']}|{','.join(tags)}\")
    else:
        print(f\"DEL|{v['id']}|{v['created_at']}|{','.join(tags)}\")
")

          echo "$ALL_VERSIONS" | while IFS='|' read -r ACTION VID CREATED TAGS; do
            [ -z "$ACTION" ] && continue
            if [ "$ACTION" = "KEEP" ]; then
              echo "  ✅ KEEP id=$VID created=$CREATED tags=$TAGS"
            elif [ "$DRY_RUN" = "true" ]; then
              echo "  💡 DRY_RUN delete id=$VID created=$CREATED tags=$TAGS"
            else
              if curl -s -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/user/packages/container/${PACKAGE}/versions/${VID}" > /dev/null; then
                echo "  ✅ DELETED id=$VID created=$CREATED tags=$TAGS"
              else
                echo "  ❌ FAILED id=$VID"
              fi
            fi
          done
