name: 5 ==> Cleanup GHCR

on:
  workflow_run:
    workflows: ["4 ==> Docker Build and Push"]
    types: [completed]

  workflow_dispatch:
    inputs:
      keep:
        description: "Number of versions to keep (default: 8)"
        required: false
        default: "8"
      dry_run:
        description: "Dry run - list without deleting"
        type: boolean
        required: false
        default: false

jobs:
  cleanup:
    name: GHCR Cleanup
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set params
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "keep=${{ inputs.keep }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            echo "keep=8" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup GHCR packages
        env:
          KEEPN: ${{ steps.params.outputs.keep }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEPN=${KEEPN:-8}

          for PACKAGE in nook turn-server; do
            echo "=== Cleaning ghcr.io/${{ github.repository_owner }}/$PACKAGE ==="

            # Clean orphan tags (not 'latest' and not versioned from the current release)
            # Fetch all versions
            VERSIONS=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/$PACKAGE/versions?per_page=100") || true

            if [ -z "$VERSIONS" ] || [ "$VERSIONS" = "[]" ]; then
              echo "  No versions found for $PACKAGE"
              continue
            fi

            # Use Python to sort and process
            echo "$VERSIONS" | python3 -c "
import sys, json, os

data = json.load(sys.stdin)
keepn = int(os.environ.get('KEEPN', 8))
dry_run = os.environ.get('DRY_RUN', 'false') == 'true'

# Sort newest first
data.sort(key=lambda v: v['created_at'], reverse=True)

latest_version = None
for v in data:
    tags = v.get('metadata', {}).get('container', {}).get('tags', [])
    if 'latest' in tags:
        latest_version = v['id']
        break

kept = 0
for v in data:
    vid = v['id']
    tags = v.get('metadata', {}).get('container', {}).get('tags', [])
    created = v['created_at']
    is_latest = 'latest' in tags

    # Always keep 'latest'
    if is_latest:
        print(f'  KEEP latest  id={vid} tags={",".join(tags)}')
        continue

    # Keep N newest non-latest versions
    if kept < keepn:
        kept += 1
        print(f'  KEEP ({kept}/{keepn}) id={vid} tags={",".join(tags)}')
        continue

    # Delete the rest
    if dry_run:
        print(f'  DRY_RUN delete id={vid} tags={",".join(tags)}')
    else:
        print(f'id={vid}', flush=True)
"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  Dry run mode - nothing deleted"
              continue
            fi

            # Get IDs to delete (second pass: actual deletion)
            TO_DELETE=$(echo "$VERSIONS" | python3 -c "
import sys, json, os

data = json.load(sys.stdin)
keepn = int(os.environ.get('KEEPN', 8))

data.sort(key=lambda v: v['created_at'], reverse=True)

kept = 0
latest_seen = False
to_delete = []

for v in data:
    tags = v.get('metadata', {}).get('container', {}).get('tags', [])
    is_latest = 'latest' in tags

    if is_latest:
        latest_seen = True
        continue

    if kept < keepn:
        kept += 1
        continue

    to_delete.append(str(v['id']))

print(' '.join(to_delete))
")

            if [ -z "$TO_DELETE" ]; then
              echo "  Nothing to delete for $PACKAGE"
              continue
            fi

            for VID in $TO_DELETE; do
              echo -n "  Deleting version $VID... "
              if curl -sf -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/user/packages/container/$PACKAGE/versions/$VID"; then
                echo "OK"
              else
                echo "FAILED"
              fi
              sleep 1
            done
          done
