name: 🧪 E2E — Test ciblé (debug rapide)

# Lance UN test Playwright par son nom exact ou un grep partiel.
# Évite de relancer toute la suite (10 min) pour debugger un seul test.
# Agent concerné : 🧪 E2E — sessions 15-23 auraient été 3x plus rapides avec ce workflow.

on:
  workflow_dispatch:
    inputs:
      test_grep:
        description: "Nom du test ou regex (ex: 'Login valide', 'Admin', 'chess')"
        required: true
        default: ""
      debug_traces:
        description: "Générer les traces Playwright (screenshots + réseau)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  # ── Build frontend (parallèle) ───────────────────────────────────
  frontend:
    name: "Build Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend-e2e-targeted
          path: frontend/build
          retention-days: 1

  # ── Build backend (parallèle) ────────────────────────────────────
  backend:
    name: "Build Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build release
        env:
          SQLX_OFFLINE: true
        run: cargo build --manifest-path backend/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-e2e-targeted
          path: backend/target/release/nook-backend
          retention-days: 1

  # ── Test ciblé ───────────────────────────────────────────────────
  e2e-targeted:
    name: "🧪 '${{ inputs.test_grep }}'"
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nook-frontend-e2e-targeted
          path: frontend/build

      - uses: actions/download-artifact@v4
        with:
          name: nook-backend-e2e-targeted
          path: /tmp/nook-bin/

      # ── Démarrer le backend ───────────────────────────────────────
      - name: Démarrer backend Nook
        run: |
          chmod +x /tmp/nook-bin/nook-backend
          mkdir -p /tmp/nook-data /tmp/nook-uploads

          /tmp/nook-bin/nook-backend &

          # Healthcheck /api/health (pas /health — distroless pattern)
          echo "Attente backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6300/api/health | grep -q "OK"; then
              echo "✅ Backend prêt (tentative $i)"
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: sqlite:///tmp/nook-data/nook.db
          ALLOWED_ORIGINS: http://localhost:6300
          JWT_SECRET: e2e-targeted-test-secret
          UPLOAD_DIR: /tmp/nook-uploads
          BACKEND_PORT: 3000
          E2E_SETUP: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Installer Playwright ──────────────────────────────────────
      - name: Installer Playwright + Chromium
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install chromium --with-deps

      # ── Lancer le test ciblé ─────────────────────────────────────
      - name: Lancer test "${{ inputs.test_grep }}"
        working-directory: ./frontend
        env:
          CI: "true"
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.debug_traces }}" = "true" ]; then
            EXTRA_ARGS="--trace on"
          fi

          npx playwright test \
            --grep "${{ inputs.test_grep }}" \
            --reporter=list \
            $EXTRA_ARGS \
            2>&1 | tee /tmp/e2e-targeted-output.txt

          # Extraire résultat
          PASSED=$(grep -c "✓\|passed" /tmp/e2e-targeted-output.txt || echo 0)
          FAILED=$(grep -c "✘\|failed\|×" /tmp/e2e-targeted-output.txt || echo 0)
          echo "passed=$PASSED" >> $GITHUB_ENV
          echo "failed=$FAILED" >> $GITHUB_ENV

      # ── Upload traces si demandées ou si échec ────────────────────
      - name: Upload traces
        if: inputs.debug_traces == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-targeted-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 5

      # ── Résumé ────────────────────────────────────────────────────
      - name: Résumé
        if: always()
        run: |
          echo "## 🧪 Test ciblé : \`${{ inputs.test_grep }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Filtre** | \`${{ inputs.test_grep }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Traces** | ${{ inputs.debug_traces }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat /tmp/e2e-targeted-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
