name: 🚀 Fast Build & Push 2 (Manual)
on:
  workflow_dispatch: # Déclenchement manuel uniquement
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/fast-build2.yml'
      - 'Cargo.lock'
env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

  backend:
    name: 🏗️ Backend
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Installer libsodium (requis pour libsodium-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Générer Cargo.lock
        run: |
          if [ ! -f "Cargo.lock" ]; then
            cargo generate-lockfile
          fi

      - name: Vérifier dépendances
        env:
          SQLX_OFFLINE: false
        run: cargo check --all-targets

      - name: Formattage code
        run: cargo fmt --all -- --check

      - name: Analyse statique
        run: cargo clippy -- -D warnings

      - name: Installer sqlx-cli
        run: cargo install sqlx-cli --version 0.8 --features sqlite --no-default-features --locked

      - name: Créer base temporaire et appliquer migrations sqlx
        env:
          DATABASE_URL: sqlite:/tmp/nook.db
        run: |
          echo "Création de la base temporaire..."
          touch /tmp/nook.db
          echo "Application des migrations sqlx officielles..."
          sqlx migrate run

      - name: Générer le cache offline sqlx (décisif !)
        env:
          DATABASE_URL: sqlite:/tmp/nook.db
          SQLX_OFFLINE: false
        run: |
          echo "Génération du cache .sqlx pour toutes les requêtes..."
          cargo sqlx prepare --workspace --check
          if [ $? -ne 0 ]; then
            echo "❌ Erreur lors de cargo sqlx prepare"
            echo "Vérifie que toutes tes requêtes query! / query_as! correspondent exactement aux colonnes de la base après migrations"
            exit 1
          fi

      - name: Commit automatique du dossier .sqlx (si modifié)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .sqlx || echo "Rien à ajouter"
          git commit -m "chore: update sqlx offline cache [ci skip]" || echo "Aucun changement dans .sqlx"
          git push origin HEAD:${{ github.ref }} || echo "Push échoué (normal si pas de changement)"

      - name: Build Release
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --locked

      - name: Vérifier binaire
        run: |
          BIN_PATH="target/release/nook-backend"
          if [ ! -f "$BIN_PATH" ]; then
            echo "❌ Binaire manquant: $BIN_PATH"
            exit 1
          fi
          # Vérifier les permissions
          chmod +x "$BIN_PATH"
          # Vérifier la taille raisonnable
          SIZE=$(stat -c%s "$BIN_PATH")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "⚠️ Binaire très petit ($SIZE octets), vérification nécessaire"
          fi
          echo "✅ Binaire généré: $BIN_PATH ($SIZE octets)"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend/target/release/nook-backend
          retention-days: 1

  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier existence frontend/
        run: |
          if [ ! -d "." ]; then
            echo "❌ Dossier frontend absent"
            exit 1
          fi
          echo "✅ Dossier frontend trouvé"

      - name: Installer npm globalement (si nécessaire)
        run: |
          npm install -g npm@latest || true

      - name: Générer package-lock.json si absent
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "🔄 Génération du package-lock.json..."
            npm install --package-lock-only --no-audit --no-fund
            echo "✅ package-lock.json généré"
          else
            echo "✅ package-lock.json déjà présent"
          fi

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Installer dépendances
        run: |
          if [ "${{ steps.npm-cache.outputs.cache-hit }}" == "true" ]; then
            echo "🔄 Installation des dépendances npm..."
            npm ci --no-audit --no-fund
            echo "✅ Dépendances installées"
          else
            echo "✅ Dépendances récupérées depuis le cache"
          fi

      - name: Vérifier dépendances critiques (SvelteKit)
        run: |
          REQUIRED_DEPS=(
            "svelte"
            "@sveltejs/kit"
            "vite"
            "libsodium-wrappers"
            "uuid"
          )
          MISSING_DEPS=()
          for dep in "${REQUIRED_DEPS[@]}"; do
            if ! npm list "$dep" --depth=0 --silent >/dev/null 2>&1; then
              echo "⚠️ Dépendance manquante: $dep"
              MISSING_DEPS+=("$dep")
            else
              echo "✅ $dep installé"
            fi
          done
          if [ ${#MISSING_DEPS[@]} -gt 0 ]; then
            echo "❌ Dépendances manquantes: ${MISSING_DEPS[*]}"
            exit 1
          fi

      - name: Build
        run: |
          echo "🔄 Build du frontend..."
          npm run build
          echo "✅ Build frontend terminé"

      - name: Vérifier build/ (Structure SvelteKit)
        run: |
          BUILD_DIR="build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "❌ Dossier $BUILD_DIR absent"
            exit 1
          fi
          # Vérifier les fichiers essentiels pour SvelteKit SPA
          REQUIRED_FILES=(
            "index.html"
          )
          MISSING_FILES=()
          echo "📁 Contenu du dossier build:"
          ls -la "$BUILD_DIR/"
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$BUILD_DIR/$file" ]; then
              echo "❌ Fichier manquant: $BUILD_DIR/$file"
              MISSING_FILES+=("$file")
            else
              echo "✅ $file présent"
            fi
          done
          
          # Vérifier que le dossier _app existe (contenu compilé)
          if [ ! -d "$BUILD_DIR/_app" ]; then
            echo "⚠️ Dossier _app absent - le build SvelteKit peut être différent"
          else
            echo "✅ Dossier _app présent"
            echo "📁 Contenu de _app:"
            ls -la "$BUILD_DIR/_app/"
          fi
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ Fichiers manquants dans le build: ${MISSING_FILES[*]}"
            exit 1
          fi
          echo "✅ Dossier $BUILD_DIR OK (Structure SvelteKit)"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend/build
          retention-days: 1

  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend-artifact

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mx10-ac2n/nook:${{ github.sha }}
            ghcr.io/mx10-ac2n/nook:latest
          build-args: |
            BACKEND_PATH=backend-artifact/nook-backend
            FRONTEND_PATH=frontend-artifact
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Cleanup artifacts
        if: always()
        run: |
          rm -rf backend-artifact || true
          rm -rf frontend-artifact || true
