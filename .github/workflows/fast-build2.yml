name: 🚀 Fast Build & Push 2 (Manual)
on:
  workflow_dispatch: # Déclenchement manuel uniquement
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/fast-build2.yml'
      - 'Cargo.lock'
env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

  backend:
    name: 🏗️ Backend
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Installer libsodium (requis pour libsodium-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Générer Cargo.lock
        run: |
          if [ ! -f "Cargo.lock" ]; then
            cargo generate-lockfile
          fi

      - name: Créer base SQLite temporaire pour sqlx online
        run: |
          mkdir -p /tmp/nook-data
          touch /tmp/nook-data/nook.db
          echo "DATABASE_URL=sqlite:///tmp/nook-data/nook.db" >> $GITHUB_ENV

      - name: Appliquer les migrations sqlx (pour avoir le bon schéma)
        env:
          DATABASE_URL: sqlite:///tmp/nook-data/nook.db
        run: |
          cargo install sqlx-cli --version '^0.8' --features sqlite --no-default-features --locked
          sqlx migrate run

      - name: Format code
        run: cargo fmt --all

      - name: Formattage code
        run: cargo fmt --all -- --check

      - name: Vérifier dépendances
        env:
          SQLX_OFFLINE: false
        run: cargo check --all-targets

      - name: Analyse statique
        run: cargo clippy -- -D warnings

      - name: Installer sqlx-cli
        run: cargo install sqlx-cli --version '^0.8' --features sqlite --no-default-features --locked

      - name: Créer base temporaire et appliquer migrations sqlx
        env:
          DATABASE_URL: sqlite:/tmp/nook.db
        run: |
          echo "Création de la base temporaire..."
          touch /tmp/nook.db
          echo "Application des migrations sqlx officielles..."
          sqlx migrate run

      - name: Générer le cache offline sqlx (décisif !)
        env:
          DATABASE_URL: sqlite:/tmp/nook.db
          SQLX_OFFLINE: false
        run: |
          echo "Génération du cache .sqlx pour toutes les requêtes..."
          cargo sqlx prepare --workspace --check
          if [ $? -ne 0 ]; then
            echo "❌ Erreur lors de cargo sqlx prepare"
            echo "Vérifie que toutes tes requêtes query! / query_as! correspondent exactement aux colonnes de la base après migrations"
            exit 1
          fi

      - name: Commit automatique du dossier .sqlx (si modifié)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .sqlx || echo "Rien à ajouter"
          git commit -m "chore: update sqlx offline cache [ci skip]" || echo "Aucun changement dans .sqlx"
          git push origin HEAD:${{ github.ref }} || echo "Push échoué (normal si pas de changement)"

      - name: Build Release
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --locked

      - name: Vérifier binaire
        run: |
          BIN_PATH="target/release/nook-backend"
          if [ ! -f "$BIN_PATH" ]; then
            echo "❌ Binaire manquant: $BIN_PATH"
            exit 1
          fi
          # Vérifier les permissions
          chmod +x "$BIN_PATH"
          # Vérifier la taille raisonnable
          SIZE=$(stat -c%s "$BIN_PATH")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "⚠️ Binaire très petit ($SIZE octets), vérification nécessaire"
          fi
          echo "✅ Binaire généré: $BIN_PATH ($SIZE octets)"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend/target/release/nook-backend
          retention-days: 1

  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier existence frontend/
        run: |
          if [ ! -d "." ]; then
            echo "❌ Dossier frontend absent"
            exit 1
          fi
          echo "✅ Dossier frontend trouvé"

      - name: 🔍 Vérifier état de package.json et package-lock.json
        id: check-package
        run: |
          # Vérifier si package-lock.json existe
          if [ ! -f "package-lock.json" ]; then
            echo "lock_exists=false" >> $GITHUB_OUTPUT
            echo "needs_generation=true" >> $GITHUB_OUTPUT
            echo "⚠️ package-lock.json manquant"
          else
            echo "lock_exists=true" >> $GITHUB_OUTPUT
            
            # Vérifier si package.json a été modifié dans le dernier commit
            cd ..
            if git diff HEAD~1 HEAD --name-only | grep -q "^frontend/package.json$"; then
              echo "needs_generation=true" >> $GITHUB_OUTPUT
              echo "📝 package.json a été modifié, régénération du lock nécessaire"
            else
              echo "needs_generation=false" >> $GITHUB_OUTPUT
              echo "✅ package.json inchangé"
            fi
            cd frontend
          fi

      - name: 🔄 Générer/Mettre à jour package-lock.json
        if: steps.check-package.outputs.needs_generation == 'true'
        run: |
          echo "🔄 Génération du package-lock.json..."
          
          # Supprimer l'ancien lock s'il existe
          rm -f package-lock.json
          
          # Nettoyer le cache npm
          npm cache clean --force 2>/dev/null || true
          
          # Générer un nouveau lock file
          npm install --package-lock-only --no-audit --no-fund
          
          # Vérifier que le fichier a bien été créé
          if [ ! -f "package-lock.json" ]; then
            echo "❌ Échec de génération du package-lock.json"
            exit 1
          fi
          
          echo "✅ package-lock.json généré avec succès"
          ls -lh package-lock.json

      - name: 💾 Commit automatique de package-lock.json
        if: steps.check-package.outputs.needs_generation == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          cd ..
          
          # Ajouter le fichier au staging (nouveau ou modifié)
          git add frontend/package-lock.json
          
          # Vérifier s'il y a des changements dans le staging
          if git diff --staged --quiet; then
            echo "⚠️ Aucun changement à commiter (fichier identique ou inexistant)"
          else
            echo "📝 Nouveau fichier ou modifications détectées"
            
            # Afficher les stats
            echo "📊 Statistiques:"
            git diff --staged --stat frontend/package-lock.json || true
            
            # Commiter
            git commit -m "chore(frontend): auto-update package-lock.json [skip ci]"
            echo "✅ package-lock.json commité"
          fi

      - name: 📤 Pousser les changements
        if: steps.check-package.outputs.needs_generation == 'true'
        run: |
          cd ..
          
          # Vérifier s'il y a des commits à pousser
          COMMITS_TO_PUSH=$(git rev-list @{u}..HEAD 2>/dev/null | wc -l || echo "0")
          
          if [ "$COMMITS_TO_PUSH" -eq 0 ]; then
            echo "⚠️ Aucun commit à pousser"
          else
            echo "📤 Push de $COMMITS_TO_PUSH commit(s)..."
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Changements poussés avec succès"
          fi

      - name: 📥 Installer dépendances
        run: |
          echo "🔄 Installation des dépendances npm..."
          npm ci --no-audit --no-fund
          echo "✅ Dépendances installées"

      - name: Vérifier dépendances critiques (SvelteKit)
        run: |
          REQUIRED_DEPS=(
            "svelte"
            "@sveltejs/kit"
            "vite"
            "libsodium-wrappers"
            "uuid"
          )
          MISSING_DEPS=()
          for dep in "${REQUIRED_DEPS[@]}"; do
            if ! npm list "$dep" --depth=0 --silent >/dev/null 2>&1; then
              echo "⚠️ Dépendance manquante: $dep"
              MISSING_DEPS+=("$dep")
            else
              echo "✅ $dep installé"
            fi
          done
          if [ ${#MISSING_DEPS[@]} -gt 0 ]; then
            echo "❌ Dépendances manquantes: ${MISSING_DEPS[*]}"
            exit 1
          fi

      - name: Build
        run: |
          echo "🔄 Build du frontend..."
          npm run build
          echo "✅ Build frontend terminé"

      - name: Vérifier build/ (Structure SvelteKit)
        run: |
          BUILD_DIR="build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "❌ Dossier $BUILD_DIR absent"
            exit 1
          fi
          REQUIRED_FILES=(
            "index.html"
          )
          MISSING_FILES=()
          echo "📁 Contenu du dossier build:"
          ls -la "$BUILD_DIR/"
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$BUILD_DIR/$file" ]; then
              echo "❌ Fichier manquant: $BUILD_DIR/$file"
              MISSING_FILES+=("$file")
            else
              echo "✅ $file présent"
            fi
          done
          
          if [ ! -d "$BUILD_DIR/_app" ]; then
            echo "⚠️ Dossier _app absent"
          else
            echo "✅ Dossier _app présent"
            ls -la "$BUILD_DIR/_app/"
          fi
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ Fichiers manquants: ${MISSING_FILES[*]}"
            exit 1
          fi
          echo "✅ Dossier $BUILD_DIR OK"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend/build
          retention-days: 1

  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend-artifact

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mx10-ac2n/nook:${{ github.sha }}
            ghcr.io/mx10-ac2n/nook:latest
          build-args: |
            BACKEND_PATH=backend-artifact/nook-backend
            FRONTEND_PATH=frontend-artifact
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Cleanup artifacts
        if: always()
        run: |
          rm -rf backend-artifact || true
          rm -rf frontend-artifact || true