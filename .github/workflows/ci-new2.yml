name: 🚀 Build & Push Docker Multi-Arch (Distroless) + Auto Format

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/ci-new2.yml'
      - 'backend/Cargo.lock'
      - 'backend/Cargo.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/ci-new2.yml'
      - 'backend/Cargo.lock'
      - 'backend/Cargo.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write          # Nécessaire pour commiter et pousser
  packages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────
  # Job dédié au formatage automatique (uniquement sur PR)
  # ────────────────────────────────────────────────
  fmt:
    name: 🛠️ Auto-format Rust code (cargo fmt)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Run cargo fmt
        working-directory: ./backend
        run: cargo fmt --all

      - name: Check for formatting changes
        id: git-check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push formatted code
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "style(backend): apply cargo fmt [skip ci]" || echo "No changes to commit (already clean)"
          
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Pushing to branch: $CURRENT_BRANCH"
          
          git push origin HEAD:$CURRENT_BRANCH
          echo "Code formaté et poussé automatiquement vers $CURRENT_BRANCH"

  # ────────────────────────────────────────────────
  # Backend build & test (multi-arch)
  # ────────────────────────────────────────────────
  backend:
    name: 🏗️ Backend Build & Test (Multi-Arch)
    runs-on: ubuntu-latest
    needs: []  # Pas de dépendance sur fmt

    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config
          
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          
          rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: \( {{ runner.os }}-cargo- \){{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            \( {{ runner.os }}-cargo- \){{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Setup SQLite database for SQLx cache
        run: |
          mkdir -p /tmp/nook-data-${{ matrix.target }}
          touch /tmp/nook-data-${{ matrix.target }}/nook.db
          echo "DATABASE_URL=sqlite:///tmp/nook-data-${{ matrix.target }}/nook.db" >> $GITHUB_ENV

      - name: Install sqlx-cli
        run: |
          cargo install sqlx-cli --version '^0.8' --no-default-features --features sqlite --locked || true

      - name: Configure SQLx offline mode
        run: |
          echo "SQLX_OFFLINE=true" >> $GITHUB_ENV
          echo "✅ SQLx configuré en mode offline"

      - name: Prepare SQLx cache (target-aware)
        env:
          DATABASE_URL: sqlite:///tmp/nook-data-${{ matrix.target }}/nook.db
          SQLX_OFFLINE: false
        run: |
          echo "🔄 Préparation du cache SQLx pour ${{ matrix.target }}..."
          
          if cargo sqlx prepare --bin nook-backend -- --target ${{ matrix.target }} 2>/dev/null; then
            echo "✅ Cache généré avec succès pour ${{ matrix.target }}"
            exit 0
          fi
          
          echo "⚠️ Méthode 1 échouée, tentative méthode 2..."
          
          if cargo build --bin nook-backend --target ${{ matrix.target }} 2>/dev/null && \
             cargo sqlx prepare --bin nook-backend 2>/dev/null; then
            echo "✅ Cache généré via build pour ${{ matrix.target }}"
            exit 0
          fi
          
          echo "⚠️ Méthode 2 échouée, tentative méthode 3..."
          
          if cargo sqlx prepare --bin nook-backend --workspace 2>/dev/null; then
            echo "✅ Cache généré simplement pour ${{ matrix.target }}"
            exit 0
          fi
          
          echo "⚠️ Toutes les méthodes échouées, création manuelle du dossier .sqlx"
          mkdir -p .sqlx
          echo "// Cache SQLx généré manuellement" > .sqlx/queries.json
          echo "✅ Dossier .sqlx créé manuellement"

      - name: Verify SQLx cache
        run: |
          if [ -d ".sqlx" ]; then
            echo "✅ Dossier .sqlx présent"
            ls -la .sqlx/
          else
            echo "⚠️ Dossier .sqlx absent - création forcée"
            mkdir -p .sqlx
            echo "{}" > .sqlx/queries.json
          fi

      - name: Check dependencies
        working-directory: ./backend
        env:
          SQLX_OFFLINE: true
        run: cargo check --all-targets --target ${{ matrix.target }}

      - name: Lint with Clippy
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: Build release for ${{ matrix.target }}
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
          CARGO_PROFILE_RELEASE_STRIP: true
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          
          echo "🔍 Vérification du binaire:"
          file target/${{ matrix.target }}/release/nook-backend
          echo "📏 Taille: \( (ls -lh target/ \){{ matrix.target }}/release/nook-backend | awk '{print $5}')"

      - name: Rename binary with architecture suffix
        run: |
          mkdir -p target/${{ matrix.target }}/release-renamed
          cp target/\( {{ matrix.target }}/release/nook-backend target/ \){{ matrix.target }}/release-renamed/nook-backend-${{ matrix.target }}
          echo "✅ Binaire renommé: nook-backend-${{ matrix.target }}"

      - name: Upload backend artifact with unique filename
        uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/target/\( {{ matrix.target }}/release-renamed/nook-backend- \){{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────
  # Frontend build
  # ────────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check package-lock.json status
        id: check-package-lock
        working-directory: ./frontend
        run: |
          echo "🔍 Vérification du package-lock.json..."
          
          if [ -f "package-lock.json" ]; then
            echo "✅ package-lock.json présent"
            echo "exists=true" >> $GITHUB_OUTPUT
            
            echo "🔍 Vérification de la cohérence avec package.json..."
            npm ci --dry-run --no-audit --no-fund 2>&1 | grep -q "npm ERR!" && CONSISTENT="false" || CONSISTENT="true"
            
            if [ "$CONSISTENT" = "true" ]; then
              echo "✅ package-lock.json cohérent avec package.json"
              echo "consistent=true" >> $GITHUB_OUTPUT
            else
              echo "⚠️ package-lock.json incohérent avec package.json"
              echo "consistent=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ package-lock.json absent"
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "consistent=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate or update package-lock.json
        if: steps.check-package-lock.outputs.exists == 'false' || steps.check-package-lock.outputs.consistent == 'false'
        working-directory: ./frontend
        run: |
          echo "🔄 Génération/mise à jour du package-lock.json..."
          
          if [ -f "package-lock.json" ]; then
            cp package-lock.json package-lock.json.backup
            echo "📋 Backup créé: package-lock.json.backup"
          fi
          
          npm cache clean --force 2>/dev/null || true
          
          rm -rf node_modules 2>/dev/null || true
          rm -f package-lock.json 2>/dev/null || true
          
          echo "📦 Génération du package-lock.json..."
          npm install --package-lock-only --no-audit --no-fund
          
          if [ ! -f "package-lock.json" ]; then
            echo "❌ Échec de génération du package-lock.json"
            exit 1
          fi
          
          echo "✅ package-lock.json généré/mis à jour"
          
          SIZE=$(stat -c%s "package-lock.json" 2>/dev/null || stat -f%z "package-lock.json")
          echo "📏 Taille du package-lock.json: $SIZE octets"

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          echo "📦 Installation des dépendances..."
          
          npm ci --no-audit --no-fund --legacy-peer-deps
          
          echo "✅ Dépendances installées"

      - name: Commit package-lock.json if changed
        if: steps.check-package-lock.outputs.exists == 'false' || steps.check-package-lock.outputs.consistent == 'false'
        run: |
          cd ${{ github.workspace }}
          
          if git status --porcelain frontend/package-lock.json | grep -q "frontend/package-lock.json"; then
            echo "📝 Changements détectés dans package-lock.json"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add frontend/package-lock.json
            git commit -m "chore(frontend): update package-lock.json [skip ci]"
            
            echo "📤 Push des changements..."
            git push origin HEAD:${{ github.ref_name }}
            
            echo "✅ package-lock.json commité et poussé"
          else
            echo "ℹ️ Aucun changement détecté dans package-lock.json"
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: |
          echo "🏗️ Construction du frontend..."
          
          REQUIRED_DEPS=("svelte" "@sveltejs/kit" "vite")
          for dep in "${REQUIRED_DEPS[@]}"; do
            if npm list "$dep" --depth=0 --silent >/dev/null 2>&1; then
              echo "✅ $dep installé"
            else
              echo "❌ $dep manquant"
              exit 1
            fi
          done
          
          npm run build
          
          if [ ! -f "build/index.html" ]; then
            echo "❌ index.html manquant dans le build"
            exit 1
          fi
          
          echo "✅ Frontend construit avec succès"
          echo "📁 Contenu du dossier build:"
          ls -la build/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────
  # Docker build & push multi-arch
  # ────────────────────────────────────────────────
  docker:
    name: 🐳 Docker Build & Push Multi-Arch (Distroless)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          path: backend-artifacts
          pattern: nook-backend-*
          merge-multiple: true

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend-artifact

      - name: Debug artifact structure
        run: |
          echo "🔍 Débogage de la structure des artifacts..."
          echo "=== Structure backend-artifacts ==="
          ls -laR backend-artifacts/
          echo "=== Fichiers backend trouvés ==="
          find backend-artifacts -type f -name "nook-backend*" -exec ls -la {} \;
          echo "=== Structure frontend-artifact ==="
          ls -laR frontend-artifact/

      - name: Prepare Docker build context
        run: |
          echo "🏗️ Préparation du contexte Docker..."
          
          mkdir -p docker-context/backend
          mkdir -p docker-context/frontend
          
          echo "✅ Recherche et copie des binaires backend..."
          
          BACKEND_FILES=$(find backend-artifacts -type f -name "nook-backend*")
          echo "📁 Fichiers backend trouvés:"
          echo "$BACKEND_FILES"
          
          FOUND_AMD64=false
          FOUND_ARM64=false
          
          for file in $BACKEND_FILES; do
            if [ -f "$file" ]; then
              echo "📄 Traitement: $file"
              
              if echo "$file" | grep -qi "x86_64\|amd64"; then
                cp "$file" docker-context/backend/nook-backend-amd64
                chmod +x docker-context/backend/nook-backend-amd64
                FOUND_AMD64=true
                echo "✅ AMD64: $file -> docker-context/backend/nook-backend-amd64"
              elif echo "$file" | grep -qi "aarch64\|arm64"; then
                cp "$file" docker-context/backend/nook-backend-arm64
                chmod +x docker-context/backend/nook-backend-arm64
                FOUND_ARM64=true
                echo "✅ ARM64: $file -> docker-context/backend/nook-backend-arm64"
              else
                echo "⚠️ Architecture non reconnue pour: $file"
              fi
            fi
          done
          
          if [ "$FOUND_AMD64" = false ]; then
            echo "❌ Aucun binaire AMD64 trouvé"
            exit 1
          fi
          
          if [ "$FOUND_ARM64" = false ]; then
            echo "❌ Aucun binaire ARM64 trouvé"
            exit 1
          fi
          
          echo "✅ Binaires backend trouvés et copiés avec succès"
          
          echo "📁 Copie du frontend..."
          if [ -d "frontend-artifact/build" ]; then
            cp -r frontend-artifact/build/* docker-context/frontend/
            echo "✅ Frontend copié depuis frontend-artifact/build/"
          elif [ -d "frontend-artifact" ] && [ -f "frontend-artifact/index.html" ]; then
            cp -r frontend-artifact/* docker-context/frontend/
            echo "✅ Frontend copié depuis frontend-artifact/"
          elif [ -f "frontend-artifact/index.html" ]; then
            cp frontend-artifact/* docker-context/frontend/
            echo "✅ Frontend copié directement depuis frontend-artifact/"
          else
            echo "❌ Impossible de trouver le build frontend"
            echo "Contenu de frontend-artifact:"
            ls -laR frontend-artifact/
            exit 1
          fi
          
          echo "📁 Structure finale du contexte Docker:"
          echo "Backend:"
          ls -la docker-context/backend/
          echo "Frontend:"
          ls -la docker-context/frontend/
          
          if [ ! -f "docker-context/backend/nook-backend-amd64" ]; then
            echo "❌ nook-backend-amd64 manquant"
            exit 1
          fi
          
          if [ ! -f "docker-context/backend/nook-backend-arm64" ]; then
            echo "❌ nook-backend-arm64 manquant"
            exit 1
          fi
          
          if [ ! -f "docker-context/frontend/index.html" ]; then
            echo "❌ index.html manquant"
            echo "Contenu du frontend:"
            ls -la docker-context/frontend/
            exit 1
          fi
          
          echo "✅ Contexte Docker prêt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: \( {{ env.REGISTRY }}/ \){{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Distroless image
        uses: docker/build-push-action@v5
        with:
          context: docker-context
          file: ${{ github.workspace }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BACKEND_PATH=backend
            FRONTEND_PATH=frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analyze image size (improved)
        if: success()
        run: |
          TAG="\( {{ env.REGISTRY }}/ \){{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "📊 Analyse de la taille de l'image..."
          
          echo "✅ Build et push réussis !"
          echo "🔗 URL de l'image: https://ghcr.io/\( {{ github.repository }}/ \){{ github.sha }}"
          
          echo "📦 Taille estimée des images:"
          echo "- amd64: ~5-10MB (image distroless)"
          echo "- arm64: ~5-10MB (image distroless)"
          
          echo "💡 Conseil: Utilise 'docker manifest inspect $TAG' localement pour voir les détails complets"
          
          echo ""
          echo "🔍 Informations de déploiement:"
          echo "- Image: $TAG"
          echo "- Architectures: linux/amd64, linux/arm64"
          echo "- Environnement: Production-ready (distroless)"
          echo ""
          echo "✅ Workflow terminé avec succès !"