name: 🚀 Build & Push Docker (Multi-Architecture)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/fast-build2.yml'
      - 'backend/Cargo.lock'
      - 'backend/Cargo.toml'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    name: 🏗️ Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    
    - name: Setup libsodium
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev pkg-config
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Setup SQLite database
      run: |
        mkdir -p /tmp/nook-data
        touch /tmp/nook-data/nook.db
        echo "DATABASE_URL=sqlite:///tmp/nook-data/nook.db" >> $GITHUB_ENV
    
    - name: Apply migrations
      env:
        DATABASE_URL: sqlite:///tmp/nook-data/nook.db
      run: |
        cargo install sqlx-cli --version '^0.8' --features sqlite --no-default-features --locked || true
        if command -v sqlx &> /dev/null; then
          sqlx migrate run || echo "Migrations already applied"
        fi
    
    - name: Format code
      run: cargo fmt --all -- --check
    
    - name: Check dependencies
      env:
        SQLX_OFFLINE: true
      run: cargo check --all-targets
    
    - name: Lint with Clippy
      run: cargo clippy -- -D warnings
    
    - name: Generate SQLx offline data
      env:
        DATABASE_URL: sqlite:///tmp/nook-data/nook.db
        SQLX_OFFLINE: false
      run: |
        cargo sqlx prepare --workspace --check || cargo sqlx prepare --workspace
    
    - name: Commit SQLx cache if changed
      if: success()
      run: |
        cd ${{ github.workspace }}
        if git status --porcelain | grep -q ".sqlx"; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .sqlx
          git commit -m "chore: update sqlx offline cache [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed (likely no changes)"
        fi
    
    - name: Build release
      env:
        SQLX_OFFLINE: true
      run: cargo build --release --locked
    
    - name: Verify binary
      run: |
        BIN_PATH="target/release/nook-backend"
        if [ ! -f "$BIN_PATH" ]; then
          echo "❌ Binary missing: $BIN_PATH"
          exit 1
        fi
        file "$BIN_PATH"
        ls -lh "$BIN_PATH"
        echo "✅ Binary generated"
    
    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: nook-backend
        path: backend/target/release/nook-backend
        retention-days: 1

  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: |
        # Ensure package-lock exists
        if [ ! -f "package-lock.json" ]; then
          echo "Generating package-lock.json..."
          npm install --package-lock-only
        fi
        
        # Clean install
        npm ci --no-audit --no-fund
        
        # Verify critical dependencies
        npm list svelte @sveltejs/kit vite
    
    - name: Build frontend
      run: |
        npm run build
        
        # Verify build output
        if [ ! -f "build/index.html" ]; then
          echo "❌ Build failed: index.html missing"
          exit 1
        fi
        
        echo "✅ Build completed successfully"
    
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: nook-frontend
        path: frontend/build
        retention-days: 1

  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download backend artifact
      uses: actions/download-artifact@v4
      with:
        name: nook-backend
        path: backend-artifact
    
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: nook-frontend
        path: frontend-artifact
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=,suffix=-${{ github.ref_name }}
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BACKEND_PATH=backend-artifact/nook-backend
          FRONTEND_PATH=frontend-artifact
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify Docker image
      if: github.event_name != 'pull_request'
      run: |
        # Pull and test the image
        TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        docker pull $TAG
        
        # Create test directory
        TEST_DIR=$(mktemp -d)
        chmod 777 "$TEST_DIR"
        
        # Run container
        CONTAINER_ID=$(docker run -d \
          --name test-nook \
          -p 3000:3000 \
          -v "$TEST_DIR:/data" \
          $TAG)
        
        # Wait for startup
        sleep 10
        
        # Check if container is running
        if docker ps | grep -q test-nook; then
          echo "✅ Container is running"
          
          # Check logs for errors
          if docker logs $CONTAINER_ID 2>&1 | grep -iE "error|panic|fatal"; then
            echo "❌ Errors found in logs"
            docker logs $CONTAINER_ID
            exit 1
          fi
          
          # Simple HTTP check
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|404\|302"; then
            echo "✅ HTTP server responding"
          else
            echo "⚠️ HTTP check inconclusive"
          fi
        else
          echo "❌ Container failed to start"
          docker logs $CONTAINER_ID
          exit 1
        fi
        
        # Cleanup
        docker stop $CONTAINER_ID
        docker rm $CONTAINER_ID
        rm -rf "$TEST_DIR"