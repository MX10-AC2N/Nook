name: 🚀 Build & Push Docker (Distroless)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/fast-build2.yml'
      - 'backend/Cargo.lock'
      - 'backend/Cargo.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    name: 🏗️ Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
        targets: x86_64-unknown-linux-gnu
    
    - name: Setup libsodium
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev pkg-config
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Setup SQLite database
      run: |
        mkdir -p /tmp/nook-data
        touch /tmp/nook-data/nook.db
        echo "DATABASE_URL=sqlite:///tmp/nook-data/nook.db" >> $GITHUB_ENV
    
    - name: Apply migrations
      env:
        DATABASE_URL: sqlite:///tmp/nook-data/nook.db
      run: |
        cargo install sqlx-cli --version '^0.8' --features sqlite --no-default-features --locked || true
        if command -v sqlx &> /dev/null; then
          sqlx migrate run || echo "Migrations already applied"
        fi
    
    - name: Format code
      run: cargo fmt --all -- --check
    
    - name: Check dependencies
      env:
        SQLX_OFFLINE: true
      run: cargo check --all-targets
    
    - name: Lint with Clippy
      run: cargo clippy -- -D warnings
    
    - name: Generate SQLx offline data
      env:
        DATABASE_URL: sqlite:///tmp/nook-data/nook.db
        SQLX_OFFLINE: false
      run: |
        cargo sqlx prepare --workspace --check || cargo sqlx prepare --workspace
    
    - name: Commit SQLx cache if changed
      if: success()
      run: |
        cd ${{ github.workspace }}
        if git status --porcelain | grep -q ".sqlx"; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .sqlx
          git commit -m "chore: update sqlx offline cache [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed (likely no changes)"
        fi
    
    - name: Build release for distroless
      env:
        SQLX_OFFLINE: true
        CARGO_PROFILE_RELEASE_LTO: true
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
        CARGO_PROFILE_RELEASE_STRIP: true
      run: |
        RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --locked --target x86_64-unknown-linux-gnu
        
        echo "🔍 Vérification du type de binaire:"
        file target/x86_64-unknown-linux-gnu/release/nook-backend
        ldd target/x86_64-unknown-linux-gnu/release/nook-backend 2>&1 | grep -q "not a dynamic executable" && \
          echo "✅ Binaire statique" || echo "⚠️ Binaire dynamique"
        
        strip target/x86_64-unknown-linux-gnu/release/nook-backend 2>/dev/null || true
    
    - name: Verify binary for distroless
      run: |
        BIN_PATH="target/x86_64-unknown-linux-gnu/release/nook-backend"
        if [ ! -f "$BIN_PATH" ]; then
          echo "❌ Binary missing: $BIN_PATH"
          exit 1
        fi
        
        echo "📊 Informations du binaire:"
        file "$BIN_PATH"
        echo "📏 Taille: $(ls -lh "$BIN_PATH" | awk '{print $5}')"
        echo "📦 Détails:"
        readelf -h "$BIN_PATH" | grep -E "(Class|Machine|Type|Entry)"
        
        if ! file "$BIN_PATH" | grep -q "ELF 64-bit"; then
          echo "❌ Le binaire n'est pas un ELF 64-bit"
          exit 1
        fi
        
        echo "✅ Binaire compatible avec distroless"
    
    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: nook-backend
        path: backend/target/x86_64-unknown-linux-gnu/release/nook-backend
        retention-days: 1

  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Check package-lock.json status
      id: check-package-lock
      working-directory: ./frontend
      run: |
        echo "🔍 Vérification du package-lock.json..."
        
        if [ -f "package-lock.json" ]; then
          echo "✅ package-lock.json présent"
          echo "exists=true" >> $GITHUB_OUTPUT
          
          echo "🔍 Vérification de la cohérence avec package.json..."
          npm ci --dry-run --no-audit --no-fund 2>&1 | grep -q "npm ERR!" && CONSISTENT="false" || CONSISTENT="true"
          
          if [ "$CONSISTENT" = "true" ]; then
            echo "✅ package-lock.json cohérent avec package.json"
            echo "consistent=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ package-lock.json incohérent avec package.json"
            echo "consistent=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "⚠️ package-lock.json absent"
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "consistent=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Generate or update package-lock.json
      if: steps.check-package-lock.outputs.exists == 'false' || steps.check-package-lock.outputs.consistent == 'false'
      working-directory: ./frontend
      run: |
        echo "🔄 Génération/mise à jour du package-lock.json..."
        
        if [ -f "package-lock.json" ]; then
          cp package-lock.json package-lock.json.backup
          echo "📋 Backup créé: package-lock.json.backup"
        fi
        
        npm cache clean --force 2>/dev/null || true
        
        rm -rf node_modules 2>/dev/null || true
        rm -f package-lock.json 2>/dev/null || true
        
        echo "📦 Génération du package-lock.json..."
        npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
        
        if [ ! -f "package-lock.json" ]; then
          echo "❌ Échec de génération du package-lock.json"
          exit 1
        fi
        
        echo "✅ package-lock.json généré/mis à jour"
        
        SIZE=$(stat -c%s "package-lock.json" 2>/dev/null || stat -f%z "package-lock.json")
        echo "📏 Taille du package-lock.json: $SIZE octets"
    
    - name: Install dependencies
      working-directory: ./frontend
      run: |
        echo "📦 Installation des dépendances..."
        
        npm ci --no-audit --no-fund --legacy-peer-deps
        
        echo "✅ Dépendances installées"
    
    - name: Commit package-lock.json if changed
      if: steps.check-package-lock.outputs.exists == 'false' || steps.check-package-lock.outputs.consistent == 'false'
      run: |
        cd ${{ github.workspace }}
        
        if git status --porcelain frontend/package-lock.json | grep -q "frontend/package-lock.json"; then
          echo "📝 Changements détectés dans package-lock.json"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add frontend/package-lock.json
          git commit -m "chore(frontend): update package-lock.json [skip ci]"
          
          echo "📤 Push des changements..."
          git push origin HEAD:${{ github.ref_name }}
          
          echo "✅ package-lock.json commité et poussé"
        else
          echo "ℹ️ Aucun changement détecté dans package-lock.json"
        fi
    
    - name: Build frontend
      working-directory: ./frontend
      run: |
        echo "🏗️ Construction du frontend..."
        
        REQUIRED_DEPS=("svelte" "@sveltejs/kit" "vite")
        for dep in "${REQUIRED_DEPS[@]}"; do
          if npm list "$dep" --depth=0 --silent >/dev/null 2>&1; then
            echo "✅ $dep installé"
          else
            echo "❌ $dep manquant"
            exit 1
          fi
        done
        
        npm run build
        
        if [ ! -f "build/index.html" ]; then
          echo "❌ index.html manquant dans le build"
          exit 1
        fi
        
        echo "✅ Frontend construit avec succès"
        echo "📁 Contenu du dossier build:"
        ls -la build/
    
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: nook-frontend
        path: frontend/build
        retention-days: 1

  docker:
    name: 🐳 Docker Build & Push (Distroless)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download backend artifact
      uses: actions/download-artifact@v4
      with:
        name: nook-backend
        path: backend-artifact
    
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: nook-frontend
        path: frontend-artifact
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Build and push Distroless image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BACKEND_PATH=backend-artifact/nook-backend
          FRONTEND_PATH=frontend-artifact
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Analyze image size
      run: |
        TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "📊 Analyse de la taille de l'image..."
        
        docker pull $TAG
        
        echo "📈 Détails des couches:"
        docker history $TAG --no-trunc --format "{{.Size}}\t{{.CreatedBy}}" | head -20
        
        echo "📦 Taille totale:"
        docker images $TAG --format "{{.Repository}}:{{.Tag}}\t{{.Size}}"
        
        ALPINE_SIZE=$(docker images alpine:latest --format "{{.Size}}" 2>/dev/null || echo "N/A")
        echo "🔍 Comparaison:"
        echo "Alpine base: $ALPINE_SIZE"
        echo "Distroless cc: ~30-40MB"
        echo "Notre image: $(docker images $TAG --format "{{.Size}}")"
    
    - name: Verify Docker image
      run: |
        TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        docker pull $TAG
        
        TEST_DIR=$(mktemp -d)
        chmod 777 "$TEST_DIR"
        
        echo "🧪 Starting container test..."
        
        CONTAINER_ID=$(docker run -d \
          --name test-nook-${{ github.run_id }} \
          -p 3000:3000 \
          -v "$TEST_DIR:/data" \
          -e RUST_LOG=info \
          $TAG)
        
        echo "⏳ Waiting for container to start..."
        sleep 15
        
        if docker ps | grep -q "test-nook-${{ github.run_id }}"; then
          echo "✅ Container is running"
          
          LOGS=$(docker logs $CONTAINER_ID 2>&1)
          if echo "$LOGS" | grep -iE "error|panic|fatal|failed"; then
            echo "❌ Errors found in logs:"
            echo "$LOGS"
            exit 1
          else
            echo "📋 Container logs (first 20 lines):"
            echo "$LOGS" | head -20
          fi
          
          echo "🌐 Testing HTTP endpoint..."
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ HTTP server responding with code: $HTTP_CODE"
              break
            else
              echo "⚠️ Attempt $i: Got HTTP code $HTTP_CODE, retrying..."
              sleep 3
            fi
          done
          
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "404" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "⚠️ HTTP check inconclusive (code: $HTTP_CODE)"
          fi
        else
          echo "❌ Container failed to start or crashed"
          docker logs $CONTAINER_ID
          exit 1
        fi
        
        echo "🧹 Cleaning up..."
        docker stop $CONTAINER_ID 2>/dev/null || true
        docker rm $CONTAINER_ID 2>/dev/null || true
        rm -rf "$TEST_DIR"
        echo "✅ Test completed successfully"