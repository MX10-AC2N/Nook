name: 🚀 CI – Build & Push Docker Multi-Arch (Distroless)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ============================================================
  # 1. Auto-format Rust
  # ============================================================
  fmt:
    name: 🛠️ cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        working-directory: ./backend
        run: cargo fmt --all

      - name: Commit formatting if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "style(backend): apply cargo fmt [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  # ============================================================
  # 2. Backend – compilation croisée x86_64 + aarch64
  # ============================================================
  backend:
    name: 🏗️ Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: fmt
    defaults:
      run:
        working-directory: ./backend

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}

      - name: Configure SQLx offline
        run: echo "SQLX_OFFLINE=true" >> $GITHUB_ENV

      - name: cargo check
        run: cargo check --all-targets --target ${{ matrix.target }}

      - name: cargo clippy
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: cargo build --release
        env:
          SQLX_OFFLINE: true
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          echo "📏 Taille du binaire :"
          ls -lh target/${{ matrix.target }}/release/nook-backend

      - name: Préparer le binaire avec suffixe arch
        run: |
          ARCH=$(echo "${{ matrix.target }}" | grep -q "aarch64" && echo "arm64" || echo "amd64")
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/nook-backend artifacts/nook-backend-${ARCH}
          echo "✅ artifacts/nook-backend-${ARCH}"

      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ matrix.target }}
          path: backend/artifacts/nook-backend-*
          if-no-files-found: error
          retention-days: 2

  # ============================================================
  # 3. Frontend
  # ============================================================
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    needs: fmt
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        working-directory: ./frontend
        run: |
          npm run build
          test -f build/index.html || (echo "❌ build/index.html manquant" && exit 1)
          echo "✅ Frontend OK"
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          if-no-files-found: error
          retention-days: 2

  # ============================================================
  # 4. Docker – assemble les artifacts et pousse sur GHCR
  #    Utilise Dockerfile.release (pas de compilation Rust)
  # ============================================================
  docker:
    name: 🐳 Docker Multi-Arch (Distroless)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          path: docker-context/backend
          pattern: nook-backend-*
          merge-multiple: true

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: docker-context/frontend

      - name: Vérification du contexte
        run: |
          echo "=== Backend ==="
          ls -la docker-context/backend/
          echo "=== Frontend ==="
          ls -la docker-context/frontend/
          test -f docker-context/backend/nook-backend-amd64 || (echo "❌ amd64 manquant" && exit 1)
          test -f docker-context/backend/nook-backend-arm64 || (echo "❌ arm64 manquant" && exit 1)
          test -f docker-context/frontend/index.html        || (echo "❌ index.html manquant" && exit 1)
          chmod +x docker-context/backend/nook-backend-*
          echo "✅ Contexte Docker prêt"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          echo "✅ Image publiée sur GHCR"
          echo "🔗 https://ghcr.io/${{ github.repository }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          echo "📦 Architectures: linux/amd64, linux/arm64"
