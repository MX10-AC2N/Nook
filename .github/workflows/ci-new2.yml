name: 🚀 Build & Push Docker Multi-Arch (Distroless)

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/fast-build2.yml'
      - 'backend/Cargo.lock'
      - 'backend/Cargo.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend:
    name: 🏗️ Backend Build & Test (Multi-Arch)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev pkg-config
        
        # Installer les compilateurs cross pour ARM64
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        fi
        
        # Ajouter les cibles Rust
        rustup target add ${{ matrix.target }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.target }}-
          ${{ runner.os }}-cargo-

    - name: Setup SQLite database for SQLx cache
      run: |
        mkdir -p /tmp/nook-data-${{ matrix.target }}
        touch /tmp/nook-data-${{ matrix.target }}/nook.db
        echo "DATABASE_URL=sqlite:///tmp/nook-data-${{ matrix.target }}/nook.db" >> $GITHUB_ENV

    - name: Apply migrations
      env:
        DATABASE_URL: sqlite:///tmp/nook-data-${{ matrix.target }}/nook.db
      run: |
        cargo install sqlx-cli --version '^0.8' --features sqlite --no-default-features --locked || true
        if command -v sqlx &> /dev/null; then
          sqlx migrate run || echo "Migrations already applied"
        fi

    - name: Generate SQLx cache for ${{ matrix.target }}
      env:
        DATABASE_URL: sqlite:///tmp/nook-data-${{ matrix.target }}/nook.db
        SQLX_OFFLINE: false
      run: |
        echo "🔄 Génération du cache SQLx pour ${{ matrix.target }}..."
        
        # Solution : Générer le cache en utilisant la cible spécifique
        # On force la génération en utilisant cargo check avec la bonne cible
        
        # Créer un fichier temporaire pour la compilation
        TEMP_FILE=$(mktemp /tmp/sqlx-temp-XXXXXX.rs)
        cat > "$TEMP_FILE" << 'EOF'
// Fichier temporaire pour générer le cache SQLx
fn main() {
    println!("SQLx cache generation");
}
EOF
        
        # Compiler avec la cible pour générer le cache
        cargo rustc --target ${{ matrix.target }} --bin nook-backend --features sqlite -- \
          -C link-arg=-Wl,--allow-multiple-definition 2>/dev/null || true
        
        # Maintenant générer le cache SQLx
        cargo sqlx prepare --workspace --target ${{ matrix.target }}
        
        echo "✅ Cache SQLx généré pour ${{ matrix.target }}"
        
        # Vérifier que le cache a été créé
        if [ -d ".sqlx" ]; then
          echo "📁 Cache généré :"
          ls -la .sqlx/
        else
          echo "⚠️ Aucun cache SQLx généré (peut être normal si aucune requête SQL)"
        fi

    - name: Format code
      run: cargo fmt --all -- --check

    - name: Check dependencies
      env:
        SQLX_OFFLINE: true
      run: cargo check --all-targets --target ${{ matrix.target }}

    - name: Lint with Clippy
      run: cargo clippy --target ${{ matrix.target }} -- -D warnings

    - name: Build release for ${{ matrix.target }}
      env:
        SQLX_OFFLINE: true
        CARGO_PROFILE_RELEASE_LTO: true
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
        CARGO_PROFILE_RELEASE_STRIP: true
        RUSTFLAGS: '-C target-feature=+crt-static'
      run: |
        cargo build --release --locked --target ${{ matrix.target }}
        strip target/${{ matrix.target }}/release/nook-backend 2>/dev/null || true
        
        echo "🔍 Vérification du binaire:"
        file target/${{ matrix.target }}/release/nook-backend
        echo "📏 Taille: $(ls -lh target/${{ matrix.target }}/release/nook-backend | awk '{print $5}')"

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: nook-backend-${{ matrix.target }}
        path: backend/target/${{ matrix.target }}/release/nook-backend
        retention-days: 1

  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check package-lock.json status
      id: check-package-lock
      working-directory: ./frontend
      run: |
        echo "🔍 Vérification du package-lock.json..."
        
        if [ -f "package-lock.json" ]; then
          echo "✅ package-lock.json présent"
          echo "exists=true" >> $GITHUB_OUTPUT
          
          echo "🔍 Vérification de la cohérence avec package.json..."
          npm ci --dry-run --no-audit --no-fund 2>&1 | grep -q "npm ERR!" && CONSISTENT="false" || CONSISTENT="true"
          
          if [ "$CONSISTENT" = "true" ]; then
            echo "✅ package-lock.json cohérent avec package.json"
            echo "consistent=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ package-lock.json incohérent avec package.json"
            echo "consistent=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "⚠️ package-lock.json absent"
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "consistent=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate or update package-lock.json
      if: steps.check-package-lock.outputs.exists == 'false' || steps.check-package-lock.outputs.consistent == 'false'
      working-directory: ./frontend
      run: |
        echo "🔄 Génération/mise à jour du package-lock.json..."
        
        if [ -f "package-lock.json" ]; then
          cp package-lock.json package-lock.json.backup
          echo "📋 Backup créé: package-lock.json.backup"
        fi
        
        npm cache clean --force 2>/dev/null || true
        
        rm -rf node_modules 2>/dev/null || true
        rm -f package-lock.json 2>/dev/null || true
        
        echo "📦 Génération du package-lock.json..."
        npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
        
        if [ ! -f "package-lock.json" ]; then
          echo "❌ Échec de génération du package-lock.json"
          exit 1
        fi
        
        echo "✅ package-lock.json généré/mis à jour"
        
        SIZE=$(stat -c%s "package-lock.json" 2>/dev/null || stat -f%z "package-lock.json")
        echo "📏 Taille du package-lock.json: $SIZE octets"

    - name: Install dependencies
      working-directory: ./frontend
      run: |
        echo "📦 Installation des dépendances..."
        
        npm ci --no-audit --no-fund --legacy-peer-deps
        
        echo "✅ Dépendances installées"

    - name: Commit package-lock.json if changed
      if: steps.check-package-lock.outputs.exists == 'false' || steps.check-package-lock.outputs.consistent == 'false'
      run: |
        cd ${{ github.workspace }}
        
        if git status --porcelain frontend/package-lock.json | grep -q "frontend/package-lock.json"; then
          echo "📝 Changements détectés dans package-lock.json"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add frontend/package-lock.json
          git commit -m "chore(frontend): update package-lock.json [skip ci]"
          
          echo "📤 Push des changements..."
          git push origin HEAD:${{ github.ref_name }}
          
          echo "✅ package-lock.json commité et poussé"
        else
          echo "ℹ️ Aucun changement détecté dans package-lock.json"
        fi

    - name: Build frontend
      working-directory: ./frontend
      run: |
        echo "🏗️ Construction du frontend..."
        
        REQUIRED_DEPS=("svelte" "@sveltejs/kit" "vite")
        for dep in "${REQUIRED_DEPS[@]}"; do
          if npm list "$dep" --depth=0 --silent >/dev/null 2>&1; then
            echo "✅ $dep installé"
          else
            echo "❌ $dep manquant"
            exit 1
          fi
        done
        
        npm run build
        
        if [ ! -f "build/index.html" ]; then
          echo "❌ index.html manquant dans le build"
          exit 1
        fi
        
        echo "✅ Frontend construit avec succès"
        echo "📁 Contenu du dossier build:"
        ls -la build/

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: nook-frontend
        path: frontend/build
        retention-days: 1

  docker:
    name: 🐳 Docker Build & Push Multi-Arch (Distroless)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        path: backend-artifacts
        pattern: nook-backend-*
        merge-multiple: true

    - name: Verify downloaded artifacts
      run: |
        echo "🔍 Vérification des artefacts téléchargés:"
        find backend-artifacts -type f -name "nook-backend" | while read file; do
          echo "📄 $file:"
          file "$file" || true
        done
        
        # Créer une structure organisée pour le Dockerfile
        mkdir -p backend-artifacts/renamed
        
        # Copier et renommer les fichiers selon l'architecture
        if [ -f "backend-artifacts/x86_64-unknown-linux-gnu/nook-backend" ]; then
          cp backend-artifacts/x86_64-unknown-linux-gnu/nook-backend backend-artifacts/renamed/nook-backend-x86_64
          cp backend-artifacts/x86_64-unknown-linux-gnu/nook-backend backend-artifacts/renamed/nook-backend-amd64
          echo "✅ Artefact x86_64 préparé"
        fi
        
        if [ -f "backend-artifacts/aarch64-unknown-linux-gnu/nook-backend" ]; then
          cp backend-artifacts/aarch64-unknown-linux-gnu/nook-backend backend-artifacts/renamed/nook-backend-aarch64
          cp backend-artifacts/aarch64-unknown-linux-gnu/nook-backend backend-artifacts/renamed/nook-backend-arm64
          echo "✅ Artefact aarch64 préparé"
        fi
        
        echo "📁 Structure finale des artefacts:"
        ls -la backend-artifacts/renamed/

    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: nook-frontend
        path: frontend-artifact

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push Distroless image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BACKEND_PATH=backend-artifacts/renamed
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Analyze image size
      run: |
        TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "📊 Analyse de la taille de l'image..."
        
        # Tenter de récupérer les images pour chaque architecture
        for platform in linux/amd64 linux/arm64; do
          echo "📦 Téléchargement pour $platform..."
          docker pull --platform $platform $TAG 2>/dev/null || echo "⚠️ Impossible de télécharger pour $platform"
        done
        
        echo "📦 Images disponibles:"
        docker images $TAG --format "{{.Repository}}:{{.Tag}}\t{{.Size}}" 2>/dev/null || echo "ℹ️ Aucune image locale trouvée"