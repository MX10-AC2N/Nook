name: 🚀 Build, Push & Test (Manual)
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/fast-build2.yml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    outputs:
      rust-cache-key: ${{ steps.cargo-cache.outputs.cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate Cargo cache key
        id: cargo-cache
        run: |
          echo "cache-key=${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" >> $GITHUB_OUTPUT

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

  backend:
    name: 🏗️ Backend
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Installer libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Générer Cargo.lock si nécessaire
        run: |
          if [ ! -f "Cargo.lock" ]; then
            cargo generate-lockfile
          fi

      - name: Créer base SQLite temporaire
        run: |
          mkdir -p /tmp/nook-data
          touch /tmp/nook-data/nook.db
          echo "DATABASE_URL=sqlite:///tmp/nook-data/nook.db" >> $GITHUB_ENV

      - name: Installer sqlx-cli et appliquer migrations
        env:
          DATABASE_URL: sqlite:///tmp/nook-data/nook.db
        run: |
          cargo install sqlx-cli --version '^0.8' --features sqlite --no-default-features --locked
          sqlx migrate run

      - name: Auto-format code
        id: fmt-check
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "formatted=false" >> $GITHUB_OUTPUT
          else
            echo "formatted=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit automatique du formatage
        if: steps.fmt-check.outputs.formatted == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: auto-format code with cargo fmt [ci skip]" || echo "Commit skipped"
          git push origin ${{ github.ref }} || echo "Push échoué (pas de droits ou aucun changement)"

      - name: Vérifier formatage
        run: cargo fmt --all -- --check

      - name: Vérifier dépendances
        env:
          SQLX_OFFLINE: false
        run: cargo check --all-targets

      - name: Analyse statique
        run: cargo clippy -- -D warnings

      - name: Mettre à jour base temporaire pour le cache sqlx
        env:
          DATABASE_URL: sqlite:///tmp/nook-data/nook.db
        run: |
          touch /tmp/nook-data/nook.db
          sqlx migrate run

      - name: Vérifier et générer cache sqlx
        env:
          DATABASE_URL: sqlite:///tmp/nook-data/nook.db
          SQLX_OFFLINE: false
        id: sqlx-check
        run: |
          if ! cargo sqlx prepare --workspace --check 2>/dev/null; then
            echo "Génération du cache sqlx..."
            cargo sqlx prepare --workspace
            echo "generated=true" >> $GITHUB_OUTPUT
          else
            echo "generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit automatique du cache sqlx
        if: steps.sqlx-check.outputs.generated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .sqlx
          if git diff --cached --quiet; then
            echo "Aucun changement dans .sqlx"
          else
            git commit -m "chore: update sqlx offline cache [ci skip]"
            echo "Pushing les changements..."
            git push origin ${{ github.ref }} || echo "Push échoué (normal si pas de changement)"
          fi

      - name: Build Release
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --locked

      - name: Vérifier binaire
        run: |
          BIN_PATH="target/release/nook-backend"
          if [ ! -f "$BIN_PATH" ]; then
            echo "❌ Binaire manquant: $BIN_PATH"
            exit 1
          fi
          chmod +x "$BIN_PATH"
          SIZE=$(stat -c%s "$BIN_PATH")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "⚠️ Binaire très petit ($SIZE octets)"
          fi
          echo "✅ Binaire généré: $BIN_PATH ($SIZE octets)"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend/target/release/nook-backend
          retention-days: 1

  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier dossier frontend
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/frontend" ]; then
            echo "❌ Dossier frontend absent"
            exit 1
          fi
          echo "✅ Dossier frontend trouvé"

      - name: Afficher versions
        run: |
          echo "📦 Node: $(node --version)"
          echo "📦 NPM: $(npm --version)"

      - name: Vérifier package-lock.json
        id: check-package
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "lock_exists=false" >> $GITHUB_OUTPUT
            echo "needs_generation=true" >> $GITHUB_OUTPUT
            echo "⚠️ package-lock.json manquant"
          else
            echo "lock_exists=true" >> $GITHUB_OUTPUT
            echo "✅ package-lock.json présent"
          fi

      - name: Générer package-lock.json si nécessaire
        if: steps.check-package.outputs.needs_generation == 'true'
        run: |
          echo "🔄 Génération du package-lock.json..."
          rm -f package-lock.json
          rm -rf node_modules
          npm cache clean --force 2>/dev/null || true
          npm install --package-lock-only --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --no-audit --no-fund --legacy-peer-deps 2>/dev/null || true
          
          if [ ! -f "package-lock.json" ]; then
            echo "❌ Échec de génération"
            exit 1
          fi
          echo "✅ package-lock.json généré"

      - name: Commit automatique package-lock.json
        if: steps.check-package.outputs.needs_generation == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/package-lock.json
          
          if git diff --staged --quiet; then
            echo "⚠️ Aucun changement"
          else
            echo "📝 Changements détectés dans package-lock.json"
            git commit -m "chore(frontend): auto-update package-lock.json [skip ci]"
            
            COMMITS_TO_PUSH=$(git rev-list @{u}..HEAD 2>/dev/null | wc -l || echo "0")
            if [ "$COMMITS_TO_PUSH" -gt 0 ]; then
              echo "📤 Push de $COMMITS_TO_PUSH commit(s)..."
              git push origin HEAD:${{ github.ref_name }}
              echo "✅ Push terminé"
            fi
          fi

      - name: Installer dépendances
        run: |
          echo "🔄 Installation des dépendances..."
          if ! npm ci --no-audit --no-fund 2>/dev/null; then
            echo "⚠️ npm ci a échoué, utilisation de npm install..."
            npm install --no-audit --no-fund
          fi
          echo "✅ Dépendances installées"

      - name: Vérifier dépendances critiques
        run: |
          REQUIRED_DEPS=("svelte" "@sveltejs/kit" "vite" "libsodium-wrappers" "uuid")
          MISSING_DEPS=()
          for dep in "${REQUIRED_DEPS[@]}"; do
            if ! npm list "$dep" --depth=0 --silent >/dev/null 2>&1; then
              echo "⚠️ Manquant: $dep"
              MISSING_DEPS+=("$dep")
            else
              echo "✅ $dep"
            fi
          done
          if [ ${#MISSING_DEPS[@]} -gt 0 ]; then
            echo "❌ Dépendances manquantes: ${MISSING_DEPS[*]}"
            exit 1
          fi

      - name: Build
        run: |
          echo "🔄 Build frontend..."
          npm run build
          echo "✅ Build OK"

      - name: Vérifier build/
        run: |
          BUILD_DIR="build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "❌ $BUILD_DIR absent"
            exit 1
          fi
          
          REQUIRED_FILES=("index.html")
          MISSING_FILES=()
          
          echo "📁 Contenu de $BUILD_DIR:"
          ls -la "$BUILD_DIR/"
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$BUILD_DIR/$file" ]; then
              echo "❌ Manquant: $file"
              MISSING_FILES+=("$file")
            else
              echo "✅ $file"
            fi
          done
          
          if [ ! -d "$BUILD_DIR/app" ]; then
            echo "⚠️ app absent"
          else
            echo "✅ app présent"
          fi
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ Fichiers manquants: ${MISSING_FILES[*]}"
            exit 1
          fi
          echo "✅ Build vérifié"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend/build
          retention-days: 1

  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-backend-${{ github.sha }}
          path: backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-frontend-${{ github.sha }}
          path: frontend-artifact

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mx10-ac2n/nook:${{ github.sha }}
            ghcr.io/mx10-ac2n/nook:latest
          build-args: |
            BACKEND_PATH=backend-artifact/nook-backend
            FRONTEND_PATH=frontend-artifact
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Test de l'image Distroless
        run: |
          echo "🧪 Test de l'image Docker..."
          
          # Pull de l'image qui vient d'être buildée
          docker pull ghcr.io/mx10-ac2n/nook:${{ github.sha }}
          
          # Créer un répertoire temporaire pour les données
          # avec les permissions appropriées (777 pour permettre l'écriture par UID 1000)
          TEST_DIR="/tmp/nook-test-data-${{ github.sha }}"
          mkdir -p "$TEST_DIR"
          chmod 777 "$TEST_DIR"
          echo "📁 Répertoire de test créé: $TEST_DIR"
          
          # Lancer le conteneur en arrière-plan
          CONTAINER_ID=$(docker run -d \
            -p 3000:3000 \
            -v "$TEST_DIR:/app/data" \
            ghcr.io/mx10-ac2n/nook:${{ github.sha }})
          
          echo "📦 Conteneur lancé: $CONTAINER_ID"
          
          # Attendre que le serveur démarre
          echo "⏳ Attente du démarrage du serveur..."
          for i in {1..10}; do
            if docker ps | grep -q "$CONTAINER_ID"; then
              echo "✅ Conteneur actif après ${i}s"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "❌ Conteneur non fonctionnel après 10s"
              echo "📋 Logs du conteneur:"
              docker logs "$CONTAINER_ID"
              docker stop "$CONTAINER_ID" 2>/dev/null || true
              docker rm "$CONTAINER_ID" 2>/dev/null || true
              rm -rf "$TEST_DIR"
              exit 1
            fi
            sleep 1
          done
          
          # Vérification des logs
          echo "📋 Logs du conteneur:"
          docker logs "$CONTAINER_ID"
          
          # Détection des erreurs critiques
          if docker logs "$CONTAINER_ID" 2>&1 | grep -iE "error|panic|fatal|permission denied"; then
            echo "⚠️  Erreurs détectées dans les logs"
            docker stop "$CONTAINER_ID" 2>/dev/null || true
            docker rm "$CONTAINER_ID" 2>/dev/null || true
            rm -rf "$TEST_DIR"
            exit 1
          fi
          
          # Test HTTP basique
          echo "🌐 Test de la réponse HTTP..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Le serveur répond avec le code HTTP $HTTP_CODE"
          else
            echo "⚠️  Code HTTP inattendu: $HTTP_CODE (peut être normal selon la configuration)"
          fi
          
          # Nettoyage
          echo "🧹 Nettoyage des ressources..."
          docker stop "$CONTAINER_ID" 2>/dev/null || true
          docker rm "$CONTAINER_ID" 2>/dev/null || true
          rm -rf "$TEST_DIR"
          
          echo "✅ Tests terminés avec succès"

      - name: Cleanup artifacts
        if: always()
        run: |
          rm -rf backend-artifact frontend-artifact || true