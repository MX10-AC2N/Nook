<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <!-- Dégradé moderne -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    
    <!-- Dégradé pour les éclaboussures -->
    <linearGradient id="splatterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    
    <!-- Filtre d'ombre douce -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <style>
    .letter {
      fill: none;
      stroke: url(#brandGradient);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: 110px;
      transform-origin: center center;
      filter: url(#softShadow);
    }

    @keyframes drawSmooth {
      0% { stroke-dashoffset: 350; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes liquidFill {
      0% { fill: none; }
      50% { fill: url(#brandGradient); fill-opacity: 0; }
      100% { fill: url(#brandGradient); fill-opacity: 1; }
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scaleX(1); }
      50% { opacity: 0.5; transform: scaleX(1.02); }
    }

    @keyframes splatterPop {
      0% { opacity: 0; transform: scale(0) translate(0, 0); }
      60% { opacity: 0.8; transform: scale(1.4) translate(var(--tx), var(--ty)); }
      100% { opacity: 0.4; transform: scale(1) translate(var(--tx), var(--ty)); }
    }

    /* Animations staggerées avec délais progressifs */
    .n1 { 
      stroke-dasharray: 350; 
      stroke-dashoffset: 350; 
      animation: drawSmooth 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards,
                 liquidFill 0.6s ease-out 0.9s forwards,
                 gentleFloat 4s ease-in-out 1.5s infinite;
      --rot: -3deg;
    }
    
    .o1 { 
      stroke-dasharray: 350; 
      stroke-dashoffset: 350; 
      animation: drawSmooth 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.25s forwards,
                 liquidFill 0.6s ease-out 1.05s forwards,
                 gentleFloat 4s ease-in-out 1.7s infinite;
      --rot: 2deg;
    }
    
    .o2 { 
      stroke-dasharray: 350; 
      stroke-dashoffset: 350; 
      animation: drawSmooth 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards,
                 liquidFill 0.6s ease-out 1.2s forwards,
                 gentleFloat 4s ease-in-out 1.9s infinite;
      --rot: -1deg;
    }
    
    .k { 
      stroke-dasharray: 380; 
      stroke-dashoffset: 380; 
      animation: drawSmooth 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.55s forwards,
                 liquidFill 0.6s ease-out 1.35s forwards,
                 gentleFloat 4s ease-in-out 2.1s infinite;
      --rot: 3deg;
    }

    .splatter { 
      fill: url(#splatterGradient); 
      opacity: 0;
    }
    
    .s1 { animation: splatterPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.0s forwards; --tx: -15px; --ty: -10px; }
    .s2 { animation: splatterPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s forwards; --tx: 10px; --ty: 15px; }
    .s3 { animation: splatterPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.4s forwards; --tx: -8px; --ty: -12px; }
    .s4 { animation: splatterPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s forwards; --tx: 12px; --ty: 8px; }

    .underline {
      stroke: url(#brandGradient);
      stroke-width: 4;
      stroke-linecap: round;
      transform-origin: center;
    }
  </style>

  <!-- Titre pour accessibilité -->
  <title>Logo animé NOOK</title>
  <desc>Logo animée de la marque NOOK avec effet de tracé et flottement</desc>

  <!-- Lettres -->
  <text class="letter n1" x="55" y="130">N</text>
  <text class="letter o1" x="135" y="130">O</text>
  <text class="letter o2" x="215" y="130">O</text>
  <text class="letter k" x="295" y="130">K</text>

  <!-- Éclaboussures -->
  <circle class="splatter s1" cx="45" cy="95" r="7"/>
  <circle class="splatter s2" cx="130" cy="150" r="5"/>
  <circle class="splatter s3" cx="225" cy="85" r="8"/>
  <circle class="splatter s4" cx="330" cy="125" r="6"/>

  <!-- Ligne inférieure animée -->
  <line class="underline" x1="50" y1="150" x2="350" y2="150">
    <animate attributeName="stroke-dasharray" from="0,300" to="300,0" dur="1s" begin="2s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="0.6" dur="1s" begin="2s" fill="freeze"/>
  </line>
</svg>
