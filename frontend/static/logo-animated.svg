<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <!-- Couleur encre dégradée -->
    <linearGradient id="inkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Effet grain/papier -->
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    
    <!-- Ombre marqués -->
    <filter id="inkShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="5" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <style>
    .letter {
      fill: none;
      stroke: url(#inkGradient);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      font-family: 'Georgia', serif;
      font-weight: bold;
      font-size: 120px;
      transform-origin: center center;
      filter: url(#inkShadow);
    }

    @keyframes inkDraw {
      0% { 
        stroke-dashoffset: 400; 
        opacity: 0.3;
      }
      50% {
        opacity: 1;
      }
      100% { 
        stroke-dashoffset: 0; 
        opacity: 1;
      }
    }

    @keyframes inkFill {
      from { 
        fill: transparent;
        filter: blur(2px);
      }
      to { 
        fill: url(#inkGradient);
        filter: blur(0);
      }
    }

    @keyframes shakeIn {
      0% { transform: translateX(-5px) rotate(var(--rot)); }
      20% { transform: translateX(5px) rotate(var(--rot)); }
      40% { transform: translateX(-3px) rotate(var(--rot)); }
      60% { transform: translateX(3px) rotate(var(--rot)); }
      80% { transform: translateX(-1px) rotate(var(--rot)); }
      100% { transform: translateX(0) rotate(var(--rot)); }
    }

    @keyframes inkPulse {
      0%, 100% { 
        transform: scale(1);
        filter: url(#inkShadow);
      }
      50% { 
        transform: scale(1.03);
        filter: url(#inkShadow) drop-shadow(0 0 8px rgba(30, 41, 59, 0.5));
      }
    }

    @keyframes splatterInk {
      0% { 
        opacity: 0; 
        transform: scale(0) rotate(0deg);
      }
      40% {
        opacity: 0.9;
        transform: scale(1.5) rotate(180deg);
      }
      70% {
        opacity: 0.7;
        transform: scale(0.8) rotate(270deg);
      }
      100% { 
        opacity: 0.5; 
        transform: scale(1) rotate(360deg);
      }
    }

    .n1 { 
      stroke-dasharray: 400; 
      stroke-dashoffset: 400; 
      animation: inkDraw 0.6s ease-out 0.15s forwards,
                 inkFill 0.4s ease-out 0.75s forwards,
                 shakeIn 0.4s ease-out 0.75s forwards,
                 inkPulse 3s ease-in-out 1.5s infinite;
      --rot: -4deg;
    }
    
    .o1 { 
      stroke-dasharray: 380; 
      stroke-dashoffset: 380; 
      animation: inkDraw 0.6s ease-out 0.3s forwards,
                 inkFill 0.4s ease-out 0.9s forwards,
                 shakeIn 0.4s ease-out 0.9s forwards,
                 inkPulse 3s ease-in-out 1.7s infinite;
      --rot: 2deg;
    }
    
    .o2 { 
      stroke-dasharray: 380; 
      stroke-dashoffset: 380; 
      animation: inkDraw 0.6s ease-out 0.45s forwards,
                 inkFill 0.4s ease-out 1.05s forwards,
                 shakeIn 0.4s ease-out 1.05s forwards,
                 inkPulse 3s ease-in-out 1.9s infinite;
      --rot: -1deg;
    }
    
    .k { 
      stroke-dasharray: 420; 
      stroke-dashoffset: 420; 
      animation: inkDraw 0.6s ease-out 0.6s forwards,
                 inkFill 0.4s ease-out 1.2s forwards,
                 shakeIn 0.4s ease-out 1.2s forwards,
                 inkPulse 3s ease-in-out 2.1s infinite;
      --rot: 4deg;
    }

    .splatter { 
      fill: #1E293B;
    }
    
    .s1 { animation: splatterInk 0.8s cubic-bezier(0.34, 1.8, 0.64, 1) 1.0s forwards; }
    .s2 { animation: splatterInk 0.8s cubic-bezier(0.34, 1.8, 0.64, 1) 1.15s forwards; }
    .s3 { animation: splatterInk 0.8s cubic-bezier(0.34, 1.8, 0.64, 1) 1.3s forwards; }
    .s4 { animation: splatterInk 0.8s cubic-bezier(0.34, 1.8, 0.64, 1) 1.45s forwards; }

    .splatter.random { 
      transform-origin: center;
    }
  </style>

  <title>Logo animé NOOK - Style Encre</title>

  <!-- Formes d'éclaboussures plus variées -->
  <path class="splatter s1 random" d="M45,90 Q50,85 55,90 Q58,95 55,100 Q50,105 45,100 Q42,95 45,90" />
  <path class="splatter s2 random" d="M125,145 Q130,140 135,145 Q140,150 135,155 Q130,160 125,155 Q120,150 125,145" />
  <path class="splatter s3 random" d="M220,80 Q228,72 235,80 Q242,88 235,95 Q228,102 220,95 Q212,88 220,80" />
  <path class="splatter s4 random" d="M325,125 Q332,118 338,125 Q345,132 338,140 Q332,148 325,140 Q318,132 325,125" />

  <!-- Lettres -->
  <text class="letter n1" x="50" y="135">N</text>
  <text class="letter o1" x="130" y="135">O</text>
  <text class="letter o2" x="210" y="135">O</text>
  <text class="letter k" x="290" y="135">K</text>

  <!-- Ligne inférieure renforcée -->
  <line x1="45" y1="155" x2="355" y2="155" stroke="url(#inkGradient)" stroke-width="5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" from="0,320" to="320,0" dur="0.8s" begin="1.8s" fill="freeze"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze"/>
  </line>
</svg>
