<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="currentColor">
  <defs>
    <linearGradient id="birdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5a27">
        <animate attributeName="stop-color" values="#2d5a27;#3d7a37;#2d5a27" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3d7a37">
        <animate attributeName="stop-color" values="#3d7a37;#2d5a27;#3d7a37" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Oiseau principal -->
  <g transform="translate(60, 60)">
    <!-- Corps de l'oiseau -->
    <path d="M-10,0 Q-5,-15 0,0 Q5,15 10,0 L10,5 Q5,10 0,10 Q-5,10 -10,5 Z" fill="url(#birdGradient)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,-3; 0,0"
        dur="3s"
        repeatCount="indefinite"
      />
    </path>
    
    <!-- Aile gauche -->
    <path d="M-8,0 Q-15,-5 -12,5 Q-10,10 -8,8 Z" fill="url(#birdGradient)" opacity="0.8">
      <animate
        attributeName="d"
        values="M-8,0 Q-15,-5 -12,5 Q-10,10 -8,8 Z;
                M-8,0 Q-18,-3 -12,5 Q-8,12 -8,8 Z;
                M-8,0 Q-15,-5 -12,5 Q-10,10 -8,8 Z"
        dur="2s"
        repeatCount="indefinite"
      />
    </path>
    
    <!-- Aile droite -->
    <path d="M8,0 Q15,-5 12,5 Q10,10 8,8 Z" fill="url(#birdGradient)" opacity="0.8">
      <animate
        attributeName="d"
        values="M8,0 Q15,-5 12,5 Q10,10 8,8 Z;
                M8,0 Q18,-3 12,5 Q8,12 8,8 Z;
                M8,0 Q15,-5 12,5 Q10,10 8,8 Z"
        dur="2s"
        repeatCount="indefinite"
        begin="0.5s"
      />
    </path>
    
    <!-- Queue -->
    <path d="M-10,5 Q-15,10 -18,8 L-18,2 Q-15,5 -10,5" fill="url(#birdGradient)" opacity="0.7">
      <animate
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 0 0; 5 0 0; 0 0 0; -5 0 0; 0 0 0"
        dur="3s"
        repeatCount="indefinite"
      />
    </path>
    
    <!-- Onde de message -->
    <g transform="translate(15, 0)">
      <!-- Première onde -->
      <path d="M0,0 Q5,-5 10,0 Q15,5 20,0" stroke="url(#birdGradient)" stroke-width="2" fill="none">
        <animate
          attributeName="d"
          values="M0,0 Q5,-5 10,0 Q15,5 20,0;
                  M0,0 Q5,-3 10,0 Q15,3 20,0;
                  M0,0 Q5,-5 10,0 Q15,5 20,0"
          dur="2s"
          repeatCount="indefinite"
        />
      </path>
      
      <!-- Deuxième onde (décalée) -->
      <path d="M5,-3 Q10,2 15,-3 Q20,-8 25,-3" stroke="url(#birdGradient)" stroke-width="1.5" fill="none" opacity="0.7">
        <animate
          attributeName="d"
          values="M5,-3 Q10,2 15,-3 Q20,-8 25,-3;
                  M5,-3 Q10,-1 15,-3 Q20,-5 25,-3;
                  M5,-3 Q10,2 15,-3 Q20,-8 25,-3"
          dur="2s"
          repeatCount="indefinite"
          begin="0.3s"
        />
      </path>
      
      <!-- Troisième onde (décalée) -->
      <path d="M10,3 Q15,-2 20,3 Q25,8 30,3" stroke="url(#birdGradient)" stroke-width="1" fill="none" opacity="0.5">
        <animate
          attributeName="d"
          values="M10,3 Q15,-2 20,3 Q25,8 30,3;
                  M10,3 Q15,1 20,3 Q25,5 30,3;
                  M10,3 Q15,-2 20,3 Q25,8 30,3"
          dur="2s"
          repeatCount="indefinite"
          begin="0.6s"
        />
      </path>
    </g>
    
    <!-- Points d'envol (traces d'ailes) -->
    <circle cx="-5" cy="-5" r="1.5" fill="url(#birdGradient)" opacity="0.6">
      <animate
        attributeName="opacity"
        values="0.6; 0; 0.6"
        dur="1.5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="r"
        values="1.5; 2; 1.5"
        dur="1.5s"
        repeatCount="indefinite"
      />
    </circle>
    
    <circle cx="5" cy="-7" r="1.5" fill="url(#birdGradient)" opacity="0.6">
      <animate
        attributeName="opacity"
        values="0.6; 0; 0.6"
        dur="1.5s"
        repeatCount="indefinite"
        begin="0.2s"
      />
      <animate
        attributeName="r"
        values="1.5; 2; 1.5"
        dur="1.5s"
        repeatCount="indefinite"
        begin="0.2s"
      />
    </circle>
  </g>
</svg>