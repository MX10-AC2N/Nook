<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    /* Variables de couleurs */
    :root {
      --primary: #4A6FA5;    /* Bleu principal */
      --secondary: #6D98BA;  /* Bleu secondaire */
      --accent: #FF9A76;     /* Corail accent */
      --white: #FFFFFF;
    }
    
    /* Animations subtiles */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }
    
    @keyframes wingFlap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.9); }
    }
    
    @keyframes messagePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* Styles */
    .bird-container {
      animation: gentleFloat 4s ease-in-out infinite;
    }
    
    .bird-body {
      fill: var(--primary);
      stroke: var(--primary);
      stroke-width: 0.5;
      stroke-opacity: 0.3;
    }
    
    .bird-wing {
      fill: var(--secondary);
      animation: wingFlap 1.5s ease-in-out infinite;
      transform-origin: center;
    }
    
    .bird-beak {
      fill: var(--accent);
    }
    
    .message {
      fill: var(--accent);
      animation: messagePulse 3s ease-in-out infinite;
      transform-orzone: center;
    }
    
    .message-fold {
      fill: var(--primary);
      opacity: 0.8;
    }
  </style>
  
  <!-- Oiseau plus grand et mieux positionné -->
  <g class="bird-container" transform="translate(40, 40)">
    <!-- Corps principal de l'oiseau -->
    <ellipse class="bird-body" cx="0" cy="0" rx="18" ry="12"/>
    
    <!-- Tête -->
    <circle class="bird-body" cx="15" cy="-10" r="9"/>
    
    <!-- Œil -->
    <circle cx="17" cy="-12" r="2" fill="var(--white)"/>
    <circle cx="17" cy="-12" r="1" fill="#333"/>
    
    <!-- Bec (pointant vers la droite) -->
    <polygon class="bird-beak" points="22,-10 27,-10 24,-7"/>
    
    <!-- Aile positionnée correctement -->
    <ellipse class="bird-wing" cx="-8" cy="-2" rx="14" ry="8"/>
    
    <!-- Queue -->
    <polygon class="bird-body" points="-18,0 -25,6 -18,6"/>
  </g>
  
  <!-- Message plus petit et mieux proportionné -->
  <g transform="translate(65, 65)">
    <rect class="message" x="0" y="0" width="12" height="9" rx="1.5"/>
    <polygon class="message-fold" points="0,0 6,4.5 12,0"/>
    <text x="6" y="5.5" text-anchor="middle" fill="var(--white)" font-size="3" font-family="Arial, sans-serif" font-weight="bold">N</text>
  </g>
</svg>