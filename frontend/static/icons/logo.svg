<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .bird-body { fill: #4A6FA5; }
    .bird-wing { fill: #6D98BA; }
    .bird-beak { fill: #FF9A76; }
    .message { fill: #FF9A76; }
  </style>
  
  <!-- Oiseau ultra simple -->
  <!-- Corps -->
  <circle class="bird-body" cx="40" cy="50" r="15"/>
  
  <!-- Tête -->
  <circle class="bird-body" cx="55" cy="40" r="8"/>
  
  <!-- Bec -->
  <polygon class="bird-beak" points="62,40 67,40 64,43"/>
  
  <!-- Aile -->
  <ellipse class="bird-wing" cx="35" cy="45" rx="12" ry="7"/>
  
  <!-- Message -->
  <rect class="message" x="65" y="60" width="20" height="12" rx="2"/>
  <polygon points="65,60 75,65 85,60" fill="#4A6FA5"/>
</svg>