<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>
    .letter {
      fill: #000000;
      font-family: 'Courier New', monospace;
      font-weight: 900;
    }
    
    /* Chaque lettre légèrement décalée pour effet graffiti */
    .n1 { transform: translate(0, -2px) rotate(-6deg); }
    .o1 { transform: translate(0, 1px) rotate(2deg); }
    .o2 { transform: translate(0, -1px) rotate(-3deg); }
    .k { transform: translate(0, 2px) rotate(4deg); }
  </style>
  
  <!-- Lettres positionnées individuellement pour un effet graffiti -->
  <text class="letter n1" x="50" y="120" font-size="100">N</text>
  <text class="letter o1" x="130" y="120" font-size="100">O</text>
  <text class="letter o2" x="190" y="120" font-size="100">O</text>
  <text class="letter k" x="260" y="120" font-size="100">K</text>
  
  <!-- Ligne de base (optionnelle) -->
  <line x1="40" y1="125" x2="350" y2="140" stroke="#000" stroke-width="3" opacity="0.1"/>
</svg>