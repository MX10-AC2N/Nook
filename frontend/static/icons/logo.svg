<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dégradés élégants -->
    <linearGradient id="birdPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6FA5"/>
      <stop offset="50%" stop-color="#5D8BB8"/>
      <stop offset="100%" stop-color="#3A5A8F"/>
    </linearGradient>
    
    <linearGradient id="birdSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D98BA"/>
      <stop offset="100%" stop-color="#5A83AA"/>
    </linearGradient>
    
    <linearGradient id="accentWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A76"/>
      <stop offset="100%" stop-color="#FF7A5A"/>
    </linearGradient>
    
    <!-- Filtres pour profondeur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#4A6FA5" flood-opacity="0.15"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="3" dy="3" result="offsetblur"/>
      <feFlood flood-color="#3A5A8F" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Motif de plume -->
    <pattern id="featherTexture" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="15" cy="15" r="1" fill="#FFFFFF" opacity="0.2"/>
      <circle cx="5" cy="5" r="0.5" fill="#FFFFFF" opacity="0.15"/>
      <circle cx="25" cy="25" r="0.5" fill="#FFFFFF" opacity="0.15"/>
    </pattern>
  </defs>
  
  <style>
    /* Animations fluides */
    @keyframes gentleFloat {
      0%, 100% { 
        transform: translateY(0) rotate(0deg); 
      }
      33% { 
        transform: translateY(-8px) rotate(0.3deg); 
      }
      66% { 
        transform: translateY(-4px) rotate(-0.2deg); 
      }
    }
    
    @keyframes wingMotion {
      0%, 100% { 
        transform: rotate(0deg); 
      }
      50% { 
        transform: rotate(8deg); 
      }
    }
    
    @keyframes tailSway {
      0%, 100% { 
        transform: rotate(0deg); 
      }
      33% { 
        transform: rotate(4deg); 
      }
      66% { 
        transform: rotate(-2deg); 
      }
    }
    
    @keyframes envelopeFloat {
      0%, 100% { 
        transform: translateY(0) rotate(0deg); 
      }
      50% { 
        transform: translateY(-5px) rotate(1deg); 
      }
    }
    
    @keyframes messageLines {
      0% { 
        stroke-dashoffset: 100; 
        opacity: 0; 
      }
      50% { 
        opacity: 1; 
      }
      100% { 
        stroke-dashoffset: 0; 
        opacity: 1; 
      }
    }
    
    @keyframes featherDrift {
      0% { 
        transform: translateY(0) rotate(0deg); 
        opacity: 0; 
      }
      20% { 
        opacity: 0.7; 
      }
      100% { 
        transform: translateY(-60px) rotate(120deg); 
        opacity: 0; 
      }
    }
    
    @keyframes sparkle {
      0%, 100% { 
        opacity: 0.3; 
        transform: scale(1); 
      }
      50% { 
        opacity: 1; 
        transform: scale(1.1); 
      }
    }
    
    /* Styles des éléments */
    .bird-container {
      filter: url(#softGlow);
      animation: gentleFloat 6s ease-in-out infinite;
      transform-origin: center;
    }
    
    .bird-body {
      fill: url(#birdPrimary);
      stroke: #3A5A8F;
      stroke-width: 0.8;
      stroke-opacity: 0.3;
    }
    
    .bird-wing {
      fill: url(#birdSecondary);
      animation: wingMotion 2.5s ease-in-out infinite;
      transform-origin: 70% 50%;
      filter: url(#dropShadow);
    }
    
    .bird-tail {
      fill: url(#birdSecondary);
      animation: tailSway 3s ease-in-out infinite;
      transform-origin: 10% 60%;
    }
    
    .bird-head {
      fill: url(#birdPrimary);
    }
    
    .bird-eye {
      fill: #FFFFFF;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
    }
    
    .bird-eye-pupil {
      fill: #1A3A6C;
    }
    
    .bird-beak {
      fill: url(#accentWarm);
      filter: drop-shadow(0 2px 3px rgba(255,122,90,0.3));
    }
    
    .envelope {
      fill: url(#accentWarm);
      animation: envelopeFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 3px 5px rgba(255,122,90,0.3));
    }
    
    .envelope-detail {
      fill: #FF6B4A;
    }
    
    .message-line {
      stroke: url(#accentWarm);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      fill: none;
      animation: messageLines 2s ease-out infinite;
      opacity: 0.7;
    }
    
    .feather {
      fill: #FFFFFF;
      opacity: 0;
    }
    
    .sparkle {
      fill: #FFFFFF;
      opacity: 0.3;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    .text-nook {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #3A5A8F;
      text-anchor: middle;
    }
    
    .text-subtitle {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 4px;
      fill: #6D98BA;
      text-anchor: middle;
      text-transform: uppercase;
    }
    
    /* Animations individuelles */
    .feather1 { animation: featherDrift 5s infinite 0.5s; }
    .feather2 { animation: featherDrift 5s infinite 1s; }
    .feather3 { animation: featherDrift 5s infinite 1.5s; }
    
    /* Interactions */
    svg:hover .bird-container {
      animation-duration: 4s;
    }
    
    svg:hover .bird-wing {
      animation-duration: 1.5s;
    }
    
    svg:hover .envelope {
      animation-duration: 3s;
    }
  </style>
  
  <!-- Fond élégant -->
  <rect width="400" height="400" fill="#F8FBFF"/>
  
  <!-- Oiseau principal - Gros et reconnaissable -->
  <g class="bird-container" transform="translate(200, 160)">
    <!-- Corps de l'oiseau (forme reconnaissable) -->
    <path class="bird-body" d="M-80,0 
      C-100,-30 -60,-60 -30,-40 
      C0,-20 30,-40 60,-20 
      C90,0 100,30 80,60 
      C60,90 20,90 -10,70 
      C-40,50 -60,30 -80,0Z"/>
    
    <!-- Texture de plumes subtile -->
    <rect x="-80" y="-60" width="160" height="130" fill="url(#featherTexture)" opacity="0.1" rx="40"/>
    
    <!-- Aile supérieure -->
    <path class="bird-wing" d="M-40,-20 
      C-20,-50 20,-60 40,-40 
      C60,-20 40,10 10,20 
      C-20,30 -60,10 -40,-20Z"/>
    
    <!-- Queue -->
    <path class="bird-tail" d="M60,40 
      C80,60 90,80 70,100 
      C50,120 20,110 10,90 
      C0,70 20,50 40,40 
      C50,30 60,30 60,40Z"/>
    
    <!-- Tête -->
    <circle class="bird-head" cx="-50" cy="-30" r="25"/>
    
    <!-- Œil -->
    <circle class="bird-eye" cx="-45" cy="-35" r="9"/>
    <circle class="bird-eye-pupil" cx="-42" cy="-38" r="4"/>
    
    <!-- Reflet dans l'œil -->
    <circle cx="-47" cy="-37" r="2" fill="#FFFFFF"/>
    
    <!-- Bec -->
    <path class="bird-beak" d="M-25,-25 
      L5,-15 
      L0,0 
      Z"/>
    
    <!-- Détail du bec -->
    <line x1="-15" y1="-20" x2="-5" y2="-10" stroke="#FF6B4A" stroke-width="1.5"/>
  </g>
  
  <!-- Enveloppe du message -->
  <g transform="translate(120, 180)">
    <rect class="envelope" x="0" y="0" width="50" height="35" rx="4"/>
    <polygon class="envelope-detail" points="0,0 25,15 50,0"/>
    
    <!-- Lignes du message -->
    <line x1="10" y1="12" x2="40" y2="12" stroke="white" stroke-width="2"/>
    <line x1="15" y1="18" x2="35" y2="18" stroke="white" stroke-width="2"/>
    <line x1="10" y1="24" x2="40" y2="24" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Lignes de connexion entre l'oiseau et l'enveloppe -->
  <path class="message-line" d="M170,180 Q190,160 210,150 Q230,140 250,150"/>
  
  <!-- Plumes qui s'envolent -->
  <g>
    <path class="feather feather1" d="M100,250 
      Q110,245 115,250 
      Q120,255 115,260 
      Q110,265 100,260 
      Q95,255 100,250Z"/>
    
    <path class="feather feather2" d="M300,220 
      Q310,215 315,220 
      Q320,225 315,230 
      Q310,235 300,230 
      Q295,225 300,220Z"/>
    
    <path class="feather feather3" d="M180,300 
      Q190,295 195,300 
      Q200,305 195,310 
      Q190,315 180,310 
      Q175,305 180,300Z"/>
  </g>
  
  <!-- Points lumineux décoratifs -->
  <circle class="sparkle" cx="80" cy="100" r="3"/>
  <circle class="sparkle" cx="320" cy="80" r="2"/>
  <circle class="sparkle" cx="150" cy="320" r="2.5"/>
  <circle class="sparkle" cx="280" cy="280" r="3"/>
  
  <!-- Texte -->
  <text class="text-nook" x="200" y="360">NOOK</text>
  <text class="text-subtitle" x="200" y="390">Messagerie sécurisée</text>
</svg>