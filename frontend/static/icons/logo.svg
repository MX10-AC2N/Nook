<?xml version="1.0" encoding="UTF-8"?>
<!--  Nook – Oiseau messager en vol  -->
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="100%" height="100%"
    viewBox="0 0 100 100"
    preserveAspectRatio="xMidYMid meet">

  <!-- ====================  Définitions de couleurs  ==================== -->
  <defs>
    <!-- Couleurs principales -->
    <linearGradient id="birdBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>   <!-- Bleu profond -->
      <stop offset="100%" stop-color="#0099FF"/> <!-- Bleu clair -->
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#66CFFF"/>
    </linearGradient>
    <style>
      .bird-body { fill:url(#birdBodyGrad); }
      .wing      { fill:url(#wingGrad); }
      .label     { font-family:Arial,Helvetica,sans-serif;
                   font-weight:600; fill:#222222; }
    </style>
  </defs>

  <!-- ====================  Oiseau (corps + ailes)  ==================== -->
  <g id="bird" transform-origin="50 55">
    <!-- Corps principal -->
    <path class="bird-body"
          d="M45,55 C48,45 52,45 55,55
             C58,65 53,73 47,73
             C41,73 38,65 41,55 Z"/>
    <!-- Aile gauche -->
    <path class="wing"
          d="M45,55 C35,40 20,38 15,55
             C10,72 28,68 33,60 Z"/>
    <!-- Aile droite -->
    <path class="wing"
          d="M55,55 C65,40 80,38 85,55
             C90,72 72,68 67,60 Z"/>
  </g>

  <!-- ====================  Texte (optionnel)  ==================== -->
  <g id="label" transform="translate(0,78)" text-anchor="middle">
    <text class="label" x="50" y="0" font-size="9">NOOK</text>
  </g>

  <!-- ====================  Animations  ==================== -->
  <!-- 1️⃣ Battement d’ailes (rotation locale) -->
  <animateTransform xlink:href="#bird"
                    attributeName="transform"
                    type="rotate"
                    values="-5 45 55; 5 45 55; -5 45 55"
                    dur="0.8s"
                    repeatCount="indefinite"/>

  <!-- 2️⃣ Décollage vertical + inclinaison progressive -->
  <animateTransform attributeName="transform"
                    type="translate"
                    from="0 0"
                    to="0 -30"
                    dur="2s"
                    fill="freeze"
                    begin="0s"/>

  <!-- Inclinaison du corps pendant le décollage (légère) -->
  <animateTransform attributeName="transform"
                    type="rotate"
                    from="0 50 55"
                    to="-15 50 55"
                    dur="2s"
                    fill="freeze"
                    begin="0s"/>

</svg>