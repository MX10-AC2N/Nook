<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <style>
    :root {
      --blue: #4A90E2;
      --light-blue: #7BB1F0;
      --orange: #FF9500;
      --dark: #2C3E50;
      --light: #ECF0F1;
    }
    
    @keyframes flyUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    @keyframes wingMotion {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.85); }
    }
    
    .bird-body {
      fill: var(--blue);
      animation: flyUp 3s ease-in-out infinite;
    }
    
    .bird-wing {
      fill: var(--light-blue);
      animation: wingMotion 1.2s ease-in-out infinite;
      transform-origin: center;
    }
    
    .bird-beak {
      fill: var(--orange);
    }
    
    .message-bubble {
      fill: var(--orange);
      filter: drop-shadow(0 3px 5px rgba(255, 149, 0, 0.3));
    }
    
    .logo-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 40px;
      font-weight: 700;
      fill: var(--dark);
      letter-spacing: 0.5px;
    }
    
    .logo-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      fill: var(--blue);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
  
  <rect width="300" height="300" fill="var(--light)" rx="20"/>
  
  <!-- Oiseau très simple et reconnaissable -->
  <g transform="translate(150, 140)">
    <!-- Corps -->
    <circle class="bird-body" cx="0" cy="0" r="40"/>
    
    <!-- Tête -->
    <circle class="bird-body" cx="35" cy="-25" r="18"/>
    
    <!-- Œil -->
    <circle cx="40" cy="-30" r="4" fill="white"/>
    <circle cx="40" cy="-30" r="2" fill="var(--dark)"/>
    
    <!-- Bec -->
    <path class="bird-beak" d="M50,-25 L70,-20 L65,-10 Z"/>
    
    <!-- Aile -->
    <ellipse class="bird-wing" cx="-15" cy="5" rx="25" ry="15"/>
  </g>
  
  <!-- Message -->
  <g transform="translate(110, 200)">
    <rect class="message-bubble" x="0" y="0" width="80" height="40" rx="8"/>
    <text x="40" y="25" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Nook</text>
  </g>
  
  <!-- Texte -->
  <text class="logo-name" x="150" y="260" text-anchor="middle">NOOK</text>
  <text class="logo-tagline" x="150" y="285" text-anchor="middle">Pour la famille</text>
</svg>