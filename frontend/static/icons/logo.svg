<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>
    .letter {
      fill: none;
      stroke: currentColor;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: 100px;
      transform-origin: center bottom;
    }

    /* Animation de dessin (stroke-dasharray) pour chaque lettre */
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fillIn {
      from { fill: none; }
      to { fill: currentColor; }
    }

    @keyframes bounceGraffiti {
      0% { transform: translateY(-100px) rotate(0) scale(0); opacity: 0; }
      50% { transform: translateY(10px) rotate(var(--rot)) scale(1.15); opacity: 1; }
      70% { transform: translateY(-5px) rotate(var(--rot)) scale(0.95); }
      100% { transform: translateY(0) rotate(var(--rot)) scale(1); opacity: 1; }
    }

    @keyframes splatter {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.8); }
    }

    .n1 { --rot: -6deg; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 0.8s ease-out 0.2s forwards, fillIn 0.8s ease-out 1s forwards, bounceGraffiti 1s ease-out 0.2s forwards; }
    .o1 { --rot: 2deg; stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw 0.8s ease-out 0.5s forwards, fillIn 0.8s ease-out 1.3s forwards, bounceGraffiti 1s ease-out 0.5s forwards; }
    .o2 { --rot: -3deg; stroke-dasharray: 320; stroke-dashoffset: 320; animation: draw 0.8s ease-out 0.8s forwards, fillIn 0.8s ease-out 1.6s forwards, bounceGraffiti 1s ease-out 0.8s forwards; }
    .k  { --rot: 4deg; stroke-dasharray: 350; stroke-dashoffset: 350; animation: draw 0.8s ease-out 1.1s forwards, fillIn 0.8s ease-out 1.9s forwards, bounceGraffiti 1s ease-out 1.1s forwards; }

    /* Effet splatter (taches de peinture) autour des lettres */
    .splatter {
      fill: currentColor;
      opacity: 0.4;
    }

    .s1 { animation: splatter 0.6s ease-out 1.2s forwards; }
    .s2 { animation: splatter 0.6s ease-out 1.5s forwards; }
    .s3 { animation: splatter 0.6s ease-out 1.8s forwards; }
    .s4 { animation: splatter 0.6s ease-out 2.1s forwards; }
  </style>

  <!-- Lettres avec stroke pour animation draw -->
  <text class="letter n1" x="50" y="120">N</text>
  <text class="letter o1" x="130" y="120">O</text>
  <text class="letter o2" x="190" y="120">O</text>
  <text class="letter k" x="260" y="120">K</text>

  <!-- Effet splatter (taches de peinture aléatoires pour vibe graffiti) -->
  <circle class="splatter s1" cx="40" cy="80" r="8"/>
  <circle class="splatter s2" cx="120" cy="140" r="6"/>
  <circle class="splatter s3" cx="200" cy="70" r="10"/>
  <circle class="splatter s4" cx="280" cy="150" r="7"/>

  <circle class="splatter s1" cx="80" cy="110" r="5"/>
  <circle class="splatter s2" cx="160" cy="90" r="9"/>
  <circle class="splatter s3" cx="240" cy="130" r="6"/>
  <circle class="splatter s4" cx="320" cy="100" r="8"/>

  <!-- Ligne de base subtile avec fade in -->
  <line x1="40" y1="125" x2="350" y2="140" stroke="currentColor" stroke-width="3" opacity="0">
    <animate attributeName="opacity" from="0" to="0.2" dur="2s" begin="2s" fill="freeze"/>
  </line>
</svg>