<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    /* Variables de couleurs */
    :root {
      --primary: #4A6FA5;
      --secondary: #6D98BA;
      --accent: #FF9A76;
      --white: #FFFFFF;
    }
    
    /* Animation de flottement */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }
    
    /* Styles */
    .bird-body {
      fill: var(--primary);
    }
    
    .bird-wing {
      fill: var(--secondary);
    }
    
    .bird-beak {
      fill: var(--accent);
    }
    
    .message-bubble {
      fill: var(--accent);
    }
    
    /* Application de l'animation au groupe oiseau */
    #bird-group {
      animation: float 3s ease-in-out infinite;
    }
  </style>
  
  <!-- Groupe oiseau (animé) -->
  <g id="bird-group">
    <!-- Corps de l'oiseau (forme de goutte) -->
    <path class="bird-body" d="M35,50 
      C25,40 30,25 45,30 
      C60,35 70,45 65,60 
      C60,75 45,80 35,70 
      C25,60 30,50 35,50Z"/>
    
    <!-- Tête -->
    <circle class="bird-body" cx="60" cy="35" r="10"/>
    
    <!-- Œil -->
    <circle cx="62" cy="33" r="1.5" fill="var(--white)"/>
    
    <!-- Bec -->
    <polygon class="bird-beak" points="68,35 73,35 70,38"/>
    
    <!-- Aile (forme simplifiée) -->
    <ellipse class="bird-wing" cx="40" cy="45" rx="12" ry="7"/>
  </g>
  
  <!-- Message (petit et discret) -->
  <g transform="translate(70, 60)">
    <rect class="message-bubble" x="0" y="0" width="15" height="10" rx="2"/>
    <polygon points="0,0 7.5,5 15,0" fill="var(--primary)" opacity="0.8"/>
    <text x="7.5" y="6" text-anchor="middle" fill="var(--white)" font-size="4" font-family="Arial, sans-serif">N</text>
  </g>
</svg>