<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4ade80" />

    <!-- ==== PLACEHOLDER ==== -->
    <!-- Le middleware Axum remplacera cette ligne par :
         <base href="http://192.168.1.192:6300">   (LAN)
         ou <base href="https://mon‑site.exemple.com"> (prod) -->
    <base-placeholder/>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://media.tenor.com https://c.tenor.com data: blob:; connect-src 'self' wss: ws:; font-src 'self'; media-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self';">
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover" class="theme-jardin">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
