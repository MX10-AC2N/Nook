<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4ade80" />

    <!-- Session 36 : base-placeholder supprimé — SvelteKit adapter-static génère
         des assets avec paths absolus (/_app/...) qui n'ont pas besoin de <base href>.
         Le middleware base_inject_middleware a été supprimé de main.rs.

         Session 37 : meta CSP supprimée — SvelteKit adapter-static génère des scripts
         inline (hydratation, __sveltekit_data) bloqués par script-src 'self'.
         Sur homeserver familial self-hosted, la sécurité vient de l'auth backend
         + HTTPS Nginx + réseau LAN. La CSP meta apportait une fausse protection
         tout en cassant 100% des tests E2E (0 requêtes backend en CI headless). -->
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover" class="theme-jardin">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- CSP_NONCE_PLACEHOLDER -->
  </body>
</html>
