<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4ade80" />

    <!-- Session 36 : base-placeholder supprimé — SvelteKit adapter-static génère
         des assets avec paths absolus (/_app/...) qui n'ont pas besoin de <base href>.
         Le middleware base_inject_middleware a été supprimé de main.rs. -->

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://media.tenor.com https://c.tenor.com data: blob:; connect-src 'self' wss: ws:; font-src 'self'; media-src 'self' blob:; worker-src 'self'; object-src 'none';">
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover" class="theme-jardin">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
