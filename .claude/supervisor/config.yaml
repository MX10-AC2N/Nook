supervisor:
  version: "1.0.0"
  enabled: true
  
  # Configuration des modèles disponibles
  models:
    haiku:
      provider: anthropic
      name: claude-haiku-20240307
      cost_per_1k_input: 0.25
      cost_per_1k_output: 1.25
      max_tokens: 200000
      quality_score: 7.0
      
    sonnet:
      provider: anthropic
      name: claude-3-5-sonnet-20241022
      cost_per_1k_input: 3.0
      cost_per_1k_output: 15.0
      max_tokens: 200000
      quality_score: 8.5
      
    opus:
      provider: anthropic
      name: claude-3-opus-20240229
      cost_per_1k_input: 15.0
      cost_per_1k_output: 75.0
      max_tokens: 200000
      quality_score: 9.5

  # Mapping complexité → modèle
  routing:
    simple: haiku
    moderate: sonnet
    complex: opus
    critical: opus
  
  # Budgets et limites
  cost_limits:
    daily_budget: 50.00
    per_task_max: 5.00
    alert_threshold_percent: 80
  
  # Qualité minimale requise
  quality_thresholds:
    minimum_score: 7.0
    critical_minimum: 9.0
  
  # Intégration avec les rôles existants
  roles_integration:
    scan_roles_dir: true
    roles_path: ".claude/roles"
    auto_create_agents: true