name: 🧪 E2E — Test ciblé par nom

# Lancer un seul test (ou un groupe) Playwright sans tout le pipeline Docker
# Utile pendant le debug pour itérer vite sur un test qui échoue
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Filtre de test (ex: 'Login valide', 'Admin', 'Chat')"
        required: true
        default: ""
      debug_mode:
        description: "Mode debug (trace + screenshots)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  frontend:
    name: "Build Frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build
          retention-days: 1

  backend:
    name: "Build Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build
        env:
          SQLX_OFFLINE: true
        run: cargo build --manifest-path backend/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: nook-backend
          path: backend/target/release/nook-backend
          retention-days: 1

  e2e-targeted:
    name: "🧪 Test : ${{ inputs.test_filter }}"
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nook-frontend
          path: frontend/build

      - uses: actions/download-artifact@v4
        with:
          name: nook-backend
          path: backend/target/release/

      - name: Démarrer le backend
        run: |
          chmod +x backend/target/release/nook-backend
          mkdir -p /tmp/nook-data /tmp/nook-uploads
          cat > /tmp/nook.env << EOF
          DATABASE_URL=sqlite:/tmp/nook-data/nook.db
          ALLOWED_ORIGINS=http://localhost:6300
          JWT_SECRET=e2e-test-secret-key-for-ci-only
          UPLOAD_DIR=/tmp/nook-uploads
          BACKEND_PORT=3000
          E2E_SETUP=1
          EOF
          env $(cat /tmp/nook.env | xargs) backend/target/release/nook-backend &
          # Attendre que le backend soit prêt
          for i in $(seq 1 20); do
            curl -sf http://localhost:6300/api/health | grep -q "OK" && break
            sleep 3
          done
          echo "✅ Backend prêt"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Playwright
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install chromium

      - name: Lancer test ciblé
        working-directory: ./frontend
        env:
          CI: true
          PWDEBUG: ${{ inputs.debug_mode == 'true' && '1' || '0' }}
        run: |
          if [ -n "${{ inputs.test_filter }}" ]; then
            npx playwright test --grep "${{ inputs.test_filter }}" --reporter=list
          else
            npx playwright test --reporter=list
          fi

      - name: Upload traces (si debug)
        if: inputs.debug_mode == 'true' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 3

      - name: Résumé
        if: always()
        run: |
          echo "## 🧪 Test ciblé : \`${{ inputs.test_filter }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Debug mode : ${{ inputs.debug_mode }}" >> $GITHUB_STEP_SUMMARY
