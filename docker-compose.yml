services:
  nook:
    build:
      context: .
      dockerfile: Dockerfile
    image: nook:latest
    container_name: nook
    restart: unless-stopped

    ports:
      - "6300:3000"

    volumes:
      - nook-data:/app/data
      - nook-logs:/app/logs

    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:/app/data/nook.db
      - STATIC_FILES_DIR=/app/static
      - UPLOADS_DIR=/app/data/uploads
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:6300}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    networks:
      - nook-network

networks:
  nook-network:
    driver: bridge
    name: nook-network

volumes:
  data:
    driver: local

    