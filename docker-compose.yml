version: '3.8'

services:
  nook:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Plus besoin de PUBLIC_SITE_URL avec injection dynamique
        BUILDKIT_INLINE_CACHE: 1
    
    image: nook:latest
    container_name: nook-backend
    
    # Redémarrage automatique
    restart: unless-stopped
    
    # Ports
    ports:
      - "6300:3000"
    
    # Variables d'environnement
    environment:
      - RUST_LOG=info
      - DATABASE_URL=sqlite:/app/data/nook.db
      - PORT=3000
    
    # Volumes persistants
    volumes:
      # Base de données SQLite
      - nook-data:/app/data
      # Uploads utilisateurs
      - nook-uploads:/app/data/uploads
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "/app/nook-backend", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Limites de ressources (optionnel mais recommandé)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    
    # Réseau
    networks:
      - nook-network
    
    # Sécurité : mode read-only sauf pour /app/data
    read_only: true
    tmpfs:
      - /tmp
    
    # Capabilities Linux minimales
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =====================================================
# Volumes nommés
# =====================================================
volumes:
  nook-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  
  nook-uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/uploads

# =====================================================
# Réseau
# =====================================================
networks:
  nook-network:
    driver: bridge