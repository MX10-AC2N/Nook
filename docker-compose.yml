services:
  nook:
    image: ghcr.io/mx10-ac2n/nook:v0.5.0-beta.1
    container_name: nook
    restart: unless-stopped

    ports:
      - "${PORT:-6300}:3000"

    volumes:
      - "${DATA_DIR:-./nook-data}:/app/data"
      - "${LOGS_DIR:-./nook-logs}:/app/logs"

    environment:
      - PORT=${PORT:-3000}
      - TZ=${TZ:-Europe/Paris}
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/nook.db}
      - STATIC_FILES_DIR=${STATIC_FILES_DIR:-/app/static}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/data/uploads}
      - GIFS_DIR=${GIFS_DIR:-/app/data/gifs}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:${PORT:-6300}}
      - E2E_SETUP=${E2E_SETUP:-0}
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-60}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - GIPHY_API_KEY=${GIPHY_API_KEY:-}
      - TURN_SECRET=${TURN_SECRET:-}
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-0}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@nook.local}

    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-1.5}"
          memory: "${MEMORY_LIMIT:-1028M}"
        reservations:
          cpus: "${CPUS_RESERVATION:-0.5}"
          memory: "${MEMORY_RESERVATION:-256M}"

    networks:
      - nook-network

  turn:
    image: ghcr.io/mx10-ac2n/turn-server:v0.5.0-beta.1
    container_name: nook-turn
    restart: unless-stopped

    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"

    volumes:
      - "${TURN_CONFIG_DIR:-./turn-config}:/etc/turn-server:ro"

    environment:
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_PORT=${TURN_PORT:-3478}

    networks:
      - nook-network

networks:
  nook-network:
    driver: bridge
