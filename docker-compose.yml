services:
  # Service init : chown les volumes pour nonroot (uid 65532) avant démarrage
  # Utilise une image alpine minimaliste, exit 0 immédiatement après
  nook-init:
    image: alpine:3
    command: sh -c "chown -R 65532:65532 /app/data /app/logs"
    volumes:
      - nook-data:/app/data
      - nook-logs:/app/logs

  nook:
    build:
      context: .
      dockerfile: Dockerfile
    image: nook:latest
    container_name: nook
    restart: unless-stopped
    depends_on:
      nook-init:
        condition: service_completed_successfully

    ports:
      - "6300:3000"

    volumes:
      - nook-data:/app/data
      - nook-logs:/app/logs

    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:/app/data/nook.db
      - STATIC_FILES_DIR=/app/static
      - UPLOADS_DIR=/app/data/uploads
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:6300}


    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    networks:
      - nook-network

networks:
  nook-network:
    driver: bridge
    name: nook-network

volumes:
  nook-data:
    driver: local
  nook-logs:
    driver: local
