services:
  nook:
    image: ghcr.io/mx10-ac2n/nook:v0.2.0-beta.1
    container_name: nook
    restart: unless-stopped

    ports:
      - "6300:3000"

    volumes:
      - nook-data:/app/data
      - nook-logs:/app/logs

    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:/app/data/nook.db
      - STATIC_FILES_DIR=/app/static
      - UPLOADS_DIR=/app/data/uploads
      # URL publique principale — toujours incluse dans les origines CORS
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://localhost:6300}
      # Origines CORS supplémentaires séparées par des virgules
      # Exemple : http://192.168.1.192:6300,https://nook.mondomain.com
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}

    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1028M
        reservations:
          cpus: "0.5"
          memory: 256M

    networks:
      - nook-network

networks:
  nook-network:
    driver: bridge
    name: nook-network

volumes:
  nook-data:
    driver: local
  nook-logs:
    driver: local
