[package]
name = "nook-backend"
version = "0.5.0-beta.1"
edition = "2021"

[dependencies]
dotenvy = "0.15"
hostname = "0.4"
axum = { version = "0.8", features = ["ws", "multipart", "tokio"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6.8", features = ["fs", "cors", "compression-br"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tower-service = "0.3"
http = "1.0"
serde_urlencoded = "0.7"
urlencoding = "2.1"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

# HTTP client — rustls par défaut dans reqwest 0.13
reqwest = { version = "0.13", features = ["json"] }

# rand 0.9 pour webrtc.rs
rand = { version = "0.9", features = ["std", "std_rng", "os_rng"] }

# rand_core 0.6 explicitement pour argon2 (diamond dep fix)
rand_core = { version = "0.6", features = ["std", "getrandom"] }

# Auth & crypto
argon2 = "0.5"
chacha20poly1305 = { version = "0.10.1" }
hmac = "0.12"
sha1 = "0.10"
base64ct = { version = "1.6", features = ["alloc"] }

# Cryptographie VAPID (notifications push) — ring via rustls transitif
# Nécessaire pour signer le JWT ES256 sans dépendance web-push (D10)
ring = "0.17"

# Headers
headers = "0.4"

# Rate limiting — governor seul, sans tower_governor
# tower_governor 0.8 tire tonic (optionnel mais résolu par Cargo)
# → tonic tire async-trait → crash proc-macro dans Docker
# governor directement suffit pour implémenter le rate limiting dans Axum
governor = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Compatibilité
home = "0.5"
sysinfo = "0.32"

# SFU pour appels groupe 3+ participants
rustrtc = "0.3.40"