[package]
name = "nook-backend"
version = "0.1.1"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6.8", features = ["fs", "cors", "compression-br"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tower-service = "0.3"
http = "1.0"
serde_urlencoded = "0.7"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", features = ["std_rng"] }

# Auth & crypto
argon2 = "0.5"
chacha20poly1305 = { version = "0.10.1" }

# Headers pour ContentDisposition (version 0.4.x)
headers = "0.4"

# Rate limiting
tower_governor = "0.4.3"
governor = "0.6"

# Logging (remplace env_logger)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Compatibilité
home = "0.5"
base64ct = "1.6"