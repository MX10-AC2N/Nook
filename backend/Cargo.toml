[package]
name = "nook-backend"
version = "0.1.1"
edition = "2021"

[dependencies]
dotenv = "0.15"
axum = { version = "0.8", features = ["ws", "multipart", "tokio"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6.8", features = ["fs", "cors", "compression-br"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tower-service = "0.3"
http = "1.0"
openssl = { version = "0.10", features = ["vendored"] }
serde_urlencoded = "0.7"
reqwest = { version = "0.13", features = ["json"] }
urlencoding = "2.1"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.9", features = ["std", "std_rng", "os_rng"] }

# Auth & crypto
argon2 = "0.5"
chacha20poly1305 = { version = "0.10.1" }
base64ct = { version = "1.6", features = ["alloc"] }

# Headers
headers = "0.4"

# Rate limiting
tower_governor = "0.8"
governor = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Compatibilité
home = "0.5"
bytes = "1"
