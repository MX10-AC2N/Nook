[package]
name = "nook-backend"
version = "0.5.0-beta.1"
edition = "2021"

[dependencies]
dotenvy = "0.15"
hostname = "0.4"
rustrtc = "0.3.52"
axum = { version = "0.8", features = ["ws", "multipart", "tokio"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["fs", "cors", "compression-br", "compression-gzip", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tower-service = "0.3"
http = "1.0"
serde_urlencoded = "0.7"
urlencoding = "2.1"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

# HTTP client — rustls par défaut dans reqwest 0.13
reqwest = { version = "0.13", features = ["json"] }

# rand 0.10 pour webrtc.rs
rand = { version = "0.10", features = ["std", "std_rng"] }

# rand_core 0.6 explicitement pour argon2 (diamond dep fix)
rand_core = { version = "0.6", features = ["std", "getrandom"] }

# Auth & crypto
argon2 = "0.5"
chacha20poly1305 = { version = "0.10.1" }
base64ct = { version = "1.6", features = ["alloc"] }
hmac = "0.13"
sha1 = "0.11"

# Cryptographie VAPID (notifications push) — ring via rustls transitif
# Nécessaire pour signer le JWT ES256 sans dépendance web-push (D10)
ring = "0.17"

# Headers
headers = "0.4"

# Rate limiting — governor seul, sans tower_governor
# tower_governor 0.8 tire tonic (optionnel mais résolu par Cargo)
# → tonic tire async-trait → crash proc-macro dans Docker
# governor directement suffit pour implémenter le rate limiting dans Axum
governor = "0.10"

# DT-04 — partage de l'état du rate limiter entre instances via Redis.
# governor 0.10 n'expose PAS de store Redis (pas de RedisKeyedStateStore) ;
# on implémente un StateStore custom (src/redis_rate_limiter.rs) persisté dans
# Redis. r2d2 = pool de connexions synchrones partagé par le store.
redis = { version = "0.27", features = ["r2d2"] }
# Pool r2d2 public (redis ré-exporte ManageConnection pour Client mais garde
# son module r2d2 privé) — on utilise le crate r2d2 directement.
r2d2 = "0.8"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Tower (required for CSP middleware Layer/Service traits)
tower = "0.5"

# Rate limiting
home = "0.5"
# CI trigger: zigbuild test
