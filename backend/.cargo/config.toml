# Configuration de compilation musl (Alpine)
# x86_64: cible native du runner (musl natif — pas besoin de config)
# aarch64: cross-compilation via zig cc (non utilise en CI x86_64)

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
