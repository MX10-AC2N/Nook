# Configuration de compilation musl (Alpine 3.21)
# x86_64: cible native, musl-gcc fourni par musl-tools
# aarch64: cross-compilation (non utilise en CI)

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
