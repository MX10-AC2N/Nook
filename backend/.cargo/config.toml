# Configuration de compilation pour cibles musl (Alpine)
# x86_64: musl-gcc natif (pas besoin de config)
# aarch64: zig cc comme cross-linker (configure dans Backend.yml via RUSTFLAGS)

[target.aarch64-unknown-linux-musl]
linker = "zig cc"
rustflags = ["-C", "link-args=-target aarch64-linux-musl"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
